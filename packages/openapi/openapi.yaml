        change feed under you.
      x-cli-command: domains clear-catch-all
      parameters:
        - $ref: "#/components/parameters/Domain"
      responses:
        "200":
          description: The domain, without a catch-all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes:
    post:
      operationId: createMailbox
      summary: Create a personal mailbox for a human or an agent, with an address on one of the organization's standalone domains.
      description: >
        Only admins can create mailboxes. The address becomes the mailbox's
