    get:
      operationId: listScreenedSenders
      summary: List the senders a mailbox has let in or blocked.
      description: >
        Each address and domain, with its decision, when it was made and by
        whom, newest first. Only those who can read the mailbox can list them.
      x-cli-command: screener senders
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The screened senders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenedSenderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/screener/senders/{sender}:
    delete:
      operationId: removeScreenedSender
      summary: Remove a mailbox's decision on a sender, so they are first-time again.
      description: >
        Their later mail waits in the Screener again, unless the mailbox has
