        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGroup
      summary: Delete a group, so that mail to its address is refused from now on.
      description: >
        SES refuses mail to the group's address at once, and the address can
        be given to a mailbox or another group at once. The copies its members
        got stay theirs. Only admins can delete groups. Deleting one is a
        change to the organization's setup, recorded in its change feed under
