      summary: Read All mailboxes, every mailbox you can read taken together, with how many threads in their Inboxes are unread.
      description: >
        All mailboxes is a human's own mailboxes, or for an agent its
        sponsor's that its sponsor access covers. Each list, count and search
        of one mailbox also works on All mailboxes, under /all-mailboxes, and
        each thread there names its mailbox and the address it came to. A
        message delivered to two of them is two threads, one in each, and
        acting on one leaves the other as it is. Lists each mailbox with its
        own unread count, and the sum.
      x-cli-all-mailboxes: mailboxes get
      responses:
        "200":
          description: The mailboxes, with their unread counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxes"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/changes:
    get:
      operationId: listAllMailboxesChanges
      summary: List the changes in each of All mailboxes after where you left off, in one call.
      description: >
        Lists up to 100 changes of each mailbox's change feed, oldest first,
        leaving out the arrivals of mail judged to be spam unless asked for
        them. To catch up, call again with the position the answer ends at
        until it lists no more. A mailbox that joins All mailboxes later is
        listed from its start.
      x-cli-all-mailboxes: mailboxes changes
      parameters:
        - name: after
          in: query
          description: The position to list changes after, as an answer gave it. Leave it out to list from the start.
          schema:
            type: string
        - name: spam
          in: query
          description: Lists the arrivals of mail judged to be spam too.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The changes after the position, by mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/threads:
    get:
      operationId: listAllMailboxesThreads
      summary: List the threads in All mailboxes with a label, newest first.
      description: >
        Lists the threads of every mailbox with the label, merged newest first
        by their newest message, a page at a time. A label of the mailboxes'
        own is given by its name, and lists the label of that name in each
        mailbox that has one. To read the next page, call again with the
        answer's next as after, until an answer has no next.
      x-cli-all-mailboxes: threads list
      parameters:
        - name: label
          in: query
          description: The label the threads carry, a built-in label's ID or the name of a label of the mailboxes' own, in any case. inbox, the default, lists the Inbox.
          schema:
            type: string
            default: inbox
        - $ref: "#/components/parameters/AllMailboxesLimit"
        - $ref: "#/components/parameters/AllMailboxesAfter"
      responses:
        "200":
          description: A page of the threads with the label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/sent:
    get:
      operationId: listAllMailboxesSentThreads
      summary: List the threads All mailboxes have sent mail in, newest first.
      description: >
        Lists every thread with a message sent from one of the mailboxes,
        except those in Spam and Trash, merged newest first by its newest
        message, a page at a time. To read the next page, call again with
        the answer's next as after, until an answer has no next.
      x-cli-all-mailboxes: threads sent
      parameters:
        - $ref: "#/components/parameters/AllMailboxesLimit"
        - $ref: "#/components/parameters/AllMailboxesAfter"
      responses:
        "200":
          description: A page of the threads the mailboxes have sent in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/all-mail:
    get:
      operationId: listAllMailboxesAllMail
      summary: List every thread in All mailboxes except those in Spam and Trash, newest first.
      description: >
        Lists archived threads too, merged newest first by their newest
        message, a page at a time. To read the next page, call again with the
        answer's next as after, until an answer has no next.
      x-cli-all-mailboxes: threads all-mail
      parameters:
        - $ref: "#/components/parameters/AllMailboxesLimit"
        - $ref: "#/components/parameters/AllMailboxesAfter"
      responses:
        "200":
          description: A page of the threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/reminders:
    get:
      operationId: listAllMailboxesReminders
      summary: List the threads set aside in All mailboxes' Remind me, the soonest back first.
      description: >
        Lists the threads waiting in each mailbox's Remind me, merged so the
        one that comes back soonest is first, each with its reminder, a page
        at a time. To read the next page, call again with the answer's next as
        after, until an answer has no next.
      x-cli-all-mailboxes: threads reminders
      parameters:
        - $ref: "#/components/parameters/AllMailboxesLimit"
        - $ref: "#/components/parameters/AllMailboxesAfter"
      responses:
        "200":
          description: A page of the threads set aside.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/threads/read:
    post:
      operationId: markAllMailboxesThreadsRead
      summary: Mark threads in All mailboxes read, each in its own mailbox.
      description: >
        Marks each thread read in the mailbox it is in, as marking it there
        does, so its copy in another mailbox stays as it is. Each thread that
        was unread gets a change in its mailbox's change feed, naming you.
        You need to be able to mark threads in each mailbox the threads are in.
      x-cli-all-mailboxes: threads mark-read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadIds"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /all-mailboxes/threads/unread:
    post:
      operationId: markAllMailboxesThreadsUnread
      summary: Mark threads in All mailboxes unread, each in its own mailbox.
      description: >
        Marks each thread unread in the mailbox it is in, as marking it there
        does. Each thread that was read gets a change in its mailbox's change
        feed, naming you. You need to be able to mark threads in each mailbox
        the threads are in.
      x-cli-all-mailboxes: threads mark-unread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadIds"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /all-mailboxes/threads/labels:
    post:
      operationId: labelAllMailboxesThreads
      summary: Add labels to threads in All mailboxes, and remove them, each in its own mailbox.
      description: >
        Adds and removes the labels on each thread in the mailbox it is in,
        as labeling it there does, so archiving removes inbox. Give a built-in
        label by its ID, and a label of the mailboxes' own by its name or its
        ID. A name stands for the label of that name in each thread's own
        mailbox, which is created there when added and missing. Removing a
        name a thread's mailbox has no label of leaves it as it is. Each
        thread whose labels change gets a change in its mailbox's change
        feed, naming you. You need to be able to label threads in each
        mailbox the threads are in.
      x-cli-all-mailboxes: threads label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadLabels"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /all-mailboxes/threads/remind:
    post:
      operationId: remindAllMailboxesThreads
      summary: Set threads in All mailboxes aside until a time, each in its own mailbox.
      description: >
        Sets each thread aside in the Remind me of the mailbox it is in, as
        setting it aside there does, and it comes back to that mailbox's
        Inbox. Each thread gets a change in its mailbox's change feed, naming
        you. You need to be able to set threads aside in each mailbox the
        threads are in.
      x-cli-all-mailboxes: threads remind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadsReminder"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /all-mailboxes/threads/remind/cancel:
    post:
      operationId: cancelAllMailboxesReminders
      summary: Cancel the reminders of threads in All mailboxes, which puts each back in its own mailbox's Inbox.
      description: >
        Cancels each thread's reminder in the mailbox it is in, as cancelling
        it there does. Threads not set aside are left as they are. Each
        thread whose reminder is cancelled gets a change in its mailbox's
        change feed, naming you.
      x-cli-all-mailboxes: threads cancel-reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadIds"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /all-mailboxes/threads/{thread}:
    get:
      operationId: getAllMailboxesThread
      summary: Read a thread in All mailboxes, with each of its messages, oldest first, and the mailbox it is in.
      x-cli-all-mailboxes: threads get
      parameters:
        - name: thread
          in: path
          required: true
          description: The thread's ID.
          schema:
            type: string
      responses:
        "200":
          description: The thread and its messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesThreadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /all-mailboxes/search:
    get:
      operationId: searchAllMailboxes
      summary: Search All mailboxes' threads by words, meaning and filters.
      description: >
        Searches each mailbox's own index as searching it alone does, with
        the same q, and merges what each finds by rank, so every mailbox's
        best come first, or newest first when sorted so. Each result names
        its mailbox. label: finds the label of that name in each mailbox
        that has one. To read the next page, call again with the answer's
        next as after.
      x-cli-all-mailboxes: search
      parameters:
        - name: q
          in: query
          required: true
          description: >
            What to search for, as searching one mailbox takes it: words,
            "quoted phrases", and the filters from:, to:, subject:, label:,
            has:attachment, is:unread, after: and before:.
          schema:
            type: string
            examples: ['invoice from:ada after:2026-09-01 "hosting plan"']
        - name: sort
          in: query
          description: Best first, or newest first. Without words or phrases, both are newest first.
          schema:
            type: string
            enum: [relevance, newest]
            default: relevance
        - name: limit
          in: query
          description: How many threads a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: "#/components/parameters/AllMailboxesAfter"
      responses:
        "200":
          description: A page of the threads found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesSearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/labels:
    get:
      operationId: listAllMailboxesLabels
      summary: List All mailboxes' labels, each name once, with the mailboxes that have it and how many unread threads it has.
      description: >
        Lists the built-in labels first, then the mailboxes' own labels by
        name. Labels of the same name, in any case, in several mailboxes are
        one label here, whose unread count is the sum of theirs. Each label
        stays its mailbox's own, with its own prompt, so create, rename and
        delete labels, and give them prompts, in a mailbox.
      x-cli-all-mailboxes: labels list
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesLabelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/screener:
    get:
      operationId: getAllMailboxesScreener
      summary: Read All mailboxes' Screener, with the first-time senders whose mail waits in each mailbox.
      description: >
        Lists each sender whose mail waits in a mailbox, newest first, with
        their waiting threads there. A sender waiting in two mailboxes is
        listed for each, since each mailbox decides on its senders: decide in
        the sender's mailbox. Says for each mailbox whether its Screener is
        on, and how many senders it has decided where mail goes for.
      x-cli-all-mailboxes: screener get
      responses:
        "200":
          description: The Screener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesScreener"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/drafts:
    post:
      operationId: createAllMailboxesDraft
      summary: Draft a reply, a forward or a new message in All mailboxes, in the mailbox it goes from.
      description: >
        A reply or a forward lives in the mailbox of the message it answers
        or forwards, and goes from the address a reply there would. A new
        message lives in the mailbox of the address it goes from: from, or
        else the address your newMailFrom preference names, or for an agent
        its sponsor's, while it is one of the mailboxes'. Otherwise it goes
        from the default address of the first mailbox. Writing it is as
        writing a draft in that mailbox, recorded in its change feed, naming
        you, and you need to be able to draft there.
      x-cli-all-mailboxes: drafts create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDraft"
      responses:
        "201":
          description: The draft, with its mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listAllMailboxesDrafts
      summary: List the drafts in All mailboxes, newest first, each with its mailbox and where its send stands.
      x-cli-all-mailboxes: drafts list
      responses:
        "200":
          description: The drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraftList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /all-mailboxes/drafts/{draft}:
    get:
      operationId: getAllMailboxesDraft
      summary: Read a draft in All mailboxes, with its mailbox and where its send stands.
      x-cli-all-mailboxes: drafts get
      parameters:
        - $ref: "#/components/parameters/Draft"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: editAllMailboxesDraft
      summary: Change a draft in All mailboxes, in its own mailbox.
      description: >
        As changing it in its mailbox does. Its From can be another of that
        mailbox's addresses, or a group, but not another mailbox's address,
        since a draft stays in its mailbox.
      x-cli-all-mailboxes: drafts edit
      parameters:
        - $ref: "#/components/parameters/Draft"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftChanges"
      responses:
        "200":
          description: The changed draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAllMailboxesDraft
      summary: Delete a draft in All mailboxes, in its own mailbox.
      x-cli-all-mailboxes: drafts delete
      parameters:
        - $ref: "#/components/parameters/Draft"
      responses:
        "200":
          description: The draft, as it was when it was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /all-mailboxes/drafts/{draft}/send:
    post:
      operationId: sendAllMailboxesDraft
      summary: Ask for a draft in All mailboxes to be sent, from its own mailbox.
      description: As asking in its mailbox does, approval and all.
      x-cli-all-mailboxes: drafts send
      parameters:
        - $ref: "#/components/parameters/Draft"
      responses:
        "202":
          description: The draft, waiting for approval, or for a human's send, approved and about to be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /all-mailboxes/drafts/{draft}/send-now:
    post:
      operationId: sendAllMailboxesDraftNow
      summary: Send a draft in All mailboxes waiting for an agent's send limits now, past the limits.
      description: As sending it now in its mailbox does.
      x-cli-all-mailboxes: drafts send-now
      parameters:
        - $ref: "#/components/parameters/Draft"
      responses:
        "202":
          description: The draft, approved and about to be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllMailboxesDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /all-mailboxes/messages/{message}/attachments/{attachment}:
    get:
      operationId: getAllMailboxesAttachment
      summary: Get a short-lived link that downloads one of the attachments of a message in All mailboxes.
      description: As getting one in the message's mailbox does. The link works for 5 minutes, for whoever follows it, so keep it to yourself.
      x-cli-all-mailboxes: attachments link
      parameters:
        - name: message
          in: path
          required: true
          description: The message's ID.
          schema:
            type: string
        - name: attachment
          in: path
          required: true
          description: The attachment's place among the message's attachments, from 0.
          schema:
            type: integer
      responses:
        "200":
          description: The attachment, with the link that downloads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /all-mailboxes/messages/{message}/linked-files/{file}:
    delete:
      operationId: stopSharingInAllMailboxes
      summary: Stop sharing a linked file of a message sent from one of All mailboxes.
      description: As stopping it in the message's mailbox does.
      x-cli-all-mailboxes: linked-files stop-sharing
      parameters:
        - name: message
          in: path
          required: true
          description: The sent message's ID.
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: The linked file's ID in the message.
          schema:
            type: string
      responses:
        "200":
          description: The linked file, no longer shared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/drafts/{draft}/uploads:
    post:
      operationId: startUpload
      summary: Start uploading a file to attach to a draft, and get the links its parts go to.
      description: >
        The file goes straight to Duva's storage, never through the API, in
        parts of the upload's partSize, the last one smaller: PUT each part's
        bytes to its URL, in any order, then complete the upload, which
        attaches the file to the draft. A file is up to 5 GB. The links work
        for an hour, so get the upload again for new ones if one stops
        working. An upload never completed is given up after a day. Only
        those who can draft in the mailbox can upload: its owner, and for a
        human's mailbox the agents they give draft sponsor access or more. A
        draft that is approved, being sent or sent takes no more files.
      x-cli-command: uploads start
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUpload"
      responses:
        "201":
          description: The upload, with the links its parts go to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/drafts/{draft}/uploads/{upload}:
    get:
      operationId: getUpload
      summary: Get new links for the parts of an upload that isn't complete yet.
      description: >
        Each link works for an hour from now. Parts already uploaded can be
        uploaded again, and the last one to arrive counts. Only those who can
        draft in the mailbox can.
      x-cli-command: uploads get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
        - $ref: "#/components/parameters/Upload"
      responses:
        "200":
          description: The upload, with new links for its parts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/drafts/{draft}/uploads/{upload}/complete:
    post:
      operationId: completeUpload
      summary: Complete an upload once all its parts are uploaded, which attaches the file to the draft.
      description: >
        The attachment takes the upload's ID. Completing it changes the
        draft, so a draft that waits for approval has its request withdrawn,
        and the change is recorded in the mailbox's change feed, naming you.
        A part that is missing or the wrong size is 409, saying which. Only
        those who can draft in the mailbox can.
      x-cli-command: uploads complete
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
        - $ref: "#/components/parameters/Upload"
      responses:
        "200":
          description: The draft, with the file among its attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/drafts/{draft}/attachments/{attachment}:
    get:
      operationId: getDraftAttachment
      summary: Get a short-lived link that downloads one of a draft's attachments, uploaded or forwarded.
      description: >
        The link works for 5 minutes, for whoever follows it, so keep it to
        yourself. An approver opens an agent's files this way before
        deciding. Only those who can read the mailbox get one.
      x-cli-command: drafts attachment-link
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
        - $ref: "#/components/parameters/DraftAttachment"
      responses:
        "200":
          description: The attachment, with the link that downloads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeDraftAttachment
      summary: Choose whether a draft's file goes as a linked file.
      description: >
        A linked file goes as a link to a download page, listed after the
        text, which anyone with the link may open until the link ends, 30
        days after the send unless the draft's linkDays say otherwise. When
        carrying every attachment would make the message more than 10 MB,
        encoded, the largest go as links anyway until it fits. Choosing
        changes the draft, so a draft that waits for approval has its
        request withdrawn, and the change is recorded in the mailbox's change
        feed, naming you. Only those who can draft in the mailbox can.
      x-cli-command: drafts link-attachment
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
        - $ref: "#/components/parameters/DraftAttachment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftAttachmentChanges"
      responses:
        "200":
          description: The draft, with which of its files go as links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeDraftAttachment
      summary: Take an attachment off a draft, uploaded or forwarded.
      description: >
        An uploaded file is deleted. Removing one changes the draft, so a
        draft that waits for approval has its request withdrawn, and the
        change is recorded in the mailbox's change feed, naming you. A
        draft that is approved, being sent or sent keeps its attachments.
        Only those who can draft in the mailbox can.
      x-cli-command: drafts remove-attachment
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
        - $ref: "#/components/parameters/DraftAttachment"
      responses:
        "200":
          description: The draft, without the attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /alerts:
    get:
      operationId: listAlerts
      summary: List your agents' alerts, newest first, with how many you haven't seen.
      description: >
        An alert tells a sponsor that one of their agents needs them: a send
        that failed, bounced or drew a complaint, its send limit reached, its
        key used while paused, a pause, limit change or removal by an admin,
        or a pause by Duva. A human lists the alerts about the agents they
        sponsor, and an agent those about itself, as its sponsor sees them.
        Urgent alerts are also mailed to the sponsor's own mailbox, if they
        have one. Removing an agent keeps its alerts. To read the next page,
        call again with the answer's next as after, until an answer has no
        next.
      x-cli-command: alerts list
      parameters:
        - name: agent
          in: query
          description: List only the alerts about this agent.
          schema:
            type: string
        - name: limit
          in: query
          description: How many alerts a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the alerts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /alerts/seen:
    post:
      operationId: markAlertsSeen
      summary: Mark alerts seen, so they no longer count as unseen.
      description: >
        Only the sponsor marks their alerts seen. IDs of alerts that aren't
        yours, or no longer exist, are left alone.
      x-cli-command: alerts mark-seen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertIds"
      responses:
        "200":
          description: How many of your alerts you haven't seen now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnseenAlerts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /approvals:
    get:
      operationId: listApprovals
      summary: List the sends waiting for your approval, newest first, each with its draft.
      description: >
        An agent's sends wait for its sponsor, from the sponsor's own
        mailboxes, so a sponsor sees those of every agent they sponsor. Each
        approval's mailbox tells which.
      x-cli-command: approvals list
      responses:
        "200":
          description: The approvals waiting for the signed-in actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /approvals/log:
    get:
      operationId: listApprovalLog
      summary: List the decisions on your agents' sends, newest first, each with what became of it.
      description: >
        The approval log: every decision on a send one of your agents asked
        you for, newest first, with who decided it and when, and how it
        went: approved and on its way, sent, failed, unclear, or rejected
        with its note. Each entry links to its thread, and says how the
        decision can be taken back, if it can. It reaches as far
        back as approval records are kept (ADR-0014). An undone approval
        waits again, so it leaves the log until it is decided again. To read
        the next page, call again with the answer's next as after, until an
        answer has no next.
      x-cli-command: approvals log
      parameters:
        - name: limit
          in: query
          description: How many entries a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the log, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /approvals/{approval}/send:
    post:
      operationId: sendApproval
      summary: Send a draft waiting for your approval, as is or with your changes.
      description: >
        Give recipients, a subject or text to send your version instead of
        the agent's. Duva then sends it through SES from the draft's address,
        as a reply in the thread if it is one. Every message an
        agent sends carries the Duva-Agent header, naming the agent and the
        human it acts for, also when you changed it, and a line that says so
        after the text unless you switched that off for the agent. The
        draft's send shows sending, then sent or failed with the reason. Only the approver can decide an approval, never an
        agent, and only once: of two decisions at the same time, one is
        refused. A rejected approval can still be sent after all, while its
        draft is as the agent asked it: once the agent changed it, deleted it
        or asked again, that is 409. The decision, with any edits, is recorded in the mailbox's
        change feed under you, and the send under the agent. While the agent
        is paused, its approvals wait and can't be sent, which is 409. The
        draft then waits the organization's undo window, undoWindowSeconds,
        before the sender takes it, and you can undo the approval until
        then. Held after that while the agent is paused, or by its send
        limits, it stays approved.
      x-cli-command: approvals send
      parameters:
        - $ref: "#/components/parameters/Approval"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproverEdits"
      responses:
        "202":
          description: The approval, approved. Duva sends the draft next.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /approvals/{approval}/reject:
    post:
      operationId: rejectApproval
      summary: Reject a draft waiting for your approval, with a note the agent sees.
      description: >
        The draft goes back to the agent with the note, and the agent can
        revise it and ask again. Only the approver can decide an approval,
        never an agent, and only once: of two decisions at the same time, one
        is refused. The decision is recorded in the mailbox's change feed.
      x-cli-command: approvals reject
      parameters:
        - $ref: "#/components/parameters/Approval"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rejection"
      responses:
        "200":
          description: The approval, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /approvals/{approval}/undo:
    post:
      operationId: undoApproval
      summary: Undo an approved send during the undo window, so it waits for your approval again.
      description: >
        An approved send waits the organization's undo window,
        undoWindowSeconds, before the sender takes it, as the draft's
        undoUntil says. Until then its approver can undo the approval: the
        draft waits for approval again as the agent asked it, without your
        edits, and nothing is sent. Once the window is over, or the sender
        took it, that is 409, and mail that went out can't be called back.
        Only the approver can undo. Undoing is recorded in the mailbox's
        change feed under you.
      x-cli-command: approvals undo
      parameters:
        - $ref: "#/components/parameters/Approval"
      responses:
        "200":
          description: The approval, waiting for you again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    Sender:
      name: sender
      in: path
      required: true
      description: >
        The sender's address, like grace@example.org, or a domain, like
        example.org, for everyone at exactly that domain. Case doesn't
        matter.
      schema:
        type: string
    Mailbox:
      name: mailbox
      in: path
      required: true
      description: The mailbox's ID.
      schema:
        type: string
    AllMailboxesLimit:
      name: limit
      in: query
      description: How many threads a page lists at most.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    AllMailboxesAfter:
      name: after
      in: query
      description: Where the page starts, the next of the page before it. Leave it out for the first page.
      schema:
        type: string
    Draft:
      name: draft
      in: path
      required: true
      description: The draft's ID.
      schema:
        type: string
    Upload:
      name: upload
      in: path
      required: true
      description: The upload's ID.
      schema:
        type: string
    DraftAttachment:
      name: attachment
      in: path
      required: true
      description: The attachment's ID, as the draft lists it.
      schema:
        type: string
    Label:
      name: label
      in: path
      required: true
      description: The label's ID.
      schema:
        type: string
    Approval:
      name: approval
      in: path
      required: true
      description: The approval's ID.
      schema:
        type: string
    AccessCode:
      name: code
      in: path
      required: true
      description: The code the agent shows, as BCDF-GHJK. Case and the dash don't matter.
      schema:
        type: string
    Agent:
      name: agent
      in: path
      required: true
      description: The agent's ID.
      schema:
        type: string
    Human:
      name: human
      in: path
      required: true
      description: The human's ID.
      schema:
        type: string
    Group:
      name: group
      in: path
      required: true
      description: The group's address. Case doesn't matter.
      schema:
        type: string
    Domain:
      name: domain
      in: path
      required: true
      description: The domain. Case doesn't matter.
      schema:
        type: string
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A human's Cognito access token, from signing in.
    agentKey:
      type: http
      scheme: bearer
      description: An agent's key, which starts with duva_agent_.
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The call has no valid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The signed-in actor may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Another call changed the same thing at the same time. Try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nothing has the ID the call names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many calls like this one in the last 10 minutes. Wait, then try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: What went wrong.
    Actor:
      description: A human or an agent that acts on mail.
      oneOf:
        - $ref: "#/components/schemas/Human"
        - $ref: "#/components/schemas/Agent"
      discriminator:
        propertyName: kind
        mapping:
          human: "#/components/schemas/Human"
          agent: "#/components/schemas/Agent"
    Human:
      type: object
      additionalProperties: false
      required: [id, kind, email, admin]
      description: An actor that is a person.
      properties:
        id:
          type: string
          description: The actor's ID, which never changes.
        kind:
          type: string
          const: human
        email:
          type: string
          description: The address the human signs in with.
          examples: ["ada@example.com"]
        admin:
          type: boolean
          description: Whether the human may change the organization's setup.
        linkedSize:
          type: integer
          description: >-
            How many bytes of linked files the human has linked now, their agents'
            included, which counts toward the organization's linkedFilesCapGb.
            Only admins see it, when they list the humans.
    NewHuman:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: The address the human signs in with.
          examples: ["grace@example.com"]
    HumanList:
      type: object
      additionalProperties: false
      required: [humans]
      properties:
        humans:
          type: array
          items:
            $ref: "#/components/schemas/Human"
    HumanChanges:
      type: object
      additionalProperties: false
      required: [admin]
      properties:
        admin:
          type: boolean
          description: Whether the human may change the organization's setup.
    HumanRemovalChoices:
      type: object
      additionalProperties: false
      description: >-
        What happens to each of the human's mailboxes. Each is given once, in
        handOver or in delete.
      properties:
        dryRun:
          type: boolean
          description: Lists what the removal takes and removes nothing.
        handTo:
          type: string
          description: The ID of the human the mailboxes in handOver go to.
        handOver:
          type: array
          items:
            type: string
          description: The IDs of the mailboxes to hand to the human handTo, with their addresses and mail.
        delete:
          type: array
          items:
            type: string
          description: The IDs of the mailboxes to erase, with their mail.
    HumanRemoval:
      type: object
      additionalProperties: false
      required: [human, mailboxes, agents, removed]
      description: A human's removal, and what goes with them.
      properties:
        human:
          $ref: "#/components/schemas/Human"
        mailboxes:
          type: array
          description: The human's personal mailboxes, each handed over or erased.
          items:
            $ref: "#/components/schemas/Mailbox"
        agents:
          type: array
          description: The agents the human sponsors, removed with them.
          items:
            $ref: "#/components/schemas/Agent"
        removed:
          type: boolean
          description: Whether the human was removed, which a dry run leaves undone.
    Agent:
      type: object
      additionalProperties: false
      required: [id, kind, name, sponsor]
      description: >-
        An actor that is software, which calls Duva with its key. It owns no
        mailbox and is never an admin: it works only in its sponsor's
        mailboxes, with the sponsor access they give it (ADR-0030).
      properties:
        id:
          type: string
          description: The actor's ID, which never changes.
        kind:
          type: string
          const: agent
        name:
          type: string
          description: The agent's name.
          examples: ["Hermes"]
        sponsor:
          type: string
          description: The ID of the human who answers for the agent.
        paused:
          $ref: "#/components/schemas/Pause"
        mailboxAgent:
          type: boolean
          description: >-
            Present, true, for a mailbox agent, Coo: the one Duva hosts for its
            sponsor, which works in their personal mailboxes. Duva hosts it, so
            it has no key, and it goes with its sponsor (ADR-0033).
        sendsLeftThisHour:
          type: integer
          minimum: 0
          description: >-
            How many more messages the agent's send limits let it send now,
            counting its sends of the last hour. Its sends that wait for the
            limits leave none. There only when you list the agents you sponsor, or a mailbox agent lists its owner's.
    Pause:
      type: object
      additionalProperties: false
      required: [by, at]
      description: >
        Who paused the agent and when, there only while it is paused. Its key
        is refused, and its approved sends are held, until it is unpaused.
      properties:
        by:
          type: string
          description: The ID of the actor who paused it, its sponsor or an admin, or duva if Duva paused it by itself.
        at:
          type: string
          format: date-time
          description: When it was paused.
        reason:
          type: string
          description: Why Duva paused it, there only if Duva paused it by itself (ADR-0021).
          examples: ["A recipient complained about its mail."]
    NewAgent:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The agent's name.
          examples: ["Hermes"]
    AgentWithKey:
      type: object
      additionalProperties: false
      required: [agent, key]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        key:
          type: string
          description: The agent's key. Duva shows it only here, so keep it now. The agent sends it as a bearer token, or the CLI reads it from DUVA_AGENT_KEY.
          examples: ["duva_agent_3q2-7wF0nJvZb1yKcY9mXo8aT5rL4sUeHgQdPiWjNkM"]
    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    AgentRemoval:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
    AgentSettings:
      type: object
      additionalProperties: false
      required: [sponsorAccess, sponsorMailboxes, approvalAsSponsor, disclosureLineAsSponsor, sendsPerHour, newRecipientsPerDay]
      description: What an agent may do in its sponsor's personal mailboxes, whether its sends there wait for approval and carry the disclosure's visible line, and its send limits.
      properties:
        sponsorAccess:
          $ref: "#/components/schemas/SponsorAccess"
        sponsorMailboxes:
          description: >-
            The IDs of your mailboxes that the agent's sponsor access covers.
            Null, the default, covers every mailbox you own. The CLI sets it
            back to null with --no-sponsorMailboxes.
          anyOf:
            - $ref: "#/components/schemas/SponsorMailboxes"
            - type: "null"
        approvalAsSponsor:
          $ref: "#/components/schemas/ApprovalAsSponsor"
        disclosureLineAsSponsor:
          $ref: "#/components/schemas/DisclosureLineAsSponsor"
        sendsPerHour:
          $ref: "#/components/schemas/SendsPerHour"
        newRecipientsPerDay:
          $ref: "#/components/schemas/NewRecipientsPerDay"
    AgentSettingsChanges:
      type: object
      additionalProperties: false
      description: The agent's settings changed, each with its new value.
      properties:
        sponsorAccess:
          $ref: "#/components/schemas/SponsorAccess"
        sponsorMailboxes:
          description: >-
            The IDs of your mailboxes that the agent's sponsor access covers.
            Null, the default, covers every mailbox you own. The CLI sets it
            back to null with --no-sponsorMailboxes.
          anyOf:
            - $ref: "#/components/schemas/SponsorMailboxes"
            - type: "null"
        approvalAsSponsor:
          $ref: "#/components/schemas/ApprovalAsSponsor"
        disclosureLineAsSponsor:
          $ref: "#/components/schemas/DisclosureLineAsSponsor"
        sendsPerHour:
          $ref: "#/components/schemas/SendsPerHour"
        newRecipientsPerDay:
          $ref: "#/components/schemas/NewRecipientsPerDay"
    SponsorAccess:
      type: string
      enum: [none, read, organize, draft, send]
      description: >-
        The agent's access to its sponsor's personal mailboxes, those
        sponsorMailboxes names. None, the default, gives it none. Read lets
        it read everything there: threads, labels, drafts, the change feed
        and attachments. Organize also lets it organize, decide in the
        Screener, set threads aside and move them to Trash and back. Draft
        also lets it write and change any draft there. Send also lets it send
        as its sponsor. Only the sponsor empties their Trash.
    SponsorMailboxes:
      type: array
      items:
        type: string
      uniqueItems: true
      description: The IDs of the sponsor's mailboxes that the agent's sponsor access covers, each one the sponsor owns.
    AccessAsked:
      type: object
      additionalProperties: false
      description: What a new agent asks a human for.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The agent's name. Without one, it is named for its host.
          examples: ["Hermes"]
        host:
          type: string
          maxLength: 253
          description: The name of the computer the agent runs on, which the human sees.
          examples: ["build-box"]
        mailboxes:
          type: array
          maxItems: 20
          items:
            type: string
          description: The addresses of the mailboxes it asks for. Without them, it asks for every mailbox of the human who approves.
          examples: [["ada@example.com"]]
        wants:
          $ref: "#/components/schemas/AccessWanted"
    AccessWanted:
      type: string
      enum: [read, organize, draft, send]
      description: The sponsor access the agent asks for, read unless it says.
    AccessRequestStarted:
      type: object
      additionalProperties: false
      required: [code, deviceCode, expiresAt, interval]
      properties:
        code:
          type: string
          description: The code to show the human, who approves the request by it.
          examples: ["BCDF-GHJK"]
        deviceCode:
          type: string
          description: The secret the agent collects its key with. Keep it to yourself.
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working, 10 minutes from now.
        interval:
          type: integer
          description: How many seconds to wait between tries to collect the key.
    AccessCollected:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          description: The device code asking for access gave.
    AccessRequest:
      type: object
      additionalProperties: false
      required: [code, name, from, wants, mailboxes, expiresAt]
      description: An agent's request for access, as the human who may approve it sees it.
      properties:
        code:
          type: string
          examples: ["BCDF-GHJK"]
        name:
          type: string
          description: The name the agent asked for.
        from:
          type: object
          additionalProperties: false
          required: [address]
          description: Where the agent asked from.
          properties:
            address:
              type: string
              description: The IP address its request came from.
              examples: ["203.0.113.7"]
            host:
              type: string
              description: The name it gave for the computer it runs on, which it may have made up.
        wants:
          $ref: "#/components/schemas/AccessWanted"
        mailboxes:
          type: array
          description: Each of your mailboxes, with whether the agent asked for it.
          items:
            type: object
            additionalProperties: false
            required: [mailbox, asked]
            properties:
              mailbox:
                $ref: "#/components/schemas/Mailbox"
              asked:
                type: boolean
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working.
    AccessApproval:
      type: object
      additionalProperties: false
      description: What you give the agent, where it differs from what it asked.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The agent's name, the one it asked for unless you give another.
        sponsorAccess:
          $ref: "#/components/schemas/SponsorAccess"
        sponsorMailboxes:
          $ref: "#/components/schemas/SponsorMailboxes"
        approvalAsSponsor:
          $ref: "#/components/schemas/ApprovalAsSponsor"
        disclosureLineAsSponsor:
          $ref: "#/components/schemas/DisclosureLineAsSponsor"
    AccessDeclined:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    ApprovalAsSponsor:
      type: boolean
      description: Whether the agent's sends as its sponsor, from the sponsor's mailbox, wait for the sponsor's approval. On by default.
    DisclosureLineAsSponsor:
      type: boolean
      description: Whether mail the agent sends as its sponsor carries the disclosure's visible line. It always carries the Duva-Agent header. On by default.
    SendsPerHour:
      type: integer
      minimum: 1
      maximum: 10000
      description: >-
        How many messages the agent sends in any hour, from all its sponsor's
        mailboxes. 100 by default, and up to the organization's
        agentSendsPerHourCap. A send counts when it goes out, and one over
        the limit waits.
    NewRecipientsPerDay:
      type: integer
      minimum: 1
      maximum: 10000
      description: >-
        How many new recipients the agent sends to in any 24 hours: addresses
        it hasn't sent to before, from any mailbox. 50 by default, and up to
        the organization's agentNewRecipientsPerDayCap. A send counts when it
        goes out, and one over the limit waits. A message with more new
        recipients than the whole limit waits until its sponsor sends it now.
    NewAddress:
      type: object
      additionalProperties: false
      required: [address, mailbox]
      properties:
        address:
          type: string
          description: The address, on one of the organization's standalone domains, without a plus tag. Its alias domains mirror it.
          examples: ["support@example.com"]
        mailbox:
          type: string
          description: The ID of the mailbox it delivers to.
    Address:
      type: object
      additionalProperties: false
      required: [address]
      description: An address on one of the organization's domains, and the mailbox it delivers to, or that it is a group.
      properties:
        address:
          type: string
          examples: ["support@example.com"]
        mailbox:
          type: string
          description: The ID of the mailbox it delivers to.
        group:
          type: boolean
          const: true
          description: Present when the address is a group's.
    AddressList:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
    NewGroup:
      type: object
      additionalProperties: false
      required: [address, members]
      properties:
        address:
          type: string
          description: The group's address, on one of the organization's standalone domains, without a plus tag. Its alias domains mirror it.
          examples: ["support@example.com"]
        members:
          $ref: "#/components/schemas/GroupMembers"
        sendPolicy:
          $ref: "#/components/schemas/SendPolicy"
        replyTo:
          $ref: "#/components/schemas/GroupReplyTo"
    GroupChanges:
      type: object
      additionalProperties: false
      properties:
        members:
          $ref: "#/components/schemas/GroupMembers"
        sendPolicy:
          $ref: "#/components/schemas/SendPolicy"
        replyTo:
          $ref: "#/components/schemas/GroupReplyTo"
    Group:
      type: object
      additionalProperties: false
      required: [address, members, sendPolicy, replyTo]
      description: An address that delivers a copy of each message to every member.
      properties:
        address:
          type: string
          examples: ["support@example.com"]
        members:
          $ref: "#/components/schemas/GroupMembers"
        sendPolicy:
          $ref: "#/components/schemas/SendPolicy"
        replyTo:
          $ref: "#/components/schemas/GroupReplyTo"
    GroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    GroupMembers:
      type: array
      items:
        type: string
      description: >-
        The members' addresses, in lower case: the organization's addresses, of mailboxes or other
        groups, and external addresses. A member on the organization's domains must be one of its
        addresses, without a plus tag.
      examples: [["grace@example.com", "hermes@example.com", "linus@example.net"]]
    SendPolicy:
      type: string
      enum: [anyone, organization, members]
      description: >-
        Who may send to the group, by the From of their mail. Anyone, the default, lets everyone.
        Organization lets only senders on the organization's domains. Members lets only the group's
        members, its nested groups' included, from any address of a member's mailbox. A From on the
        organization's domains counts only if the mail passed DMARC, and any other only if it didn't
        fail it. Mail from anyone else is bounced.
    GroupReplyTo:
      type: string
      enum: [sender, group]
      description: >-
        Where external members' replies to the copies re-sent to them go. Sender, the default,
        sends them to the original sender, and group to the group.
    NewDomain:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          description: The domain. International domains can be given as they are written.
          examples: ["example.net"]
        aliasOf:
          type: string
          description: The standalone domain it mirrors, to make it an alias domain. Without it the domain is a standalone domain.
          examples: ["example.com"]
    DomainChanges:
      type: object
      additionalProperties: false
      required: [signIn]
      properties:
        signIn:
          type: boolean
          const: true
          description: Sends sign-in codes from the domain from now on. To stop, choose another domain.
    CatchAll:
      type: object
      additionalProperties: false
      description: A domain's catch-all, for mail to addresses the organization doesn't have. Exactly one of mailbox and group.
      properties:
        mailbox:
          type: string
          description: The ID of the mailbox that gets the mail, its Screener applying.
        group:
          type: string
          description: The address of the group whose members get the mail, skipping their Screeners.
          examples: ["support@example.com"]
    Domain:
      type: object
      additionalProperties: false
      required: [domain, kind, signIn, ses, records]
      description: One of the organization's domains, with the DNS records it needs and SES's verification of it.
      properties:
        domain:
          type: string
          description: The domain, in lower-case ASCII, international labels in Punycode.
          examples: ["example.com"]
        kind:
          type: string
          enum: [standalone, alias]
          description: A standalone domain's addresses are its own. An alias domain mirrors every address of its standalone domain.
        aliasOf:
          type: string
          description: The standalone domain an alias domain mirrors.
        signIn:
          type: boolean
          description: Whether sign-in codes come from the domain, once SES has verified it.
        catchAll:
          $ref: "#/components/schemas/CatchAll"
          description: The standalone domain's catch-all, if an admin set one. Its alias domains use it too. Without one, mail to addresses the organization doesn't have is refused.
        ses:
          $ref: "#/components/schemas/DomainVerification"
        records:
          type: array
          description: >-
            The DNS records the domain needs, to add at its DNS provider. A
            DMARC record is left out when a parent domain's covers it.
          items:
            $ref: "#/components/schemas/DnsRecord"
    DomainVerification:
      type: object
      additionalProperties: false
      required: [verified, dkim, mailFrom]
      description: What SES has verified of the domain. SES checks the DNS records on its own, for up to 72 hours after the domain is added.
      properties:
        verified:
          type: boolean
          description: Whether SES has verified the domain, which mail from it needs.
        dkim:
          type: string
          description: SES's DKIM status, in words, like pending or verified.
          examples: ["pending"]
        mailFrom:
          type: string
          description: SES's status of the MAIL FROM domain, in words, like pending or verified.
          examples: ["pending"]
    DnsRecord:
      type: object
      additionalProperties: false
      required: [purpose, type, name, value, status]
      description: A DNS record the domain needs.
      properties:
        purpose:
          type: string
          enum: [receiving, DKIM, MAIL FROM, DMARC]
        type:
          type: string
          enum: [MX, TXT, CNAME]
        name:
          type: string
          examples: ["example.com"]
        value:
          type: string
          examples: ["10 inbound-smtp.eu-north-1.amazonaws.com"]
        status:
          type: string
          enum: [missing, found, verified]
          description: >-
            missing until DNS answers with the value, found once it does, and
            verified once SES has verified what the record is for. A record DNS
            doesn't answer for still shows verified then, since a resolver can
            answer from a cache made before it was added, but one DNS answers
            with another value for shows missing. SES never verifies receiving
            or DMARC records.
        found:
          type: array
          items:
            type: string
          description: What DNS answered instead, if it has other values at the name.
    DomainList:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
    DomainRemovalChoices:
      type: object
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
          description: Lists what the removal takes and removes nothing.
    DomainRemoval:
      type: object
      additionalProperties: false
      required: [domains, addresses, mailboxesLeftWithoutAddress, removed]
      description: A domain's removal, and what goes with it.
      properties:
        domains:
          type: array
          description: The domains removed, the one asked for first, then its alias domains.
          items:
            type: string
        addresses:
          type: array
          description: The addresses that stop receiving mail, those its alias domains mirror included, each with its mailbox.
          items:
            $ref: "#/components/schemas/Address"
        mailboxesLeftWithoutAddress:
          type: array
          description: The IDs of the mailboxes left with no address, which keep their mail but receive and send none until they are given one.
          items:
            type: string
        removed:
          type: boolean
          description: Whether the domains were removed, which a dry run leaves undone.
    LogoUpload:
      type: object
      additionalProperties: false
      required: [svg]
      properties:
        svg:
          type: string
          maxLength: 262144
          description: >-
            The logo, as the text of an SVG file. Duva converts it to SVG Tiny PS, the profile
            BIMI asks for: square, titled, and with nothing that runs or fetches, of at most 32 KB.
            A logo that is SVG Tiny PS already is served byte for byte, so a mark certificate
            issued for it matches. A picture such as a PNG can't be converted. From the CLI, give
            a file's text, as --svg "$(cat logo.svg)".
    LogoCertificateUpload:
      type: object
      additionalProperties: false
      description: Either the certificate's https URL, or its PEM.
      properties:
        url:
          type: string
          description: Where the VMC or CMC is served, over https.
          examples: ["https://example.com/bimi/vmc.pem"]
        pem:
          type: string
          maxLength: 131072
          description: >-
            The VMC or CMC in PEM, followed by the certificates that issued it. From the CLI, give
            a file's text, as --pem "$(cat vmc.pem)".
    HostedLogo:
      type: object
      additionalProperties: false
      required: [url, svg]
      description: A logo Duva serves for the organization, as SVG Tiny PS.
      properties:
        url:
          type: string
          format: uri
          description: Where Duva serves it, to anyone, as image/svg+xml. It stays the same when the logo changes.
          examples: ["https://d111111abcdef8.cloudfront.net/bimi/domains/example.com.svg"]
        svg:
          type: string
          description: The SVG Duva serves.
    LogoCertificate:
      type: object
      additionalProperties: false
      required: [url, hosted]
      description: The VMC or CMC the logo's record gives.
      properties:
        url:
          type: string
          format: uri
        hosted:
          type: boolean
          description: Whether Duva serves it, from a PEM it checked vouches for the domain and its logo.
    BimiRecord:
      type: object
      additionalProperties: false
      required: [name, value, status]
      description: A TXT record a BIMI logo needs in DNS.
      properties:
        name:
          type: string
          examples: ["default._bimi.example.com"]
        value:
          type: string
          examples: ["v=BIMI1; l=https://d111111abcdef8.cloudfront.net/bimi/domains/example.com.svg;"]
        status:
          type: string
          enum: [missing, found, matches]
          description: >-
            missing while DNS has no BIMI record at the name, found when it has one that differs
            from the value, and matches when it has the value.
        found:
          type: array
          items:
            type: string
          description: The BIMI records DNS has at the name, when they differ from the value.
    SelectorLogo:
      type: object
      additionalProperties: false
      required: [selector, mailbox, owner, logo, record]
      description: A mailbox's own logo, under its selector, with the record it needs on the domain.
      properties:
        selector:
          type: string
          examples: ["grace"]
        mailbox:
          type: string
          description: The mailbox's ID.
        owner:
          $ref: "#/components/schemas/Actor"
        logo:
          $ref: "#/components/schemas/HostedLogo"
        record:
          $ref: "#/components/schemas/BimiRecord"
    DomainLogo:
      type: object
      additionalProperties: false
      required: [domain, dmarcEnforced, selectors]
      properties:
        domain:
          type: string
        logo:
          $ref: "#/components/schemas/HostedLogo"
        certificate:
          $ref: "#/components/schemas/LogoCertificate"
        record:
          $ref: "#/components/schemas/BimiRecord"
          description: The default._bimi record, once the domain has a logo.
        dmarcEnforced:
          type: boolean
          description: >-
            Whether the domain's DMARC policy, its own or a parent domain's, is quarantine or
            reject for all its mail, which BIMI needs. Receivers show no logo until it is.
        selectors:
          type: array
          items:
            $ref: "#/components/schemas/SelectorLogo"
          description: Each mailbox on the domain with a logo of its own, by selector.
    MailboxLogo:
      type: object
      additionalProperties: false
      required: [mailbox, records]
      properties:
        mailbox:
          type: string
          description: The mailbox's ID.
        selector:
          type: string
          description: The mailbox's selector, which Duva gives it with its first logo, and which its mail names in BIMI-Selector.
        logo:
          $ref: "#/components/schemas/HostedLogo"
        records:
          type: array
          items:
            $ref: "#/components/schemas/BimiRecord"
          description: The record each domain the mailbox's addresses are on needs, for an admin to add.
    MailboxChanges:
      type: object
      additionalProperties: false
      required: [defaultAddress]
      properties:
        defaultAddress:
          type: string
          description: The mailbox's new default address, one of its addresses.
          examples: ["support@example.com"]
    NewMailbox:
      type: object
      additionalProperties: false
      required: [owner, address]
      properties:
        owner:
          type: string
          description: The ID of the human who owns the mailbox. Agents own none.
        address:
          type: string
          description: The mailbox's first address, its default address, on one of the organization's standalone domains, without a plus tag.
          examples: ["hermes@example.com"]
    Mailbox:
      type: object
      additionalProperties: false
      required: [id, kind, owner, addresses]
      description: A store of received and sent mail, reached through its addresses.
      properties:
        id:
          type: string
          description: The mailbox's ID, which never changes.
        kind:
          type: string
          const: personal
          description: Personal mailboxes are owned by one actor.
        owner:
          type: string
          description: The ID of the actor that owns the mailbox.
        defaultAddress:
          type: string
          description: The address the mailbox sends new messages from, one of its addresses. Absent while it has none.
          examples: ["hermes@example.com"]
        addresses:
          type: array
          description: >-
            The mailbox's addresses, the earliest first. Mail to each, and to
            its plus-tagged addresses, reaches it. A mailbox with none keeps
            its mail but receives and sends no new mail.
          items:
            type: string
          examples: [["hermes@example.com", "support@example.com"]]
    ListedMailbox:
      type: object
      additionalProperties: false
      required: [id, kind, owner, addresses, groups]
      description: A mailbox you can read, with your sponsor access if it is your sponsor's.
      properties:
        id:
          type: string
          description: The mailbox's ID, which never changes.
        kind:
          type: string
          const: personal
          description: Personal mailboxes are owned by one actor.
        owner:
          type: string
          description: The ID of the actor that owns the mailbox.
        defaultAddress:
          type: string
          description: The address the mailbox sends new messages from, one of its addresses. Absent while it has none.
          examples: ["hermes@example.com"]
        addresses:
          type: array
          description: >-
            The mailbox's addresses, the earliest first. Mail to each, and to
            its plus-tagged addresses, reaches it. A mailbox with none keeps
            its mail but receives and sends no new mail.
          items:
            type: string
          examples: [["hermes@example.com", "support@example.com"]]
        groups:
          type: array
          description: >-
            The groups the mailbox's owner is a local member of, nested ones
            included, each by its address. Its drafts can go from any of them
            as well as from its own addresses.
          items:
            type: string
          examples: [["support@example.com"]]
        sponsorAccess:
          type: string
          enum: [read, organize, draft, send]
          description: For an agent, its sponsor access, present when the mailbox is its sponsor's.
    MailboxWithCounts:
      type: object
      additionalProperties: false
      required: [id, kind, owner, addresses, groups, unread]
      description: A mailbox, with how many of its threads want attention.
      properties:
        id:
          type: string
          description: The mailbox's ID, which never changes.
        kind:
          type: string
          const: personal
          description: Personal mailboxes are owned by one actor.
        owner:
          type: string
          description: The ID of the actor that owns the mailbox.
        defaultAddress:
          type: string
          description: The address the mailbox sends new messages from, one of its addresses. Absent while it has none.
          examples: ["hermes@example.com"]
        addresses:
          type: array
          description: >-
            The mailbox's addresses, the earliest first. Mail to each, and to
            its plus-tagged addresses, reaches it. A mailbox with none keeps
            its mail but receives and sends no new mail.
          items:
            type: string
          examples: [["hermes@example.com", "support@example.com"]]
        groups:
          type: array
          description: >-
            The groups the mailbox's owner is a local member of, nested ones
            included, each by its address. Its drafts can go from any of them
            as well as from its own addresses.
          items:
            type: string
          examples: [["support@example.com"]]
        unread:
          type: integer
          description: How many threads in the Inbox are unread.
          examples: [3]
    MailboxList:
      type: object
      additionalProperties: false
      required: [mailboxes]
      properties:
        mailboxes:
          type: array
          items:
            $ref: "#/components/schemas/ListedMailbox"
    OrganizationMailboxList:
      type: object
      additionalProperties: false
      required: [mailboxes, owners]
      properties:
        mailboxes:
          type: array
          description: Every mailbox, those without an address included.
          items:
            $ref: "#/components/schemas/Mailbox"
        owners:
          type: array
          description: The actors that own the mailboxes, each once.
          items:
            $ref: "#/components/schemas/Actor"
    MailboxChangePage:
      type: object
      additionalProperties: false
      required: [changes, position]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/MailboxChange"
        position:
          type: integer
          description: The position of the last change read, listed or left out, or the one asked for if there were none. Pass it as after to continue.
    MailboxChange:
      description: A change in a mailbox.
      oneOf:
        - $ref: "#/components/schemas/MessageReceived"
        - $ref: "#/components/schemas/DraftWritten"
        - $ref: "#/components/schemas/DraftChanged"
        - $ref: "#/components/schemas/DraftDeleted"
        - $ref: "#/components/schemas/SendAsked"
        - $ref: "#/components/schemas/ApprovalAsked"
        - $ref: "#/components/schemas/ApprovalWithdrawn"
        - $ref: "#/components/schemas/ApprovalDecided"
        - $ref: "#/components/schemas/ApprovalUndone"
        - $ref: "#/components/schemas/MessageSent"
        - $ref: "#/components/schemas/SendWaitingForLimit"
        - $ref: "#/components/schemas/SentNow"
        - $ref: "#/components/schemas/SendFailed"
        - $ref: "#/components/schemas/SendUnclear"
        - $ref: "#/components/schemas/FeedbackReceived"
        - $ref: "#/components/schemas/ThreadRead"
        - $ref: "#/components/schemas/ThreadUnread"
        - $ref: "#/components/schemas/ThreadLabelsChanged"
        - $ref: "#/components/schemas/ReminderSet"
        - $ref: "#/components/schemas/ReminderCancelled"
        - $ref: "#/components/schemas/ThreadBack"
        - $ref: "#/components/schemas/LabelCreated"
        - $ref: "#/components/schemas/LabelRenamed"
        - $ref: "#/components/schemas/LabelDeleted"
        - $ref: "#/components/schemas/ThreadErased"
        - $ref: "#/components/schemas/AgentSettingsChanged"
        - $ref: "#/components/schemas/AgentPaused"
        - $ref: "#/components/schemas/AgentUnpaused"
        - $ref: "#/components/schemas/SenderScreened"
        - $ref: "#/components/schemas/ScreenerSwitched"
        - $ref: "#/components/schemas/ScreenedSenderRemoved"
        - $ref: "#/components/schemas/UnsubscribeAttempted"
        - $ref: "#/components/schemas/SenderDeliverySet"
        - $ref: "#/components/schemas/SenderDeliveryRemoved"
        - $ref: "#/components/schemas/MessageDropped"
        - $ref: "#/components/schemas/LabelPromptSet"
        - $ref: "#/components/schemas/LabelPromptRemoved"
        - $ref: "#/components/schemas/TaskGiven"
        - $ref: "#/components/schemas/TaskStarted"
        - $ref: "#/components/schemas/TaskEnded"
        - $ref: "#/components/schemas/AgentHandedOver"
        - $ref: "#/components/schemas/ConversationTurnTaken"
        - $ref: "#/components/schemas/MailboxAgentsMerged"
        - $ref: "#/components/schemas/LinkedFileDownloaded"
        - $ref: "#/components/schemas/SharingStopped"
      discriminator:
        propertyName: type
        mapping:
          messageReceived: "#/components/schemas/MessageReceived"
          draftWritten: "#/components/schemas/DraftWritten"
          draftChanged: "#/components/schemas/DraftChanged"
          draftDeleted: "#/components/schemas/DraftDeleted"
          sendAsked: "#/components/schemas/SendAsked"
          approvalAsked: "#/components/schemas/ApprovalAsked"
          approvalWithdrawn: "#/components/schemas/ApprovalWithdrawn"
          approvalDecided: "#/components/schemas/ApprovalDecided"
          approvalUndone: "#/components/schemas/ApprovalUndone"
          messageSent: "#/components/schemas/MessageSent"
          sendWaitingForLimit: "#/components/schemas/SendWaitingForLimit"
          sentNow: "#/components/schemas/SentNow"
          sendFailed: "#/components/schemas/SendFailed"
          sendUnclear: "#/components/schemas/SendUnclear"
          feedbackReceived: "#/components/schemas/FeedbackReceived"
          threadRead: "#/components/schemas/ThreadRead"
          threadUnread: "#/components/schemas/ThreadUnread"
          threadLabelsChanged: "#/components/schemas/ThreadLabelsChanged"
          reminderSet: "#/components/schemas/ReminderSet"
          reminderCancelled: "#/components/schemas/ReminderCancelled"
          threadBack: "#/components/schemas/ThreadBack"
          labelCreated: "#/components/schemas/LabelCreated"
          labelRenamed: "#/components/schemas/LabelRenamed"
          labelDeleted: "#/components/schemas/LabelDeleted"
          threadErased: "#/components/schemas/ThreadErased"
          agentSettingsChanged: "#/components/schemas/AgentSettingsChanged"
          agentPaused: "#/components/schemas/AgentPaused"
          agentUnpaused: "#/components/schemas/AgentUnpaused"
          senderScreened: "#/components/schemas/SenderScreened"
          screenerSwitched: "#/components/schemas/ScreenerSwitched"
          screenedSenderRemoved: "#/components/schemas/ScreenedSenderRemoved"
          unsubscribeAttempted: "#/components/schemas/UnsubscribeAttempted"
          senderDeliverySet: "#/components/schemas/SenderDeliverySet"
          senderDeliveryRemoved: "#/components/schemas/SenderDeliveryRemoved"
          messageDropped: "#/components/schemas/MessageDropped"
          labelPromptSet: "#/components/schemas/LabelPromptSet"
          labelPromptRemoved: "#/components/schemas/LabelPromptRemoved"
          taskGiven: "#/components/schemas/TaskGiven"
          taskStarted: "#/components/schemas/TaskStarted"
          taskEnded: "#/components/schemas/TaskEnded"
          agentHandedOver: "#/components/schemas/AgentHandedOver"
          conversationTurn: "#/components/schemas/ConversationTurnTaken"
          mailboxAgentsMerged: "#/components/schemas/MailboxAgentsMerged"
          linkedFileDownloaded: "#/components/schemas/LinkedFileDownloaded"
          sharingStopped: "#/components/schemas/SharingStopped"
    MessageReceived:
      type: object
      additionalProperties: false
      required: [position, at, type, thread, message]
      description: Mail arrived. No actor made this change, so it names none.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When the mail arrived.
        type:
          type: string
          const: messageReceived
        thread:
          type: string
          description: The ID of the thread the message is in.
        message:
          type: string
          description: The message's ID.
        spam:
          type: boolean
          const: true
          description: Present when the mail was judged to be spam, so its thread has the Spam label instead of Inbox.
        screened:
          type: string
          enum: [waiting, blocked]
          description: >
            Present when the mail started a thread that skipped the Inbox:
            waiting when its sender is first-time, so it waits in the
            Screener, and blocked when the mailbox had blocked its sender,
            before deliveries existed, so it went to Trash.
        delivered:
          $ref: "#/components/schemas/Delivery"
          description: Present when its sender's delivery filed it outside the Inbox, in the Feed, the Paper Trail or a label.
        deliveredTo:
          type: string
          description: With delivered, the ID of the label the delivery filed it under, feed, paperTrail or one of the mailbox's own.
    DraftWritten:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          properties:
            type:
              type: string
              const: draftWritten
            draft:
              type: string
              description: The draft's ID.
    DraftChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          properties:
            type:
              type: string
              const: draftChanged
            draft:
              type: string
              description: The draft's ID.
    DraftDeleted:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          properties:
            type:
              type: string
              const: draftDeleted
            draft:
              type: string
              description: The draft's ID.
    SendAsked:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          description: A human asked to send a draft from their own mailbox, which needs no approval, so Duva sends it next.
          properties:
            type:
              type: string
              const: sendAsked
            draft:
              type: string
              description: The draft's ID.
    ApprovalAsked:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval]
          properties:
            type:
              type: string
              const: approvalAsked
            draft:
              type: string
              description: The ID of the draft to send.
            approval:
              type: string
              description: The ID of the approval it waits for.
    ApprovalWithdrawn:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval]
          description: >-
            The request was withdrawn while it waited: the draft changed, it
            was sent without approval, or the agent's sponsor access was lowered
            from send, or no longer covers the mailbox.
          properties:
            type:
              type: string
              const: approvalWithdrawn
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The ID of the approval withdrawn.
    ApprovalDecided:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval, decision]
          properties:
            type:
              type: string
              const: approvalDecided
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The approval's ID.
            decision:
              type: string
              enum: [approved, rejected]
            edits:
              $ref: "#/components/schemas/Edits"
            note:
              type: string
              description: The approver's note, with a rejection.
    ApprovalUndone:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval]
          description: The approver undid an approval during the undo window, so the draft waits for approval again, as the agent asked it.
          properties:
            type:
              type: string
              const: approvalUndone
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The approval's ID.
    MessageSent:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, thread, message]
          description: SES accepted an approved draft. It names who sent it, the agent for an agent's draft.
          properties:
            type:
              type: string
              const: messageSent
            draft:
              type: string
              description: The draft's ID.
            thread:
              type: string
              description: The ID of the thread the sent message is in.
            message:
              type: string
              description: The sent message's ID.
    SendWaitingForLimit:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          description: >
            An agent's approved draft waits, since sending it now would go over
            the agent's send limits, or its other sends already wait. It goes
            out by itself as the limits allow, oldest first. Recorded under the
            agent.
          properties:
            type:
              type: string
              const: sendWaitingForLimit
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The ID of the approval that let it go, if it needed one.
    SentNow:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          description: The agent's sponsor sent a draft waiting for the agent's send limits now, past the limits, which stay as they are.
          properties:
            type:
              type: string
              const: sentNow
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The ID of the approval that let it go, if it needed one.
    SendFailed:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          description: SES refused an approved draft, so it wasn't sent.
          properties:
            type:
              type: string
              const: sendFailed
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The ID of the approval that let it go, if it needed one.
            reason:
              type: string
              description: SES's reason. Always there, except in the activity an admin who isn't the agent's sponsor reads.
    SendUnclear:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          description: >
            Sending an approved draft stopped before SES answered, so it is
            unclear whether SES accepted it. Duva doesn't send it again, and a
            human checks.
          properties:
            type:
              type: string
              const: sendUnclear
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The ID of the approval that let it go, if it needed one.
    FeedbackReceived:
      type: object
      additionalProperties: false
      required: [position, at, type, draft, thread, message, feedback]
      description: >
        SES reported a bounce, a complaint or a reject for a message sent from the mailbox. No
        actor made this change, so it names none.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When Duva recorded it.
        type:
          type: string
          const: feedbackReceived
        draft:
          type: string
          description: The ID of the draft the message was sent from.
        thread:
          type: string
          description: The ID of the thread the message is in.
        message:
          type: string
          description: The sent message's ID.
        feedback:
          $ref: "#/components/schemas/SendFeedback"
    SendFeedback:
      type: object
      additionalProperties: false
      required: [kind, at]
      description: >
        What SES reported about a sent message after accepting it. A hard bounce means the address
        doesn't take mail, and a soft bounce that it didn't for now. One complaint about an agent's
        mail, or 5 hard bounces of its mail within an hour, each recipient that isn't one of the
        organization's addresses counting, pause the agent (ADR-0021).
      properties:
        kind:
          type: string
          enum: [hardBounce, softBounce, complaint, reject]
          description: >
            hardBounce or softBounce from a recipient's mail server; complaint, when a recipient
            marked it as spam; or reject, when SES didn't send it after all, as for a virus.
        at:
          type: string
          format: date-time
          description: When SES says it happened.
        recipients:
          type: array
          items:
            type: string
          description: The recipients it concerns. A reject concerns them all. Always there, except in the activity an admin who isn't the agent's sponsor reads.
        reason:
          type: string
          description: SES's reason, if it gives one, as the bounce's subtype, the complaint's type or the reject's reason.
          examples: ["NoEmail", "abuse", "Bad content"]
        localRecipients:
          type: array
          items:
            type: string
          description: >
            The recipients of a hard bounce that are the organization's own addresses, if any. SES
            takes a few seconds to start receiving mail for a new address, and refuses it until
            then, so Duva took them off SES's suppression list again, and their bounce never counts
            toward pausing the agent.
    ThreadRead:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, thread]
          properties:
            type:
              type: string
              const: threadRead
            thread:
              type: string
              description: The ID of the thread marked read.
    ThreadUnread:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, thread]
          properties:
            type:
              type: string
              const: threadUnread
            thread:
              type: string
              description: The ID of the thread marked unread.
    ThreadLabelsChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, thread, added, removed]
          properties:
            type:
              type: string
              const: threadLabelsChanged
            thread:
              type: string
              description: The ID of the thread.
            added:
              type: array
              items:
                type: string
              description: The IDs of the labels the thread got.
              examples: [["trash"]]
            removed:
              type: array
              items:
                type: string
              description: The IDs of the labels the thread lost.
              examples: [["inbox"]]
    ReminderSet:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, thread, until]
          description: >-
            The thread was set aside in Remind me, or its time changed. If it
            left the Inbox, a threadLabelsChanged change says so.
          properties:
            type:
              type: string
              const: reminderSet
            thread:
              type: string
              description: The ID of the thread.
            until:
              type: string
              format: date-time
              description: When the thread comes back.
    ReminderCancelled:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, thread]
          description: >-
            The thread's reminder was cancelled, or ended when the thread was
            moved to the Inbox, Spam or Trash. A threadLabelsChanged change
            says where it went.
          properties:
            type:
              type: string
              const: reminderCancelled
            thread:
              type: string
              description: The ID of the thread.
    ThreadBack:
      type: object
      additionalProperties: false
      required: [position, at, type, thread, setAsideAt]
      description: >-
        A thread set aside in Remind me came back to the top of the Inbox,
        unread, with its Back mark, at its time or early with new mail. No
        actor made this change, so it names none.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When the thread came back.
        type:
          type: string
          const: threadBack
        thread:
          type: string
          description: The ID of the thread.
        setAsideAt:
          type: string
          format: date-time
          description: When the thread was set aside.
        early:
          type: boolean
          const: true
          description: Present when new mail in the thread brought it back before its time, in the messageReceived change just before.
    LabelCreated:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, label]
          properties:
            type:
              type: string
              const: labelCreated
            label:
              type: string
              description: The label's ID.
            name:
              type: string
              description: The label's name. Always there, except in the activity an admin who isn't the agent's sponsor reads.
    LabelRenamed:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, label]
          properties:
            type:
              type: string
              const: labelRenamed
            label:
              type: string
              description: The label's ID.
            name:
              type: string
              description: The label's new name. Always there, except in the activity an admin who isn't the agent's sponsor reads.
    LabelPromptSet:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, label]
          description: The label's owner gave it a prompt, or replaced it.
          properties:
            type:
              type: string
              const: labelPromptSet
            label:
              type: string
              description: The label's ID.
    LabelPromptRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, label]
          description: The label's owner removed its prompt.
          properties:
            type:
              type: string
              const: labelPromptRemoved
            label:
              type: string
              description: The label's ID.
    TaskGiven:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, task, thread, message, label, agent]
          description: >-
            A label's prompt gave the mailbox agent a task, as the label was
            added to the message. Its actor is the one who added the label,
            or duva when a sender's delivery did.
          properties:
            type:
              type: string
              const: taskGiven
            task:
              type: string
              description: The task's ID.
            thread:
              type: string
              description: The ID of the thread the message is in.
            message:
              type: string
              description: The ID of the message.
            label:
              type: string
              description: The ID of the label.
            agent:
              type: string
              description: The ID of the mailbox agent.
    TaskStarted:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, task, thread, agent]
          description: The mailbox agent started a task, naming it.
          properties:
            type:
              type: string
              const: taskStarted
            task:
              type: string
              description: The task's ID.
            thread:
              type: string
              description: The ID of the thread the task is about.
            agent:
              type: string
              description: The ID of the mailbox agent.
    AgentHandedOver:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent, handover]
          description: >-
            The mailbox agent's run went over to the harder model, in a turn of
            Ask Coo, or in a task, naming the agent.
          properties:
            type:
              type: string
              const: agentHandedOver
            agent:
              type: string
              description: The ID of the mailbox agent.
            handover:
              $ref: "#/components/schemas/Handover"
            task:
              type: string
              description: The task's ID, if it was a task.
            thread:
              type: string
              description: The ID of the thread the task is about, if it was a task.
    ConversationTurnTaken:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent, human, threads, drafts, models, outcome, cost]
          description: >-
            A turn of Ask Coo ended: the human asked the mailbox agent, which
            answered, naming the agent. Every turn records one, a turn that
            only read included.
          properties:
            type:
              type: string
              const: conversationTurn
            agent:
              type: string
              description: The ID of the mailbox agent.
            human:
              type: string
              description: The ID of the human who asked.
            asked:
              type: string
              description: >-
                What the human asked: the first 120 characters of their words,
                ending in … where they went on.
            threads:
              type: array
              items:
                type: string
              description: The IDs of the threads the agent read or changed, in the order it first touched them.
            drafts:
              type: array
              items:
                type: string
              description: The IDs of the drafts it wrote, changed or asked to send.
            models:
              type: array
              items:
                $ref: "#/components/schemas/MailboxAgentModel"
              description: The models that answered, in order, the harder one last after a handover.
            handover:
              $ref: "#/components/schemas/Handover"
            harder:
              type: boolean
              description: Whether the human asked the harder model to think harder about their last turn.
            allMailboxes:
              type: boolean
              description: >-
                Present, true, for a turn asked from All mailboxes, which the
                feed of the first of the human's mailboxes the agent works in
                records. A turn asked from one mailbox is in that one's feed.
            outcome:
              type: string
              enum: [answered, capReached, failed]
              description: How the agent's turn ended, as the conversation's turn says.
            cost:
              type: number
              minimum: 0
              description: What the turn's model calls cost, in US cents.
    TaskEnded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, task, thread, agent, outcome]
          description: A task was done, or failed, naming the mailbox agent. The thread's task has its note.
          properties:
            type:
              type: string
              const: taskEnded
            task:
              type: string
              description: The task's ID.
            thread:
              type: string
              description: The ID of the thread the task is about.
            agent:
              type: string
              description: The ID of the mailbox agent.
            outcome:
              type: string
              enum: [done, failed]
              description: How it ended.
            note:
              type: string
              description: >-
                In the activity the agent's sponsor reads, what the agent said
                it did, or why it failed, while its thread is kept. The feed
                itself keeps no note, so an erased thread leaves none.
    LabelDeleted:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, label]
          properties:
            type:
              type: string
              const: labelDeleted
            label:
              type: string
              description: The ID of the label deleted.
    LinkedFileDownloaded:
      type: object
      additionalProperties: false
      required: [position, at, type, thread, message, file, name]
      description: >-
        A linked file of a message sent from the mailbox was downloaded for
        the first time, from its page's Download button. Later downloads only
        count. No actor made this change, and Duva keeps no downloader's address.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When it was downloaded.
        type:
          type: string
          const: linkedFileDownloaded
        thread:
          type: string
          description: The ID of the sent message's thread.
        message:
          type: string
          description: The sent message's ID.
        file:
          type: string
          description: The linked file's ID in the message.
        name:
          type: string
          description: The file's name.
          examples: ["film.mov"]
    SharingStopped:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, message, file]
          description: An actor stopped sharing a linked file of a message sent from the mailbox, so its link ended and the file was deleted.
          properties:
            type:
              type: string
              const: sharingStopped
            message:
              type: string
              description: The sent message's ID.
            file:
              type: string
              description: The linked file's ID in the message.
    ThreadErased:
      type: object
      additionalProperties: false
      required: [position, at, type, thread]
      description: >
        A thread was erased for good, with its messages. The change keeps none
        of their content. Emptying Trash names the actor who emptied it.
        Erasing Trash and Spam after the retention period names none.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When the thread was erased.
        actor:
          type: string
          description: The ID of the actor who emptied Trash, if one did.
        type:
          type: string
          const: threadErased
        thread:
          type: string
          description: The ID of the thread erased.
    AgentSettingsChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent, before, after]
          description: The sponsor changed an agent's settings, or an admin lowered a cap below its send limits. Recorded in each of the sponsor's personal mailboxes.
          properties:
            type:
              type: string
              const: agentSettingsChanged
            agent:
              type: string
              description: The ID of the agent whose settings changed.
            before:
              $ref: "#/components/schemas/AgentSettingsChanges"
              description: The settings that changed, each with its old value.
            after:
              $ref: "#/components/schemas/AgentSettingsChanges"
              description: The settings that changed, each with its new value.
    Screener:
      type: object
      additionalProperties: false
      required: [on, senders, decided]
      description: Where mail from a mailbox's first-time senders waits until an actor decides where their mail goes.
      properties:
        "on":
          type: boolean
          description: Whether mail from first-time senders waits here. Mail that is already waiting stays until it is decided.
        senders:
          type: array
          description: The senders whose mail waits, newest first.
          items:
            $ref: "#/components/schemas/WaitingSender"
        decided:
          type: integer
          description: How many addresses and domains the mailbox has decided where mail goes for.
          examples: [42]
    WaitingSender:
      type: object
      additionalProperties: false
      required: [address, latestAt, threads]
      description: A first-time sender, with their mail that waits in the Screener.
      properties:
        address:
          type: string
          description: The sender's address, as their newest waiting thread gives it.
          examples: ["grace@example.org"]
        name:
          type: string
          description: The sender's name, as their newest waiting thread gives it, if it gives one.
          examples: ["Grace Hopper"]
        latestAt:
          type: string
          format: date-time
          description: When their newest waiting mail arrived.
        threads:
          type: array
          description: Their waiting threads, newest first.
          items:
            $ref: "#/components/schemas/ThreadSummary"
    ScreenerSwitch:
      type: object
      additionalProperties: false
      required: ["on"]
      properties:
        "on":
          type: boolean
          description: True to switch the Screener on, false to switch it off.
    SenderDelivery:
      type: object
      additionalProperties: false
      required: [delivery]
      properties:
        delivery:
          $ref: "#/components/schemas/Delivery"
        label:
          type: string
          description: For label, the ID of the mailbox's own label to file their mail under.
    ScreenedSender:
      type: object
      additionalProperties: false
      required: [delivery, decidedAt]
      description: An address or a domain a mailbox has decided where mail goes for. It has one of address and domain.
      properties:
        address:
          type: string
          description: The address, in lower case.
          examples: ["grace@example.org"]
        domain:
          type: string
          description: The domain, in lower case. It covers exactly that domain, and an address's own decision beats it.
          examples: ["example.org"]
        delivery:
          $ref: "#/components/schemas/Delivery"
        label:
          type: string
          description: For label, the ID of the label their mail is filed under.
        decidedAt:
          type: string
          format: date-time
          description: When it was decided.
        actor:
          type: string
          description: The ID of the actor who decided, if one did. Switching the Screener on sends the mailbox's senders' mail to the Inbox under whoever switched it, and setup's under no one.
        unsubscribe:
          $ref: "#/components/schemas/SenderUnsubscribe"
    SenderUnsubscribe:
      type: object
      additionalProperties: false
      required: [method, outcome, at]
      description: >
        For nowhere, how unsubscribing from the sender's mail went last: by
        one-click, then by the mailbox agent on the opt-out page, by the
        unsubscribe address, by a link in the mail, and as a last resort by
        bouncing their mail. It goes on with each message dropped later,
        until a method works.
      properties:
        method:
          $ref: "#/components/schemas/UnsubscribeMethod"
        outcome:
          $ref: "#/components/schemas/UnsubscribeOutcome"
        reason:
          $ref: "#/components/schemas/UnsubscribeReason"
        status:
          type: integer
          description: The HTTP status the sender's server answered with, when it refused.
        detail:
          type: string
          description: What the mailbox agent read on the page, or why the method failed, in its words or Duva's.
        at:
          type: string
          format: date-time
          description: When it was tried.
        actor:
          type: string
          description: The ID of the actor who tried it, the mailbox agent for every method but one-click, if one did.
    Delivery:
      type: string
      enum: [inbox, feed, paperTrail, label, nowhere]
      description: >
        Where a sender's mail goes. inbox: the Inbox. feed: the Feed, for
        newsletters, unread. paperTrail: the Paper Trail, for receipts and
        notifications, unread. label: a label of the mailbox's own, unread,
        instead of the Inbox. nowhere: dropped on arrival, keeping none of it.
    ScreeningDecision:
      type: object
      additionalProperties: false
      required: [sender, threads]
      properties:
        sender:
          $ref: "#/components/schemas/ScreenedSender"
        threads:
          type: array
          description: The threads it moved, as they are now, newest first.
          items:
            $ref: "#/components/schemas/ThreadSummary"
        erasing:
          type: integer
          description: For nowhere, how many of the sender's threads are being erased for good.
        unsubscribe:
          $ref: "#/components/schemas/Unsubscribe"
          description: For nowhere, how unsubscribing from the sender's mail went.
    SenderSheet:
      type: object
      additionalProperties: false
      required: [threads, goesTo]
      description: A sender in a mailbox, an address or a domain. It has one of address and domain.
      properties:
        address:
          type: string
          description: The sender's address, in lower case.
          examples: ["grace@example.org"]
        domain:
          type: string
          description: The domain, in lower case.
          examples: ["example.org"]
        name:
          type: string
          description: For an address, the sender's name as their newest thread gives it, if it gives one.
          examples: ["Grace Hopper"]
        threads:
          type: integer
          description: How many threads in the mailbox they started, Spam and Trash included. For a domain, everyone's there.
          examples: [12]
        goesTo:
          type: string
          enum: [screener, inbox, feed, paperTrail, label, nowhere]
          description: >
            Where their new mail goes now, as a delivery says, or screener when
            it waits in the Screener for a first-time sender.
        label:
          type: string
          description: When goesTo is label, the ID of the label.
        decided:
          $ref: "#/components/schemas/ScreenedSender"
          description: The decision that sends their mail where it goes, the mailbox's on their address or else on their domain, if it has one.
    ScreenedSenderList:
      type: object
      additionalProperties: false
      required: [senders]
      properties:
        senders:
          type: array
          description: The addresses and domains the mailbox decided on, newest decision first.
          items:
            $ref: "#/components/schemas/ScreenedSender"
    Unsubscribe:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/UnsubscribeOutcome"
        reason:
          $ref: "#/components/schemas/UnsubscribeReason"
        status:
          type: integer
          description: The HTTP status the sender's server answered with, when it refused.
    UnsubscribeMethod:
      type: string
      enum: [oneClick, page, mailto, link, bounce]
      description: >
        How Duva unsubscribes, in the order it tries. oneClick: the RFC 8058
        POST. page: the mailbox agent fills in the https List-Unsubscribe
        page in an isolated browser. mailto: the mailbox agent mails the
        List-Unsubscribe address. link: the mailbox agent follows an
        unsubscribe link in the mail. bounce: SES bounces the message as if
        the address were unknown.
    UnsubscribeOutcome:
      type: string
      enum: [unsubscribed, requested, bounced, notOffered, failed]
      description: >
        unsubscribed: the sender's server took the one-click POST, or their
        page said the address is unsubscribed. requested: the mailbox agent
        mailed the unsubscribe address. bounced: SES bounced the message.
        notOffered: Duva sent nothing, and reason says why. failed: the method
        didn't work, and reason says why.
    UnsubscribeReason:
      type: string
      enum: [noMail, spam, noOneClick, notSigned, notAllowed, notPublic, unreachable, timedOut, refused, tooManyRedirects, notDone, notSent, ownDomain, notDmarc, noEnvelopeSender, tooLate, notBounceable]
      description: >
        Why it wasn't unsubscribed. Not offered: noMail, the mailbox has no
        mail from the sender; spam, SES judged all of it to be spam;
        noOneClick, the newest has no https List-Unsubscribe with
        List-Unsubscribe-Post One-Click; notSigned, no DKIM signature that
        passed covers both headers. Failed: notAllowed, the URL or a redirect
        isn't http or https on port 80 or 443; notPublic, its host isn't at a
        public address; unreachable, its server couldn't be reached; timedOut,
        it didn't answer in time; refused, it answered with neither a
        success nor a 307 or 308 redirect, and status gives its code, or SES
        refused to bounce the message, and detail gives its words;
        tooManyRedirects, it redirected more than 3 times; notDone, the
        mailbox agent couldn't unsubscribe on the page, and detail says why;
        notSent, the unsubscribe address couldn't be mailed; ownDomain, the
        mail comes from the organization's own domain, which is never
        bounced; notDmarc, the message didn't pass DMARC, so it isn't
        bounced; noEnvelopeSender, it has no envelope sender to bounce to;
        tooLate, SES bounces a message only within 24 hours of receiving it,
        so the sender's next message is bounced as it arrives;
        notBounceable, before Duva gave each of these its own reason, any of
        ownDomain, notDmarc and noEnvelopeSender.
    UnsubscribeAttempted:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, outcome]
          description: >
            Duva tried to unsubscribe the mailbox from a sender's mail: by
            one-click when an actor chose nowhere for them, by address or by
            domain, or blocked them before deliveries existed, naming that
            actor, and when it dropped their message, naming none; and by the
            later methods, naming the mailbox agent that tried them. Without a
            method, it was one-click.
          properties:
            type:
              type: string
              const: unsubscribeAttempted
            address:
              type: string
              description: The sender's address, in lower case, if the decision is on an address or a message was dropped.
            domain:
              type: string
              description: The domain, in lower case, if the decision is on a domain.
            outcome:
              $ref: "#/components/schemas/UnsubscribeOutcome"
            reason:
              $ref: "#/components/schemas/UnsubscribeReason"
            status:
              type: integer
              description: The HTTP status the sender's server answered with, when it refused.
            method:
              $ref: "#/components/schemas/UnsubscribeMethod"
            detail:
              type: string
              description: What the mailbox agent read on the page, or why the method failed.
    SenderScreened:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, decision]
          description: An actor let a sender in or blocked them, by address or by domain, before deliveries replaced that. Each thread the decision moved has its own threadLabelsChanged.
          properties:
            type:
              type: string
              const: senderScreened
            address:
              type: string
              description: The sender's address, in lower case, if the decision is on an address.
            domain:
              type: string
              description: The domain, in lower case, if the decision is on a domain.
            decision:
              type: string
              enum: [letIn, block]
              description: letIn let the sender's mail into the Inbox, and block sent it to Trash.
    ScreenedSenderRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, decision]
          description: An actor removed the mailbox's decision on a sender, who is first-time again, before deliveries replaced letting in and blocking. Each thread it moved has its own threadLabelsChanged.
          properties:
            type:
              type: string
              const: screenedSenderRemoved
            address:
              type: string
              description: The sender's address, in lower case, if the decision was on an address.
            domain:
              type: string
              description: The domain, in lower case, if the decision was on a domain.
            decision:
              type: string
              enum: [letIn, block]
              description: The decision it was.
    SenderDeliverySet:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, delivery]
          description: An actor decided where a sender's mail goes, by address or by domain. Each thread the decision moved or erased has its own change.
          properties:
            type:
              type: string
              const: senderDeliverySet
            address:
              type: string
              description: The sender's address, in lower case, if the decision is on an address.
            domain:
              type: string
              description: The domain, in lower case, if the decision is on a domain.
            delivery:
              $ref: "#/components/schemas/Delivery"
            label:
              type: string
              description: For label, the ID of the label.
    SenderDeliveryRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, delivery]
          description: An actor removed the mailbox's decision on a sender, who is first-time again. Each thread it moved has its own threadLabelsChanged.
          properties:
            type:
              type: string
              const: senderDeliveryRemoved
            address:
              type: string
              description: The sender's address, in lower case, if the decision was on an address.
            domain:
              type: string
              description: The domain, in lower case, if the decision was on a domain.
            delivery:
              $ref: "#/components/schemas/Delivery"
              description: The delivery it was.
            label:
              type: string
              description: For label, the ID of the label it was.
    MessageDropped:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, address]
          description: >
            Mail arrived from a sender whose mail goes nowhere, and Duva
            dropped it without keeping any of it. Arriving mail names no actor.
          properties:
            type:
              type: string
              const: messageDropped
            address:
              type: string
              description: The sender's address, in lower case.
    ScreenerSwitched:
      type: object
      additionalProperties: false
      required: [position, at, type, "on"]
      description: >
        The Screener was switched on or off. Switching it off moves each
        waiting thread to the Inbox, each with its own threadLabelsChanged.
        Setup switching it on for a mailbox that had it before the Screener
        existed names no actor.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When it was switched.
        actor:
          type: string
          description: The ID of the actor who switched it, if one did.
        type:
          type: string
          const: screenerSwitched
        "on":
          type: boolean
          description: Whether it is on now.
        letIn:
          type: integer
          description: When switched on, how many of the mailbox's senders without a decision yet it sent to the Inbox.
    TrashEmptying:
      type: object
      additionalProperties: false
      required: [emptiedAt]
      properties:
        emptiedAt:
          type: string
          format: date-time
          description: When Trash was emptied. Every thread in Trash then is being erased.
    NewDraft:
      type: object
      additionalProperties: false
      properties:
        answers:
          type: string
          description: The ID of the message the draft replies to. Without it or forwards, the draft is a new message.
        forwards:
          type: string
          description: The ID of the message the draft forwards, with its text and attachments. Give answers or forwards, not both.
        from:
          type: string
          description: >-
            The address to send from: one of the mailbox's addresses, or a
            group its owner is a local member of, to send as the group. A
            reply or a forward goes from the address the original was sent
            to unless you give one, and a new message from the default address.
          examples: ["support@example.com"]
        replyAll:
          type: boolean
          description: With answers, replies to all, so every other recipient of the original gets it too, except the mailbox's own addresses.
        to:
          type: array
          items:
            type: string
          description: The recipients' addresses. A reply goes to the original's Reply-To or From unless you give them.
          examples: [["grace@example.org"]]
        cc:
          type: array
          items:
            type: string
          description: The Cc recipients' addresses. A reply to all copies the original's Cc recipients unless you give them.
        bcc:
          type: array
          items:
            type: string
          description: The Bcc recipients' addresses, which get the message but appear in no header.
        subject:
          type: string
          maxLength: 998
          description: 'The subject. A reply''s is the original''s with "Re: " unless you give one.'
        text:
          type: string
          maxLength: 50000
          description: The plain-text body.
        linkDays:
          $ref: "#/components/schemas/LinkDays"
    DraftChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        from:
          type: string
          description: >-
            The address to send from, in place of the draft's: one of the
            mailbox's addresses, or a group its owner is a local member of.
        to:
          type: array
          items:
            type: string
          description: The recipients' addresses, in place of the draft's.
        cc:
          type: array
          items:
            type: string
          description: The Cc recipients' addresses, in place of the draft's.
        bcc:
          type: array
          items:
            type: string
          description: The Bcc recipients' addresses, in place of the draft's.
        subject:
          type: string
          maxLength: 998
          description: The subject, in place of the draft's.
        text:
          type: string
          maxLength: 50000
          description: The plain-text body.
        linkDays:
          $ref: "#/components/schemas/LinkDays"
    ApproverEdits:
      type: object
      additionalProperties: false
      properties:
        to:
          type: array
          items:
            type: string
          description: The recipients' addresses, in place of the draft's.
          examples: [["grace@example.org"]]
        subject:
          type: string
          maxLength: 998
          description: The subject, in place of the draft's.
        text:
          type: string
          maxLength: 50000
          description: The plain-text body, in place of the draft's.
    Edits:
      type: object
      additionalProperties: false
      description: What the approver changed before sending.
      properties:
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        text:
          type: string
    Draft:
      type: object
      additionalProperties: false
      required: [id, from, to, cc, bcc, subject, text, updatedAt]
      description: A message a mailbox's owner is writing.
      properties:
        id:
          type: string
          description: The draft's ID.
        answers:
          type: string
          description: The ID of the message the draft replies to, if it is a reply.
        forwards:
          type: string
          description: The ID of the message the draft forwards, if it is a forward.
        thread:
          type: string
          description: The ID of the thread of the message it replies to or forwards, which the sent message joins.
        from:
          type: string
          description: The address it goes from, one of the mailbox's or a group's.
          examples: ["hermes+news@example.com"]
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          description: Recipients who get the message, but appear in no header.
        subject:
          type: string
        text:
          type: string
          description: The plain-text body.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/DraftAttachment"
          description: The files it carries, those uploaded to it and those of the message it forwards.
        linkDays:
          $ref: "#/components/schemas/LinkDays"
        updatedAt:
          type: string
          format: date-time
          description: When the draft was written or last changed.
        updatedBy:
          type: string
          description: The ID of the actor who wrote the draft or changed it last, the approver if they edited it. Drafts written before Duva kept this have none.
        send:
          $ref: "#/components/schemas/SendStatus"
    SendStatus:
      type: object
      additionalProperties: false
      required: [state]
      description: Where the draft's latest request to send stands. A draft never asked to send has none.
      properties:
        approval:
          type: string
          description: The ID of the approval the request needs, if it needs one. A human's send from their own mailbox needs none, nor does an agent's whose sponsor switched approval off.
        state:
          type: string
          enum: [waiting, withdrawn, rejected, approved, waitingForLimit, sending, sent, failed, unclear]
          description: >
            waiting for approval; withdrawn because the draft changed while
            it waited, was sent without approval, or the agent's sponsor
            access was lowered; rejected, with the approver's note; approved,
            and about to be sent, which a send without approval is at once;
            waitingForLimit, approved but over the agent's send limits, or
            behind its other sends that wait, until it goes out by itself,
            oldest first, as the limits allow, or its sponsor sends it now;
            sending; sent, as the message in its thread; failed, with the
            reason; or unclear, when sending stopped before
            SES answered, so a human checks whether it went out, by its
            recipients and subject, since only SES's answer gives its Message-ID. Duva never
            sends an unclear draft again. An approved draft can't change,
            but a rejected or failed one can be revised and sent again.
        undoUntil:
          type: string
          format: date-time
          description: >-
            Until when its approver can undo the approval, for an approved
            send, which the sender takes only after then: the decision's time
            and the organization's undo window. A send approved with a window
            of 0 has none.
        note:
          type: string
          description: The approver's note, if they rejected it.
        reason:
          type: string
          description: Why it failed, SES's reason if SES refused the message.
          examples: ["Email address is not verified."]
        thread:
          type: string
          description: The ID of the thread the sent message is in, once sent.
        message:
          type: string
          description: The sent message's ID in Duva, once sending starts.
        messageId:
          type: string
          description: The Message-ID header the recipients see, which SES gave the message, once sent.
          examples: ["<011001a10373c801-a8e8167e-887a-40a0-a0f7-62c78ecf7270-000000@eu-north-1.amazonses.com>"]
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/SendFeedback"
          description: What SES reported about the sent message since, oldest first, if it reported anything.
    DraftAttachment:
      type: object
      additionalProperties: false
      required: [id, type, size, source]
      description: A file a draft carries.
      properties:
        id:
          type: string
          description: The attachment's ID in the draft.
        name:
          type: string
          description: The file's name, if it has one.
          examples: ["report.pdf"]
        type:
          type: string
          description: The file's media type.
          examples: ["application/pdf"]
        size:
          type: integer
          description: The file's size in bytes.
        source:
          type: string
          enum: [uploaded, forwarded, linked]
          description: >-
            uploaded to the draft, one of the attachments of the message it
            forwards, or one of that message's linked files, which the
            forward carries as the same link, until the same date.
        linked:
          type: string
          enum: [chosen, needed]
          description: >-
            Present when the file goes as a linked file, listed after the
            text with a link to a download page: chosen, as its sender
            chose, or needed, since carrying every attachment would make the
            message more than 10 MB, encoded, so the largest go as links
            until it fits. A linked file of the message it forwards always
            goes as its link, so it has none.
        until:
          type: string
          format: date-time
          description: When its link stops working, for a linked file of the message it forwards.
    LinkDays:
      type: integer
      enum: [7, 30, 365]
      description: >-
        How many days the links of its linked files work after it is sent:
        7, 30 or 365. 30 when left out. When a link ends, its file is deleted.
    DraftAttachmentChanges:
      type: object
      additionalProperties: false
      required: [linked]
      properties:
        linked:
          type: boolean
          description: >-
            true sends the file as a linked file by choice. false carries it
            in the message, unless carrying every attachment would make the
            message more than 10 MB, encoded, and it is among the largest.
    LinkedFile:
      type: object
      additionalProperties: false
      required: [id, name, type, size, until, state, downloads]
      description: >-
        A file a message sent from the mailbox carried as a link to a
        download page, which anyone with the link may open.
      properties:
        id:
          type: string
          description: The linked file's ID in the message.
        name:
          type: string
          examples: ["film.mov"]
        type:
          type: string
          examples: ["video/quicktime"]
        size:
          type: integer
          description: The file's size in bytes.
        until:
          type: string
          format: date-time
          description: When its link stops working and the file is deleted.
        state:
          type: string
          enum: [sharing, stopped, expired]
          description: sharing while its link works; stopped, when its sender stopped sharing it, the send was undone or the mail erased; or expired, past until. A file no longer shared is deleted.
        downloads:
          type: integer
          description: How many times it was downloaded from its page's Download button. Duva keeps no downloader's address.
    NewUpload:
      type: object
      additionalProperties: false
      required: [name, size]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's name, as recipients see it.
          examples: ["report.pdf"]
        type:
          type: string
          description: The file's media type. Without it, application/octet-stream.
          examples: ["application/pdf"]
        size:
          type: integer
          minimum: 1
          maximum: 5368709120
          description: The file's size in bytes, up to 5 GB.
    Upload:
      type: object
      additionalProperties: false
      required: [id, name, type, size, partSize, parts, expiresAt]
      description: A file on its way to a draft.
      properties:
        id:
          type: string
          description: The upload's ID, which the attachment takes once it is complete.
        name:
          type: string
        type:
          type: string
        size:
          type: integer
          description: The file's size in bytes.
        partSize:
          type: integer
          description: How many bytes each part has, the last one fewer.
        parts:
          type: array
          items:
            $ref: "#/components/schemas/UploadPart"
          description: Where each part goes, first to last.
        expiresAt:
          type: string
          format: date-time
          description: When the links stop working.
    UploadPart:
      type: object
      additionalProperties: false
      required: [number, url]
      properties:
        number:
          type: integer
          description: The part's number, from 1. Part 1 holds the file's first partSize bytes, part 2 the next, and so on.
        url:
          type: string
          description: Where to PUT the part's bytes, for whoever has it until it expires.
    DraftList:
      type: object
      additionalProperties: false
      required: [drafts]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/Draft"
    AllMailboxes:
      type: object
      additionalProperties: false
      required: [mailboxes, unread]
      description: Every mailbox you can read, taken together.
      properties:
        mailboxes:
          type: array
          description: The mailboxes, as listing them gives them, each with how many threads in its Inbox are unread.
          items:
            allOf:
              - $ref: "#/components/schemas/ListedMailbox"
              - type: object
                required: [unread]
                properties:
                  unread:
                    type: integer
                    description: How many threads in the mailbox's Inbox are unread.
        unread:
          type: integer
          description: How many threads in all their Inboxes are unread, the sum of theirs.
          examples: [5]
    AllMailboxesThread:
      description: A thread in All mailboxes, which names its mailbox and the address its mail came to.
      allOf:
        - $ref: "#/components/schemas/ThreadSummary"
        - type: object
          required: [mailbox, recipient]
          properties:
            mailbox:
              type: string
              description: The ID of the mailbox the thread is in. Act on it there, or here.
            recipient:
              type: string
              description: >-
                The mailbox's address the thread's first message was delivered
                to, or sent from, with its plus tag, as Duva recorded it from the
                envelope, so it holds for Cc, Bcc, mailing lists, groups and
                catch-alls.
              examples: ["hermes+news@example.com"]
    AllMailboxesThreadList:
      type: object
      additionalProperties: false
      required: [threads]
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/AllMailboxesThread"
        next:
          type: string
          description: Present when more threads follow, in any of the mailboxes. Pass it as after to list the next page, which goes on in each mailbox where this one left off.
    AllMailboxesThreadDetail:
      description: A thread with its messages, and the mailbox it is in.
      allOf:
        - $ref: "#/components/schemas/Thread"
        - type: object
          required: [mailbox, recipient]
          properties:
            mailbox:
              type: string
              description: The ID of the mailbox the thread is in.
            recipient:
              type: string
              description: The mailbox's address the thread's first message was delivered to, or sent from, with its plus tag.
    AllMailboxesChangePage:
      type: object
      additionalProperties: false
      required: [mailboxes, position]
      properties:
        mailboxes:
          type: array
          description: Each mailbox's changes after where you left off, oldest first, every mailbox listed.
          items:
            type: object
            additionalProperties: false
            required: [mailbox, changes, position]
            properties:
              mailbox:
                type: string
                description: The mailbox's ID.
              changes:
                type: array
                items:
                  $ref: "#/components/schemas/MailboxChange"
              position:
                type: integer
                description: The position in the mailbox's own feed of its last change read, listed or left out, as listing its changes alone gives it.
        position:
          type: string
          description: Where every mailbox's feed was read up to. Pass it as after to continue.
    AllMailboxesLabel:
      type: object
      additionalProperties: false
      required: [id, name, builtIn, unread, mailboxes]
      description: A label of All mailboxes, the labels of one name in each mailbox that has it.
      properties:
        id:
          type: string
          description: What to give as label to list its threads, its ID for a built-in label, and its name for the mailboxes' own.
          examples: ["inbox", "Receipts"]
        name:
          type: string
          description: The label's name, as the first mailbox with it gives it.
          examples: ["Receipts"]
        builtIn:
          type: boolean
          description: Whether the label is built in, so every mailbox has it.
        unread:
          type: integer
          description: How many of its threads are unread in all the mailboxes, the sum of theirs.
        mailboxes:
          type: array
          description: The mailboxes that have the label, each with its own.
          items:
            type: object
            additionalProperties: false
            required: [mailbox, label, unread]
            properties:
              mailbox:
                type: string
                description: The mailbox's ID.
              label:
                type: string
                description: The ID of the mailbox's label of this name.
              unread:
                type: integer
                description: How many of its threads in the mailbox are unread.
              prompt:
                type: string
                description: The mailbox's label's prompt, if it has one.
    AllMailboxesLabelList:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/AllMailboxesLabel"
    AllMailboxesSearchResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [thread, message, snippet, highlights]
            properties:
              thread:
                $ref: "#/components/schemas/AllMailboxesThread"
              message:
                type: string
                description: The ID of the thread's message that matched best, or the newest that matched when sorted by newest.
              snippet:
                type: string
                description: The part of that message's text where the words stand, on one line, without quoted lines.
              highlights:
                type: array
                description: Where in the snippet the words and phrases match, in order.
                items:
                  $ref: "#/components/schemas/Highlight"
        next:
          type: string
          description: Present when more threads follow. Pass it as after to read the next page.
    AllMailboxesScreener:
      type: object
      additionalProperties: false
      required: [mailboxes, senders]
      description: The Screeners of All mailboxes, taken together.
      properties:
        mailboxes:
          type: array
          description: Each mailbox's Screener.
          items:
            type: object
            additionalProperties: false
            required: [mailbox, "on", decided]
            properties:
              mailbox:
                type: string
                description: The mailbox's ID.
              "on":
                type: boolean
                description: Whether mail from the mailbox's first-time senders waits in its Screener.
              decided:
                type: integer
                description: How many addresses and domains the mailbox has decided where mail goes for.
        senders:
          type: array
          description: The senders whose mail waits, newest first, once for each mailbox it waits in.
          items:
            $ref: "#/components/schemas/AllMailboxesWaitingSender"
    AllMailboxesWaitingSender:
      type: object
      additionalProperties: false
      required: [mailbox, address, latestAt, threads]
      description: A first-time sender of a mailbox, with their mail that waits in its Screener.
      properties:
        mailbox:
          type: string
          description: The ID of the mailbox their mail waits in, where to decide on them.
        address:
          type: string
          description: The sender's address, as their newest waiting thread gives it.
          examples: ["grace@example.org"]
        name:
          type: string
          description: The sender's name, as their newest waiting thread gives it, if it gives one.
          examples: ["Grace Hopper"]
        latestAt:
          type: string
          format: date-time
          description: When their newest waiting mail arrived.
        threads:
          type: array
          description: Their waiting threads, newest first.
          items:
            $ref: "#/components/schemas/AllMailboxesThread"
    AllMailboxesDraft:
      description: A draft, with the mailbox it lives in.
      allOf:
        - $ref: "#/components/schemas/Draft"
        - type: object
          required: [mailbox]
          properties:
            mailbox:
              type: string
              description: The ID of the mailbox the draft lives in, whose address it goes from.
    AllMailboxesDraftList:
      type: object
      additionalProperties: false
      required: [drafts]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/AllMailboxesDraft"
    Approval:
      type: object
      additionalProperties: false
      required: [id, state, mailbox, agent, approver, draft, askedAt]
      description: A request to send a draft, waiting for or decided by its approver.
      properties:
        id:
          type: string
          description: The approval's ID.
        state:
          type: string
          enum: [pending, withdrawn, rejected, approved]
        mailbox:
          type: string
          description: The ID of the mailbox the draft is in.
        agent:
          type: string
          description: The ID of the agent that asked.
        approver:
          type: string
          description: The ID of the human who decides, the agent's sponsor.
        draft:
          $ref: "#/components/schemas/ApprovalDraft"
        original:
          $ref: "#/components/schemas/Message"
          description: The message the draft replies to, if it is a reply.
        askedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        undoUntil:
          type: string
          format: date-time
          description: Until when its approver can undo it, once approved, as its draft's send says.
        edits:
          $ref: "#/components/schemas/Edits"
        note:
          type: string
          description: The approver's note, if they rejected it.
    ApprovalDraft:
      type: object
      additionalProperties: false
      required: [id, from, to, cc, bcc, subject, text]
      description: The draft as it was when the agent asked, which is what the approver decides on.
      properties:
        id:
          type: string
          description: The draft's ID.
        answers:
          type: string
          description: The ID of the message the draft replies to, if it is a reply.
        forwards:
          type: string
          description: The ID of the message the draft forwards, if it is a forward.
        thread:
          type: string
          description: The ID of that message's thread.
        from:
          type: string
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          description: Recipients who get the message, but appear in no header.
        subject:
          type: string
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/DraftAttachment"
          description: The files it carries, those uploaded to it and those of the message it forwards.
        linkDays:
          $ref: "#/components/schemas/LinkDays"
    Alert:
      type: object
      additionalProperties: false
      required: [id, kind, agent, agentName, at, what, urgent, seen]
      description: A notice to a sponsor that one of their agents needs them.
      properties:
        id:
          type: string
          description: The alert's ID.
        kind:
          type: string
          enum: [sendFailed, bounced, complained, limitReached, pausedBy, limitsChangedBy, removedBy, keyUsedWhilePaused, autoPaused, spendCapReached, taskFailed]
          description: >
            What happened: sendFailed, the agent's send failed, SES rejected
            it, or it's unclear whether it went out; bounced, it hard-bounced;
            complained, a recipient complained about it; limitReached, its
            sends wait for its send limits, once per window; pausedBy,
            limitsChangedBy and removedBy, an admin paused it, lowered its
            limits with a cap, or removed it; keyUsedWhilePaused, its key was
            used while it is paused, once per pause; autoPaused, Duva paused it
            because its mail hurts the domain (ADR-0021); spendCapReached, a
            run of its mailbox agent stopped at the organization's spend cap,
            once a month; taskFailed, a task a label's prompt gave its mailbox
            agent failed.
        agent:
          type: string
          description: The ID of the agent the alert is about.
        agentName:
          type: string
          description: The agent's name when the alert was raised, kept after it is removed.
        at:
          type: string
          format: date-time
          description: When the alert was raised.
        what:
          type: string
          description: What happened, in a sentence or two.
        urgent:
          type: boolean
          description: >
            Whether it is urgent, so also mailed to the sponsor's own mailbox:
            a complaint, a hard bounce that makes 3 or more within an hour, a
            pause or removal by someone else, and a pause by Duva. Urgent
            bounces are mailed once an hour at most, and not while the agent
            is paused.
        seen:
          type: boolean
          description: Whether the sponsor marked it seen.
        by:
          type: string
          description: The ID of the actor who paused, changed or removed the agent, for pausedBy, limitsChangedBy and removedBy.
        mailbox:
          type: string
          description: The ID of the mailbox the message or draft is in, where there is one.
        thread:
          type: string
          description: The ID of the thread the message is in, where there is one.
        message:
          type: string
          description: The ID of the message, where there is one.
        draft:
          type: string
          description: The ID of the draft, where there is one.
    AlertList:
      type: object
      additionalProperties: false
      required: [alerts, unseen]
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        unseen:
          type: integer
          description: How many of the alerts listed, on every page, the sponsor hasn't seen.
        next:
          type: string
          description: Where the next page starts, if there is one. Give it as after.
    AlertIds:
      type: object
      additionalProperties: false
      required: [alerts]
      properties:
        alerts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
          description: The IDs of the alerts.
    UnseenAlerts:
      type: object
      additionalProperties: false
      required: [unseen]
      properties:
        unseen:
          type: integer
          description: How many of your alerts you haven't seen.
    ApprovalList:
      type: object
      additionalProperties: false
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    ApprovalLog:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalLogEntry"
        next:
          type: string
          description: Where the next page starts, if there is one. Give it as after.
    ApprovalLogEntry:
      type: object
      additionalProperties: false
      required: [approval, agent, agentName, decidedBy, decidedAt, outcome, mailbox, draft, subject, to, cc]
      description: A decision on a send one of your agents asked for, and what became of it.
      properties:
        approval:
          type: string
          description: The approval's ID.
        agent:
          type: string
          description: The ID of the agent that asked.
        agentName:
          type: string
          description: The agent's name when it was decided, kept after it is removed.
        decidedBy:
          type: string
          description: The ID of the human who decided.
        decidedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [approved, sent, failed, unclear, rejected]
          description: >
            How it went: approved, on its way, in the undo window, held while
            the agent is paused, waiting for its send limits or being sent;
            sent; failed, with the reason; unclear, when sending stopped
            before SES answered; or rejected, with the note.
        undoUntil:
          type: string
          format: date-time
          description: Until when the approval can be undone, while it can.
        reversal:
          type: string
          enum: [undo, sendAfterAll, correction]
          description: >
            How the decision can be taken back, if it can: undo, during the
            undo window; sendAfterAll, a rejected send whose draft is as the
            agent asked it, which sending the approval does; correction, a
            send that went out, which can't be called back, so a correction
            is written to its recipients.
        mailbox:
          type: string
          description: The ID of the mailbox the draft is in.
        draft:
          type: string
          description: The draft's ID.
        thread:
          type: string
          description: The ID of the thread it went out in, or the one it replies in.
        message:
          type: string
          description: The ID of the message it went out as, once sent.
        subject:
          type: string
          description: Its subject, as sent if it was edited.
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          description: Its recipients in To, as sent if the approver changed them.
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          description: Its recipients in Cc. Those in Bcc are left out, as every header leaves them out.
        note:
          type: string
          description: The note, with a rejection.
        reason:
          type: string
          description: Why it failed.
    Rejection:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the agent should change.
          examples: ["Say we can meet on Tuesday, not Monday."]
    ThreadList:
      type: object
      additionalProperties: false
      required: [threads]
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSummary"
        next:
          type: string
          description: Present when more threads follow. Pass it as after to list the next page.
    ThreadIds:
      type: object
      additionalProperties: false
      required: [threads]
      properties:
        threads:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
          description: The IDs of the threads.
    ThreadLabels:
      type: object
      additionalProperties: false
      required: [threads]
      properties:
        threads:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
          description: The IDs of the threads.
        add:
          type: array
          items:
            type: string
          description: The IDs of the labels to add, such as inbox, spam, trash or one of the mailbox's own.
          examples: [["trash"]]
        remove:
          type: array
          items:
            type: string
          description: The IDs of the labels to remove.
          examples: [["inbox"]]
    ThreadsReminder:
      type: object
      additionalProperties: false
      required: [threads]
      description: The threads to set aside, and when they come back. Give exactly one of at and preset.
      properties:
        threads:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
          description: The IDs of the threads.
        at:
          type: string
          format: date-time
          description: When the threads come back, to the second, at least a minute from now.
          examples: ["2026-10-08T08:00:00+02:00"]
        preset:
          $ref: "#/components/schemas/ReminderPreset"
        timeZone:
          type: string
          description: >-
            The time zone a preset is counted in, as an IANA name. Left out,
            it is your time zone preference, for an agent its sponsor's, or
            UTC if they chose none.
          examples: ["Europe/Stockholm"]
    ReminderPreset:
      type: string
      enum: [laterToday, tomorrowMorning, nextWeek]
      description: >-
        A time counted from now, in the time zone: laterToday is three hours
        from now, on the hour after, tomorrowMorning is 8:00 tomorrow, and
        nextWeek is 8:00 next Monday.
    Reminder:
      type: object
      additionalProperties: false
      required: [at, setAt]
      description: When a thread set aside in Remind me comes back.
      properties:
        at:
          type: string
          format: date-time
          description: When the thread comes back to the Inbox.
        setAt:
          type: string
          format: date-time
          description: When the thread was first set aside. Changing the time keeps it.
    Back:
      type: object
      additionalProperties: false
      required: [at, setAsideAt]
      description: The Back mark of a thread that came back from Remind me, which it keeps until it leaves the Inbox.
      properties:
        at:
          type: string
          format: date-time
          description: When the thread came back. It lists at this time, unless newer mail lists it later.
        setAsideAt:
          type: string
          format: date-time
          description: When the thread was set aside.
    Label:
      type: object
      additionalProperties: false
      required: [id, name, builtIn, unread]
      properties:
        id:
          type: string
          description: The label's ID, which threads list among their labels. The built-in labels' are inbox, feed, paperTrail, spam and trash.
          examples: ["inbox"]
        name:
          type: string
          description: The label's name.
          examples: ["Inbox"]
        builtIn:
          type: boolean
          description: Whether the label is built in, so it can't be renamed or deleted.
        unread:
          type: integer
          description: How many of the label's threads are unread, leaving out those in Spam and Trash unless the label is one of those, and those waiting in the Screener.
        prompt:
          type: string
          description: The label's prompt, if it has one, which hands each message that gets the label to the mailbox agent as a task.
    LabelList:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
    LabelPrompt:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: What the mailbox agent is to do with each message that gets the label.
          examples: ["File the receipt's amount and date in a draft to my accountant, and leave it unsent."]
    Task:
      type: object
      additionalProperties: false
      required: [id, label, labelName, prompt, message, agent, state, givenAt, givenBy]
      description: >
        Work a label's prompt gave the mailbox agent: the prompt, with a
        message that got the label and its thread.
      properties:
        id:
          type: string
          description: The task's ID.
        label:
          type: string
          description: The ID of the label whose prompt gave it.
        labelName:
          type: string
          description: The label's name when it gave the task.
        prompt:
          type: string
          description: The label's prompt when it gave the task.
        message:
          type: string
          description: The ID of the message that got the label.
        agent:
          type: string
          description: The ID of the mailbox agent the task is for.
        state:
          type: string
          enum: [waiting, working, done, failed]
          description: >
            waiting, for its turn, or while the agent is paused; working, the
            agent is on it; done, the agent finished it, with its note;
            failed, the agent couldn't, and why is in its note.
        givenAt:
          type: string
          format: date-time
          description: When the label gave it.
        givenBy:
          type: string
          description: The ID of the actor who added the label, or duva when a sender's delivery did.
        startedAt:
          type: string
          format: date-time
          description: When the agent started it.
        endedAt:
          type: string
          format: date-time
          description: When it was done or failed.
        note:
          type: string
          description: What the agent said it did, or why it failed.
        actions:
          type: array
          description: What the agent did in it, in order.
          items:
            $ref: "#/components/schemas/AgentAction"
        handover:
          $ref: "#/components/schemas/Handover"
    NewLabel:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The label's name.
          examples: ["Receipts"]
    SearchResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        next:
          type: string
          description: Present when more threads follow. Pass it as after to read the next page.
    SearchResult:
      type: object
      additionalProperties: false
      required: [thread, message, snippet, highlights]
      properties:
        thread:
          $ref: "#/components/schemas/ThreadSummary"
        message:
          type: string
          description: The ID of the thread's message that matched best, or the newest that matched when sorted by newest.
        snippet:
          type: string
          description: The part of that message's text where the words stand, on one line, without quoted lines.
        highlights:
          type: array
          description: Where in the snippet the words and phrases match, in order.
          items:
            $ref: "#/components/schemas/Highlight"
    Highlight:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: integer
          minimum: 0
          description: Where the match starts in the snippet, counted in UTF-16 code units, as JavaScript counts a string's length.
        end:
          type: integer
          minimum: 0
          description: Where the match ends, after its last code unit.
    ThreadSummary:
      type: object
      additionalProperties: false
      required: [id, subject, from, snippet, labels, unread, latestAt, messages]
      properties:
        id:
          type: string
          description: The thread's ID.
        subject:
          type: string
          description: The subject of the thread's first message.
        from:
          description: Who sent the thread's first message.
          $ref: "#/components/schemas/EmailAddress"
        fromAgent:
          type: boolean
          description: True when Duva knows an agent sent the thread's first message, as its message's fromAgent says. Absent otherwise.
        logo:
          description: The logo of whoever sent the thread's first message, as its message's logo says.
          $ref: "#/components/schemas/SenderLogo"
        snippet:
          type: string
          description: The start of the newest message's text, on one line, without quoted lines.
          examples: ["Here are my notes on the compiler."]
        labels:
          type: array
          items:
            type: string
          description: >
            The IDs of the thread's labels. A thread waiting in the Screener
            has screener among them, which only a decision on its sender
            removes, or adding inbox.
          examples: [["inbox"]]
        unread:
          type: boolean
          description: Whether any message in the thread is unread.
        latestAt:
          type: string
          format: date-time
          description: When the thread's newest message arrived.
        messages:
          type: integer
          description: How many messages the thread has.
        groups:
          type: array
          items:
            type: string
          description: >-
            The addresses of the groups the thread's mail came through as members' copies, in the
            order it first came through each. Absent when none did, and for threads whose group mail
            arrived before Duva kept this.
          examples: [["support@example.com"]]
        reminder:
          description: Present while the thread is set aside in Remind me.
          $ref: "#/components/schemas/Reminder"
        back:
          description: Present when the thread came back from Remind me and is still in the Inbox.
          $ref: "#/components/schemas/Back"
    Thread:
      type: object
      additionalProperties: false
      required: [id, subject, labels, unread, messages]
      properties:
        id:
          type: string
          description: The thread's ID.
        subject:
          type: string
          description: The subject of the thread's first message.
        labels:
          type: array
          items:
            type: string
          description: The thread's labels.
          examples: [["inbox"]]
        unread:
          type: boolean
          description: Whether any message in the thread is unread. Reading the thread doesn't change it. Mark the thread read for that.
        reminder:
          description: Present while the thread is set aside in Remind me.
          $ref: "#/components/schemas/Reminder"
        back:
          description: Present when the thread came back from Remind me and is still in the Inbox.
          $ref: "#/components/schemas/Back"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        tasks:
          type: array
          description: The tasks labels' prompts gave the mailbox agent for the thread's messages, oldest first. Present when there are any.
          items:
            $ref: "#/components/schemas/Task"
    Message:
      type: object
      additionalProperties: false
      required: [id, from, to, cc, recipient, subject, date, receivedAt, text, attachments]
      properties:
        id:
          type: string
          description: The message's ID in Duva.
        messageId:
          type: string
          description: The Message-ID header the sender gave it, if any.
          examples: ["<CAF1234@mail.example.org>"]
        from:
          $ref: "#/components/schemas/EmailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          description: The Bcc recipients of a message sent from the mailbox, if it had any. No header names them.
        recipient:
          type: string
          description: The mailbox's address the message was delivered to, or sent from, with its plus tag.
          examples: ["hermes+news@example.com"]
        plusTag:
          type: string
          description: The plus tag of the address the message was delivered to, if it had one.
          examples: ["news"]
        group:
          type: string
          description: >-
            The address of the group the message came through, if it came to the mailbox as a
            member's copy, which skipped the Screener. Recipient is then the group's address.
          examples: ["support@example.com"]
        subject:
          type: string
        date:
          type: string
          format: date-time
          description: When the sender says it was sent, or when it arrived if the sender doesn't say.
        receivedAt:
          type: string
          format: date-time
          description: When the message arrived, or when SES accepted it for sending.
        sentBy:
          type: string
          description: The ID of the actor who sent the message from the mailbox, if it did.
        sentAs:
          $ref: "#/components/schemas/SentAsGroup"
        fromAgent:
          type: boolean
          description: >-
            True when Duva knows an agent sent the message: an agent sent it from this Duva, or it
            came with the Duva-Agent header from one of the organization's domains with a DMARC
            pass, as a message an agent sent from another of its sponsor's mailboxes does. Absent otherwise,
            and on mail Duva received before it kept this.
        logo:
          description: >-
            The sender's logo, which their domain publishes through BIMI, on received mail that
            passed DMARC from a domain that enforces it. Absent otherwise, on mail from an agent,
            and on mail Duva received before it kept this.
          $ref: "#/components/schemas/SenderLogo"
        approval:
          $ref: "#/components/schemas/SentApproval"
          description: Who approved the message before it was sent, if an agent sent it.
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/SendFeedback"
          description: What SES reported about a message sent from the mailbox, oldest first, if it reported anything.
        text:
          type: string
          description: The plain-text body. Mail with only HTML is turned into text.
        html:
          type: string
          description: >-
            The HTML body, if the message has one, made safe to show: no scripts, event handlers, forms, frames,
            objects or `javascript:` links, and known trackers removed. Its references to the message's own
            parts (`cid:`) lead to download links, which work for a few minutes.
        removedTrackers:
          type: array
          items:
            type: string
          description: >-
            The trackers removed from the HTML body, if it has one, each by the name of its service where it is
            known, or else as "a hidden image". Empty when none was found.
          examples: [["SendGrid", "a hidden image"]]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        linkedFiles:
          type: array
          items:
            $ref: "#/components/schemas/LinkedFile"
          description: >-
            The files a message sent from the mailbox carried as links, each
            with how often it was downloaded, if it carried any. The message's
            text leaves out the list of them that recipients see, and it has
            no HTML.
    SenderLogo:
      type: object
      additionalProperties: false
      required: [url, verified]
      description: >-
        A sender's logo, which their domain publishes through BIMI. Duva fetched it when the mail
        arrived, checked that it is SVG Tiny PS and wrote it out again without anything that
        could run or fetch, so showing it never reaches the sender (ADR-0023).
      properties:
        url:
          type: string
          format: uri
          description: Where Duva serves the logo, an SVG, to anyone with the URL.
          examples: ["https://d111111abcdef8.cloudfront.net/download/logos/6f1c2a9e-0d3b-4c5e-9a8f-1b2c3d4e5f60"]
        verified:
          type: boolean
          description: >-
            Whether a mark certificate (a VMC or CMC) from a Mark Verifying Authority vouches for
            the logo and the domain, so the logo is the brand's own.
    SentAsGroup:
      type: object
      additionalProperties: false
      required: [group, by, name]
      description: >-
        On a copy of a message another local member sent as a group, who sent
        it and as which group. Each other local member's mailbox gets one, in
        the thread of the message it answers, so nobody answers twice.
      properties:
        group:
          type: string
          description: The group's address, which the message went out from.
          examples: ["support@example.com"]
        by:
          type: string
          description: The ID of the actor who sent it.
        name:
          type: string
          description: Who sent it, as the address a human signs in with, or an agent's name.
          examples: ["grace@example.com"]
    SentApproval:
      type: object
      additionalProperties: false
      required: [id, approver, approvedAt]
      description: The approval a sent message went out with.
      properties:
        id:
          type: string
          description: The approval's ID.
        approver:
          type: string
          description: The ID of the human who approved it.
        approvedAt:
          type: string
          format: date-time
        edits:
          $ref: "#/components/schemas/Edits"
    EmailAddress:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        name:
          type: string
          description: The display name, if the message gives one.
          examples: ["Grace Hopper"]
        address:
          type: string
          examples: ["grace@example.org"]
    Attachment:
      type: object
      additionalProperties: false
      required: [type, size]
      properties:
        name:
          type: string
          description: The attachment's file name, if the message gives one.
          examples: ["report.pdf"]
        type:
          type: string
          description: The attachment's media type.
          examples: ["application/pdf"]
        size:
          type: integer
          description: The attachment's size in bytes, decoded.
    MessageHeaders:
      type: object
      additionalProperties: false
      required: [headers]
      properties:
        headers:
          type: array
          description: The message's header fields from the top, so the ones added on its way, as each Received, come before those its sender wrote.
          items:
            $ref: "#/components/schemas/HeaderField"
    HeaderField:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          description: The field's name, as written.
          examples: ["Subject"]
        value:
          type: string
          description: The field's value as it came, unfolded onto one line.
          examples: ["=?UTF-8?Q?R=C3=A4kning?="]
        decoded:
          type: string
          description: The value with its encoded words decoded (RFC 2047), if it has any.
          examples: ["Räkning"]
    AttachmentLink:
      type: object
      additionalProperties: false
      required: [type, size, url, expiresAt]
      properties:
        name:
          type: string
          description: The attachment's file name, if the message gives one.
          examples: ["report.pdf"]
        type:
          type: string
          description: The attachment's media type.
          examples: ["application/pdf"]
        size:
          type: integer
          description: The attachment's size in bytes, decoded.
        url:
          type: string
          description: The link that downloads the attachment, for whoever follows it until it expires.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working.
    ChangePage:
      type: object
      additionalProperties: false
      required: [changes, position]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationChange"
        position:
          type: integer
          description: The position of the last change listed, or the one asked for if none were. Pass it as after to continue.
    OrganizationChange:
      description: A change to the organization's setup.
      oneOf:
        - $ref: "#/components/schemas/OrganizationAdded"
        - $ref: "#/components/schemas/DomainAdded"
        - $ref: "#/components/schemas/DomainRemoved"
        - $ref: "#/components/schemas/SignInDomainChanged"
        - $ref: "#/components/schemas/CatchAllChanged"
        - $ref: "#/components/schemas/ActorAdded"
        - $ref: "#/components/schemas/AgentKeyRotated"
        - $ref: "#/components/schemas/AgentPaused"
        - $ref: "#/components/schemas/AgentUnpaused"
        - $ref: "#/components/schemas/MailboxAdded"
        - $ref: "#/components/schemas/AddressAdded"
        - $ref: "#/components/schemas/AddressRemoved"
        - $ref: "#/components/schemas/DefaultAddressChanged"
        - $ref: "#/components/schemas/GroupAdded"
        - $ref: "#/components/schemas/GroupChanged"
        - $ref: "#/components/schemas/GroupRemoved"
        - $ref: "#/components/schemas/SettingsChanged"
        - $ref: "#/components/schemas/ActorRemoved"
        - $ref: "#/components/schemas/AdminChanged"
        - $ref: "#/components/schemas/MailboxHandedOver"
        - $ref: "#/components/schemas/MailboxDeleted"
        - $ref: "#/components/schemas/MailboxAgentsMerged"
        - $ref: "#/components/schemas/RetiredChange"
      discriminator:
        propertyName: type
        mapping:
          organizationAdded: "#/components/schemas/OrganizationAdded"
          domainAdded: "#/components/schemas/DomainAdded"
          domainRemoved: "#/components/schemas/DomainRemoved"
          signInDomainChanged: "#/components/schemas/SignInDomainChanged"
          catchAllChanged: "#/components/schemas/CatchAllChanged"
          actorAdded: "#/components/schemas/ActorAdded"
          agentKeyRotated: "#/components/schemas/AgentKeyRotated"
          agentPaused: "#/components/schemas/AgentPaused"
          agentUnpaused: "#/components/schemas/AgentUnpaused"
          mailboxAdded: "#/components/schemas/MailboxAdded"
          addressAdded: "#/components/schemas/AddressAdded"
          addressRemoved: "#/components/schemas/AddressRemoved"
          defaultAddressChanged: "#/components/schemas/DefaultAddressChanged"
          groupAdded: "#/components/schemas/GroupAdded"
          groupChanged: "#/components/schemas/GroupChanged"
          groupRemoved: "#/components/schemas/GroupRemoved"
          settingsChanged: "#/components/schemas/SettingsChanged"
          actorRemoved: "#/components/schemas/ActorRemoved"
          adminChanged: "#/components/schemas/AdminChanged"
          mailboxHandedOver: "#/components/schemas/MailboxHandedOver"
          mailboxDeleted: "#/components/schemas/MailboxDeleted"
          mailboxAgentsMerged: "#/components/schemas/MailboxAgentsMerged"
          agentAdminChanged: "#/components/schemas/RetiredChange"
          setupAsked: "#/components/schemas/RetiredChange"
          setupApproved: "#/components/schemas/RetiredChange"
          setupRejected: "#/components/schemas/RetiredChange"
          setupWithdrawn: "#/components/schemas/RetiredChange"
    ChangeBase:
      type: object
      required: [position, at, actor]
      properties:
        position:
          type: integer
          description: The change's position in the feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When the change was made.
        actor:
          type: string
          description: The ID of the actor who made the change, or duva for one Duva made by itself, as when it pauses an agent.
    OrganizationAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              const: organizationAdded
    DomainAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, domain]
          properties:
            type:
              type: string
              const: domainAdded
            domain:
              type: string
              description: The domain.
              examples: ["example.com"]
            aliasOf:
              type: string
              description: The standalone domain it mirrors, if it is an alias domain.
    DomainRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, domain]
          properties:
            type:
              type: string
              const: domainRemoved
            domain:
              type: string
              description: The domain.
              examples: ["example.net"]
    SignInDomainChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, domain]
          properties:
            type:
              type: string
              const: signInDomainChanged
            domain:
              type: string
              description: The domain sign-in codes come from from now on.
              examples: ["example.net"]
    CatchAllChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, domain]
          properties:
            type:
              type: string
              const: catchAllChanged
            domain:
              type: string
              description: The standalone domain.
              examples: ["example.com"]
            catchAll:
              $ref: "#/components/schemas/CatchAll"
              description: The domain's catch-all from now on, left out when it was cleared.
    ActorAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, added]
          properties:
            type:
              type: string
              const: actorAdded
            added:
              $ref: "#/components/schemas/Actor"
    AgentPaused:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent]
          description: An agent was paused.
          properties:
            type:
              type: string
              const: agentPaused
            agent:
              type: string
              description: The ID of the agent paused.
    AgentUnpaused:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent]
          description: An agent was unpaused.
          properties:
            type:
              type: string
              const: agentUnpaused
            agent:
              type: string
              description: The ID of the agent unpaused.
    AgentKeyRotated:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent]
          properties:
            type:
              type: string
              const: agentKeyRotated
            agent:
              type: string
              description: The ID of the agent whose key was rotated.
    MailboxAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, mailbox]
          properties:
            type:
              type: string
              const: mailboxAdded
            mailbox:
              $ref: "#/components/schemas/Mailbox"
    AddressAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, address, mailbox]
          properties:
            type:
              type: string
              const: addressAdded
            address:
              type: string
              description: The address.
              examples: ["hermes@example.com"]
            mailbox:
              type: string
              description: The ID of the mailbox it delivers to.
    MailboxAgentsMerged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent, human, merged]
          description: >-
            Duva made the human's mailbox agents one, as the setup after the
            deploy that brought one per human did (ADR-0033): the agent is now
            their mailbox agent in all their personal mailboxes, with the
            conversations of those merged into it, and settings none of them
            had more of. What each did stays attributed to it, and its
            activity is the one agent's. Recorded in the organization's change
            feed and in each of the human's personal mailboxes.
          properties:
            type:
              type: string
              const: mailboxAgentsMerged
            agent:
              type: string
              description: The ID of the human's one mailbox agent.
            human:
              type: string
              description: The ID of the human.
            merged:
              type: array
              items:
                type: string
              description: The IDs of the mailbox agents merged into it, none if the human had only it.
    ActorRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, removed]
          properties:
            type:
              type: string
              const: actorRemoved
            removed:
              $ref: "#/components/schemas/Actor"
    AdminChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, human, admin]
          properties:
            type:
              type: string
              const: adminChanged
            human:
              type: string
              description: The ID of the human made an admin, or no longer one.
            admin:
              type: boolean
              description: Whether the human is an admin now.
    MailboxHandedOver:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, mailbox, from, to]
          properties:
            type:
              type: string
              const: mailboxHandedOver
            mailbox:
              type: string
              description: The ID of the mailbox, with its addresses and mail.
            from:
              type: string
              description: The ID of the actor that owned it.
            to:
              type: string
              description: The ID of the human who owns it now.
    MailboxDeleted:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, mailbox]
          description: A mailbox was deleted, and its mail is being erased.
          properties:
            type:
              type: string
              const: mailboxDeleted
            mailbox:
              type: string
              description: The ID of the mailbox.
    RetiredChange:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type]
          additionalProperties: true
          description: >-
            A change of a kind Duva no longer records, kept as it was
            recorded: an agent made an admin or no longer one, or an agent
            admin's setup change asked for, approved, rejected or withdrawn,
            from before agents stopped being admins (ADR-0030).
          properties:
            type:
              type: string
              enum: [agentAdminChanged, setupAsked, setupApproved, setupRejected, setupWithdrawn]
            agent:
              type: string
              description: The ID of the agent.
    AddressRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, address]
          properties:
            type:
              type: string
              const: addressRemoved
            address:
              type: string
              description: The address.
              examples: ["support@example.com"]
            mailbox:
              type: string
              description: The ID of the mailbox it delivered to.
    DefaultAddressChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, mailbox]
          properties:
            type:
              type: string
              const: defaultAddressChanged
            mailbox:
              type: string
              description: The ID of the mailbox.
            defaultAddress:
              type: string
              description: Its new default address, absent if it has no address left.
              examples: ["support@example.com"]
    GroupAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, group]
          properties:
            type:
              type: string
              const: groupAdded
            group:
              $ref: "#/components/schemas/Group"
    GroupChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, group]
          properties:
            type:
              type: string
              const: groupChanged
            group:
              $ref: "#/components/schemas/Group"
              description: The group as it is after the change.
    GroupRemoved:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, address]
          properties:
            type:
              type: string
              const: groupRemoved
            address:
              type: string
              description: The group's address.
              examples: ["support@example.com"]
    SettingsChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, settings]
          properties:
            type:
              type: string
              const: settingsChanged
            settings:
              $ref: "#/components/schemas/SettingsChanges"
    OrganizationSettings:
      type: object
      additionalProperties: false
      required: [erasureErasesApprovals, retentionDays, searchLanguages, agentSendsPerHourCap, agentNewRecipientsPerDayCap, undoWindowSeconds, mailboxAgentModel, mailboxAgentTaskModel, mailboxAgentHarderModel, mailboxAgentDecider, mailboxAgentProfile, mailboxAgentRegion, mailboxAgentSpendCap, linkedFilesCapGb]
      properties:
        erasureErasesApprovals:
          $ref: "#/components/schemas/ErasureErasesApprovals"
        retentionDays:
          $ref: "#/components/schemas/RetentionDays"
        searchLanguages:
          $ref: "#/components/schemas/SearchLanguages"
        agentSendsPerHourCap:
          $ref: "#/components/schemas/AgentSendsPerHourCap"
        agentNewRecipientsPerDayCap:
          $ref: "#/components/schemas/AgentNewRecipientsPerDayCap"
        undoWindowSeconds:
          $ref: "#/components/schemas/UndoWindowSeconds"
        mailboxAgentModel:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: >-
            The model a mailbox agent answers its owner with in Ask Coo
            and over MCP, unless the decider finds a turn complex. Claude
            Haiku 4.5 by default.
        mailboxAgentTaskModel:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: The model that does the tasks labels' prompts give. Claude Haiku 4.5 by default.
        mailboxAgentHarderModel:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: >-
            The model for the harder work: writing mail that may be sent, a
            turn the decider finds complex, a run the everyday model hands
            over, and Think harder. Claude Sonnet 5.5 by default.
        mailboxAgentDecider:
          $ref: "#/components/schemas/MailboxAgentDecider"
        mailboxAgentProfile:
          $ref: "#/components/schemas/MailboxAgentProfile"
        mailboxAgentRegion:
          $ref: "#/components/schemas/MailboxAgentRegion"
        mailboxAgentSpendCap:
          $ref: "#/components/schemas/MailboxAgentSpendCap"
        linkedFilesCapGb:
          $ref: "#/components/schemas/LinkedFilesCapGb"
    SettingsChanges:
      type: object
      additionalProperties: false
      description: The settings changed, each with its new value.
      properties:
        erasureErasesApprovals:
          $ref: "#/components/schemas/ErasureErasesApprovals"
        retentionDays:
          $ref: "#/components/schemas/RetentionDays"
        searchLanguages:
          $ref: "#/components/schemas/SearchLanguages"
        agentSendsPerHourCap:
          $ref: "#/components/schemas/AgentSendsPerHourCap"
        agentNewRecipientsPerDayCap:
          $ref: "#/components/schemas/AgentNewRecipientsPerDayCap"
        undoWindowSeconds:
          $ref: "#/components/schemas/UndoWindowSeconds"
        mailboxAgentModel:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: >-
            The model a mailbox agent answers its owner with in Ask Coo
            and over MCP, unless the decider finds a turn complex. Claude
            Haiku 4.5 by default.
        mailboxAgentTaskModel:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: The model that does the tasks labels' prompts give. Claude Haiku 4.5 by default.
        mailboxAgentHarderModel:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: >-
            The model for the harder work: writing mail that may be sent, a
            turn the decider finds complex, a run the everyday model hands
            over, and Think harder. Claude Sonnet 5.5 by default.
        mailboxAgentDecider:
          $ref: "#/components/schemas/MailboxAgentDecider"
        mailboxAgentProfile:
          $ref: "#/components/schemas/MailboxAgentProfile"
        mailboxAgentRegion:
          $ref: "#/components/schemas/MailboxAgentRegion"
        mailboxAgentSpendCap:
          $ref: "#/components/schemas/MailboxAgentSpendCap"
        linkedFilesCapGb:
          $ref: "#/components/schemas/LinkedFilesCapGb"
    RetentionDays:
      type: integer
      minimum: 7
      maximum: 365
      description: >-
        How many days Trash and Spam keep a thread, counted from when it got
        the label, before the eraser erases it for good. 30 by default, and a
        whole number from 7 to 365. It applies to all Trash and Spam, threads
        already there included.
    AgentSendsPerHourCap:
      type: integer
      minimum: 1
      maximum: 10000
      description: >-
        The most sendsPerHour a sponsor can give an agent. 100 by default.
        Lowering it lowers each agent above it to it, recorded as a change to
        the agent's settings under you. Raising it raises no agent.
    AgentNewRecipientsPerDayCap:
      type: integer
      minimum: 1
      maximum: 10000
      description: >-
        The most newRecipientsPerDay a sponsor can give an agent. 50 by
        default. Lowering it lowers each agent above it to it, recorded as a
        change to the agent's settings under you. Raising it raises no agent.
    UndoWindowSeconds:
      type: integer
      minimum: 0
      maximum: 120
      description: >-
        How many seconds an approved send waits before the sender takes it,
        so its approver can undo the approval meanwhile. 30 by default, and a
        whole number from 0 to 120, where 0 sends at once. A change applies
        to approvals from then on. A human's own sends never wait.
    MailboxAgentConversation:
      type: object
      additionalProperties: false
      required: [agent, turns]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        turns:
          type: array
          items:
            $ref: "#/components/schemas/ConversationTurn"
    ConversationTurn:
      type: object
      additionalProperties: false
      required: [id, at, from, text, actions]
      description: What you asked your mailbox agent, or what it answered and did.
      properties:
        id:
          type: string
          description: The turn's ID.
        at:
          type: string
          format: date-time
          description: When the turn began.
        from:
          type: string
          enum: [human, agent]
          description: Who took the turn, you or the agent.
        mailbox:
          type: string
          description: >-
            The ID of the mailbox the turn was asked from, which the agent
            worked on unless you said otherwise. Absent for a turn asked from
            All mailboxes.
        text:
          type: string
          description: What was said.
        actions:
          type: array
          description: What the agent did in the turn, in order. None for yours.
          items:
            $ref: "#/components/schemas/AgentAction"
        outcome:
          type: string
          enum: [answered, capReached, failed]
          description: >-
            How the agent's turn ended: answered; capReached, it stopped as the
            mailbox agents reached the organization's spend cap; failed, the
            model or the runtime failed, so asking again may work.
        model:
          $ref: "#/components/schemas/MailboxAgentModel"
          description: The model that ended the agent's turn.
        decision:
          $ref: "#/components/schemas/RoutingDecision"
        handover:
          $ref: "#/components/schemas/Handover"
        harder:
          type: boolean
          description: Whether the agent's turn is the harder model's answer to the turn before, as you asked it to think harder.
    RoutingDecision:
      type: object
      additionalProperties: false
      required: [route, confidence]
      description: >-
        What the decider, Amazon Nova Micro, made of a turn whose job doesn't
        settle the model: simple, the everyday model takes it, or complex,
        the harder model does, as it does when the decider is less than 0.7
        sure.
      properties:
        route:
          type: string
          enum: [simple, complex]
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: How sure the decider was, from 0 to 1.
    Handover:
      type: object
      additionalProperties: false
      required: [reason, from, to]
      description: >-
        Why a run went over to the harder model, with the work so far:
        decided, the decider found the turn complex or wasn't sure; writing,
        it came to writing mail that may be sent; failedCalls, Duva refused
        the everyday model's tool calls twice; stepBudget, the everyday model
        hadn't finished after 6 steps; askedForHelp, it asked for help, saying
        why; answerCheck, its answer didn't hold up, as when it named a thread
        or message nothing gave it, or said an agent is paused that Duva has
        running.
      properties:
        reason:
          type: string
          enum: [decided, writing, failedCalls, stepBudget, askedForHelp, answerCheck]
        from:
          $ref: "#/components/schemas/MailboxAgentModel"
        to:
          $ref: "#/components/schemas/MailboxAgentModel"
        why:
          type: string
          description: What the everyday model said when it asked for help.
    AgentAction:
      type: object
      additionalProperties: false
      required: [operation, what, ok]
      description: One call the mailbox agent made to Duva's API, as its tool.
      properties:
        operation:
          type: string
          description: The operation's ID in this document, such as getThread.
        mailbox:
          type: string
          description: The ID of the mailbox it called the operation in.
        what:
          type: string
          description: What the operation does, its summary.
        ok:
          type: boolean
          description: Whether Duva did it. A refusal says why in message.
        message:
          type: string
          description: Duva's refusal, when it refused.
        threads:
          type: array
          items:
            type: string
          description: The IDs of the threads it read or changed, if any.
        draft:
          type: string
          description: The ID of the draft it wrote, changed or asked to send, if any.
    MailboxAgentSpend:
      type: object
      additionalProperties: false
      required: [month, spent, cap]
      properties:
        month:
          type: string
          description: The month counted, as YYYY-MM in UTC.
          examples: ["2026-10"]
        spent:
          type: number
          minimum: 0
          description: What the mailbox agents' model calls cost this month, in US dollars.
        cap:
          $ref: "#/components/schemas/MailboxAgentSpendCap"
    MailboxAgentRouting:
      type: object
      additionalProperties: false
      required: [month, turns, everyday, harder, decided, handedOver, thoughtHarder, embedded]
      properties:
        month:
          type: string
          description: The month counted, as YYYY-MM in UTC.
          examples: ["2026-10"]
        turns:
          type: integer
          description: >-
            The agents' turns this month, think harder's reruns left out. Each
            is counted once: a turn its owner had the harder model think
            harder about counts as that, however it went first.
        everyday:
          type: integer
          description: Turns the everyday model took alone.
        harder:
          type: integer
          description: Turns the harder model took from the start, as the model admins chose for answering.
        decided:
          type: integer
          description: Turns the decider sent to the harder model.
        handedOver:
          type: object
          additionalProperties: false
          required: [writing, failedCalls, stepBudget, askedForHelp, answerCheck]
          description: Turns the everyday model handed over, by why.
          properties:
            writing:
              type: integer
            failedCalls:
              type: integer
            stepBudget:
              type: integer
            askedForHelp:
              type: integer
            answerCheck:
              type: integer
        thoughtHarder:
          type: integer
          description: Turns whose owner had the harder model think harder.
        embedded:
          type: integer
          description: Turns kept with their words' embedding.
    MailboxAgentModel:
      type: string
      enum: [anthropic.claude-sonnet-5-5, anthropic.claude-haiku-4-5-20251001-v1:0, anthropic.claude-opus-5-5, amazon.nova-2-lite-v1:0, amazon.nova-pro-v1:0, amazon.nova-lite-v1:0]
      description: >-
        A model on Amazon Bedrock the mailbox agents think with: Claude
        Sonnet 5.5, Claude Haiku 4.5, which costs about a half as much,
        Claude Opus 5.5, which costs about twice as much, or one of Amazon's
        Nova models, which cost from a sixth (Nova 2 Lite) to a fiftieth
        (Nova Lite) as much a task as Claude Sonnet 5.5 and need no AWS
        Marketplace agreement (docs/research/coo-models.md). Nova Pro and Nova Lite run through the eu or us profiles,
        or without one, and Nova 2 Lite through any. Each of the three
        models chosen must run through mailboxAgentProfile from
        mailboxAgentRegion.
    MailboxAgentProfile:
      type: string
      enum: [eu, us, global, none]
      description: >-
        The inference profile Bedrock runs the model through, which decides
        where the mail the agents read is processed: eu keeps it in the EU's
        AWS regions, us in the US's, and global sends it to any region with
        capacity, for about 10% less. none runs the model in
        mailboxAgentRegion itself, which keeps the mail there: Nova Lite runs
        so in eu-north-1, us-east-1, us-east-2 and us-west-2, and Nova Pro in
        us-east-1. eu by default for a deployment in the EU, us for one in the
        US, and global elsewhere. eu needs an EU mailboxAgentRegion, us a US
        one.
    MailboxAgentRegion:
      type: string
      enum: [eu-central-1, eu-west-1, eu-west-3, eu-north-1, us-east-1, us-east-2, us-west-2]
      description: >-
        The AWS region the mailbox agents call Bedrock in, which the
        profile sends on from. eu-central-1 by default for a deployment in the
        EU, us-west-2 for one in the US.
    LinkedFilesCapGb:
      type: integer
      minimum: 0
      maximum: 10000
      description: >-
        How much each human may have linked at once, in
        whole gigabytes (GiB), 20 by default. Their agents' linked files count
        toward it. Past it, a send that would link more is refused, until
        they stop sharing older files or an admin raises it. 0 lets no one
        link files, so mail too large to carry its files can't be sent.
    MailboxAgentSpendCap:
      type: integer
      minimum: 0
      maximum: 10000
      description: >-
        The most the mailbox agents may spend on their model a month, in
        whole US dollars, 20 by default. At the cap a run stops, its agent's
        sponsor gets an alert, and runs are refused until the month ends or
        an admin raises it. 0 turns the mailbox agents off.
    RetentionPreview:
      type: object
      additionalProperties: false
      required: [retentionDays, threads]
      properties:
        retentionDays:
          $ref: "#/components/schemas/RetentionDays"
        threads:
          type: integer
          minimum: 0
          description: How many threads in Trash and Spam are older than retentionDays now.
    MailboxAgentDecider:
      type: boolean
      description: >-
        Whether the decider, Amazon Nova Micro, settles the model for each
        turn in Ask Coo and over MCP first, sending one it finds
        complex to mailboxAgentHarderModel. Off by default: on Coo's tasks it
        was right on 4 of 10 (docs/research/coo-models.md). Either way a turn
        hands over to the harder model on evidence.
    ErasureErasesApprovals:
      type: boolean
      description: >-
        Whether erasing a thread also erases the approval records of the
        agents' sends in it: the draft its approver saw and any edit they
        made. Off by default, so the records stay as the account of what an
        agent sent and who approved it. Either way the mailbox's change feed
        keeps each decision and who made it.
    SearchLanguages:
      type: array
      uniqueItems: true
      items:
        $ref: "#/components/schemas/SearchLanguage"
      description: >-
        The languages the organization's mail is in, English and Swedish by
        default. Each search is also translated into every other one on the
        list, so "kvitto" finds an English receipt: its words go to Amazon's
        Nova Lite model, in the same AWS region as the mail, which adds a
        little time to each search. With fewer than two, searches aren't
        translated. Quoted phrases and subject: never are. English and Swedish
        mail is always indexed in its own language. Adding another, or
        removing it, rebuilds every mailbox's search index, embedding its
        mail again, and search finds less until that is done.
      examples: [["English", "Swedish"]]
    SearchLanguage:
      type: string
      enum: [English, Swedish, Danish]
      description: A language search knows.
    AgentEventKind:
      type: string
      enum: [conversations, tasks, draftsAndSends, approvals, organizing, screening, unsubscribes, pausesAndLimits, alerts, setup]
      description: >
        What an event is about. conversations, turns of Ask Coo; tasks, the
        tasks labels' prompts give a mailbox agent, from the prompt to its
        end; draftsAndSends, drafts, sends and what SES reported about them;
        approvals, asking for approval and the sponsor's decisions;
        organizing, marking threads read or unread, labels, Remind me and
        erasing; screening, the Screener and where senders' mail goes;
        unsubscribes, each try to unsubscribe from a sender's mail; pausesAndLimits,
        pauses, settings and send limits, and sends waiting for them; alerts,
        the alerts about the agent its sponsor got; setup, the agent's
        creation and removal, its key and the organization's setup it made.
    AgentEvent:
      type: object
      additionalProperties: false
      required: [id, at, kind, type, summary, failed, needsYou]
      description: One event in an agent's activity.
      properties:
        id:
          type: string
          description: The event's ID, which agents event reads.
          examples: ["mbx_2Tq1:42"]
        at:
          type: string
          format: date-time
          description: When it happened.
        kind:
          $ref: "#/components/schemas/AgentEventKind"
        type:
          type: string
          description: The type of the change it is, as the change feed records it, or alert for an alert.
          examples: ["conversationTurn"]
        actor:
          type: string
          description: The ID of the actor who made it, or duva if Duva did. Absent when no one did, as for mail that arrived.
        mailbox:
          type: string
          description: >-
            The ID of the mailbox it happened in. Absent for a change to the
            organization or to the agent itself, an alert about no mailbox, and
            a turn asked from All mailboxes.
        summary:
          type: string
          description: What happened, in one line, as the web app says it.
          examples: ["You asked Coo “How many unread threads are in my Inbox?”"]
        failed:
          type: boolean
          description: >
            Whether it failed: a send SES refused, one that bounced or that SES
            didn't send after all, one that stopped before SES answered, a turn
            or a task the agent couldn't finish, or an unsubscribe that didn't
            work.
        needsYou:
          type: boolean
          description: >-
            Whether it waits for the reader, the agent's sponsor: a send still
            waiting for their approval, or an alert they haven't seen.
    AgentEventPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          description: The page's events, newest first.
          items:
            $ref: "#/components/schemas/AgentEvent"
        next:
          type: string
          description: Present when more events follow. Pass it as after to list the next page.
    AgentEventDetail:
      type: object
      additionalProperties: false
      required: [id, at, kind, type, summary, failed, needsYou]
      description: One event in an agent's activity, with everything recorded on it.
      properties:
        id:
          type: string
          description: The event's ID.
        at:
          type: string
          format: date-time
          description: When it happened.
        kind:
          $ref: "#/components/schemas/AgentEventKind"
        type:
          type: string
          description: The type of the change it is, or alert for an alert.
        actor:
          type: string
          description: The ID of the actor who made it, or duva if Duva did. Absent when no one did, as for mail that arrived.
        summary:
          type: string
          description: What happened, in one line.
        failed:
          type: boolean
          description: Whether it failed.
        needsYou:
          type: boolean
          description: Whether it waits for the reader, the agent's sponsor.
        mailbox:
          type: string
          description: The ID of the mailbox whose change feed recorded it, unless the organization's did, or the mailbox the alert links to.
        thread:
          type: string
          description: The ID of the thread it is about, if it is about one. A draft's is the thread it replies in or was sent in.
        change:
          description: >
            The change as its feed recorded it, for every event but an alert.
            Its position is in that feed. A task's end has the task's note for
            the sponsor while its thread is kept. For an admin who isn't the
            agent's sponsor, a change in a mailbox leaves out what its mail
            says: edits, note, name, address, domain, the feedback's
            recipients, SES's reason for refusing a send, what the human asked
            Coo, and why a model asked for help.
          anyOf:
            - $ref: "#/components/schemas/MailboxChange"
            - $ref: "#/components/schemas/OrganizationChange"
        alert:
          description: The alert, for an alert, as its sponsor got it. An admin who isn't the agent's sponsor reads only the event.
          $ref: "#/components/schemas/Alert"
    Preferences:
      type: object
      additionalProperties: false
      required: [hourCycle, dateFormat, mailView, keyboardShortcuts, cooSpeaksUp, opensOn]
      description: A human's own preferences.
      properties:
        hourCycle:
          $ref: "#/components/schemas/HourCycle"
        dateFormat:
          $ref: "#/components/schemas/DateFormat"
        mailView:
          $ref: "#/components/schemas/MailView"
        keyboardShortcuts:
          $ref: "#/components/schemas/KeyboardShortcuts"
        cooSpeaksUp:
          $ref: "#/components/schemas/CooSpeaksUp"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        opensOn:
          $ref: "#/components/schemas/OpensOn"
        newMailFrom:
          $ref: "#/components/schemas/NewMailFrom"
    PreferencesChanges:
      type: object
      additionalProperties: false
      description: The preferences changed, each with its new value.
      properties:
        hourCycle:
          $ref: "#/components/schemas/HourCycle"
        dateFormat:
          $ref: "#/components/schemas/DateFormat"
        mailView:
          $ref: "#/components/schemas/MailView"
        keyboardShortcuts:
          $ref: "#/components/schemas/KeyboardShortcuts"
        cooSpeaksUp:
          $ref: "#/components/schemas/CooSpeaksUp"
        timeZone:
          description: >-
            The time zone, as an IANA name, or null to remove it, as if the
            human never chose one. The CLI removes it with --no-timeZone.
          anyOf:
            - $ref: "#/components/schemas/TimeZone"
            - type: "null"
        opensOn:
          $ref: "#/components/schemas/OpensOn"
        newMailFrom:
          description: >-
            The address, or null to start from the default again. The CLI
            gives null with --no-newMailFrom.
          anyOf:
            - $ref: "#/components/schemas/NewMailFrom"
            - type: "null"
    OpensOn:
      type: string
      description: >-
        Where the web app opens: all, the default, on All mailboxes, or the
        ID of one of the human's mailboxes, on that one. A mailbox no longer
        theirs opens All mailboxes.
      examples: ["all"]
    NewMailFrom:
      type: string
      description: >-
        Which of the human's addresses new mail written in All mailboxes
        starts from, one of their mailboxes' addresses. By default, and when
        the address is no longer theirs, the default address of the mailbox
        holding their sign-in address, or else of the first mailbox listing
        their mailboxes gives. Absent while they have no mailbox.
      examples: ["grace@example.com"]
    TimeZone:
      type: string
      description: >-
        The human's time zone, as an IANA name, which the web app shows their
        agents' events in and Remind me's times count in. Left out until the
        human chooses one, when the API uses UTC and the web app the
        browser's time zone.
      examples: ["Europe/Stockholm"]
    HourCycle:
      type: string
      enum: [locale, h12, h23]
      description: >-
        How the web app shows times. Locale, the default, follows the
        browser's language. h12 shows 12-hour time, as 2:30 PM, and h23
        24-hour time, as 14:30.
    DateFormat:
      type: string
      enum: [locale, iso, dayMonth, monthDay]
      description: >-
        How the web app shows dates. Locale, the default, follows the
        browser's language. iso shows 2026-10-05, dayMonth 5 Oct 2026 and
        monthDay Oct 5, 2026, with month names in the browser's language.
        Without the year, they show 10-05, 5 Oct and Oct 5.
    MailView:
      type: string
      enum: [html, text]
      description: >-
        How the web app shows a message that has HTML. html, the default,
        shows it as its sender designed it, with known trackers removed.
        text shows its plain text. Either way, the human can switch each
        message the other way.
    KeyboardShortcuts:
      type: string
      enum: ["on", "off"]
      description: >-
        Whether single keys work as shortcuts in the web app, such as j and k
        to move through a list and e to archive. on, the default, has them
        work anywhere but in a field. off turns them all off, for speech
        input or keys pressed by mistake.
    CooSpeaksUp:
      type: string
      enum: ["on", "off"]
      description: >-
        Whether Coo, the mailbox agent, says in the web app when there is news
        worth a glance: new mail since the human last looked, a draft of its
        waiting for their approval, or a label's task done. on, the default,
        has it say so in a speech bubble under its nest. off keeps it quiet.
    Status:
      type: object
      additionalProperties: false
      required: [version, region]
      properties:
        version:
          type: string
          description: The version of Duva the deployment runs.
          examples: ["0.1.0"]
        region:
          type: string
          description: The AWS region the deployment runs in.
          examples: ["eu-north-1"]
