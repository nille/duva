      x-cli-command: screener remove
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: sender
          in: path
          required: true
          description: The address or the domain, as the mailbox decided on it. Case doesn't matter.
          schema:
            type: string
      responses:
        "200":
          description: The decision removed, with the threads it moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/messages/{message}/attachments/{attachment}:
    get:
      operationId: getAttachment
