  /mailboxes/{mailbox}/senders/{sender}:
    get:
      operationId: getSender
      summary: Read a sender's sheet in a mailbox, with where their mail goes now.
      description: >
        Says how many threads the mailbox has from them, Spam and Trash
        included, their name as their newest thread gives it, where their
        new mail goes now, and the decision that sends it there: the
        mailbox's on their address, or else on their domain. Only those who
        can read the mailbox can read it.
      x-cli-command: senders get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Sender"
      responses:
        "200":
          description: The sender's sheet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderSheet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setSenderDelivery
      summary: Decide where a sender's mail goes in a mailbox, for their mail there and their later mail.
      description: >
        inbox puts their mail in the Inbox. feed and paperTrail file it in the
        Feed or the Paper Trail instead, unread and counted there, and what
        waits from them in the Screener arrives there read. label files it under the
        mailbox's own label you give, unread, instead of the Inbox. nowhere
        drops their later mail on arrival, keeping none of it, and erases
        their threads in the mailbox, Spam and Trash included, for good.
        Removing nowhere later brings none of it back. All their threads,
        archived ones too, move to where it goes now, and keep the labels
        given by hand, except those in Spam, Trash or Remind me, which stay
        there. Their later mail skips
        the Screener, even while it is off. A domain covers exactly that
        domain, not its subdomains, and can't be a public mail provider's,
        like gmail.com. An address's decision beats its domain's. Setting
        nowhere also unsubscribes the mailbox from the sender's mail by
        one-click (RFC 8058), when their newest mail that SES didn't judge to
        be spam offers it and a DKIM signature that passed covers its
        unsubscribe headers, and each message dropped later tries the same.
        If one-click doesn't unsubscribe, its owner's mailbox agent goes on
        by itself, for mail that passed DMARC: on the List-Unsubscribe page in
        an isolated browser, then by mailing the List-Unsubscribe address,
        then by an unsubscribe link in the body on the signer's domain, and
        as a last resort by bouncing their mail as if the address were
        unknown, until a method works. The sender's sheet shows how it went.
        The decision, each thread it moves or erases and the one-click's
        outcome are recorded in the mailbox's change feed under you, and the
        agent's attempts under it. Only the
        mailbox's owner and the agents they give organize sponsor access or more
        can decide, and only the owner or the sponsor can choose nowhere.
      x-cli-command: senders set
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Sender"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderDelivery"
      responses:
        "200":
          description: The decision, with the threads it moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeSenderDelivery
      summary: Remove a mailbox's decision on a sender, so they are first-time again.
      description: >
        Their later mail waits in the Screener again, unless the mailbox has
        written to them, or a decision on their domain covers them. All their
        threads, archived ones too, but those in Spam, Trash or Remind me,
        move to where it goes now, the Inbox unless their domain's decision
        says otherwise. Mail nowhere dropped
        doesn't come back. The removal and each thread it moves are recorded
        in the mailbox's change feed under you. Only the mailbox's owner and the
        agents
        they give organize sponsor access or more can remove decisions.
      x-cli-command: senders remove
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Sender"
      responses:
        "200":
          description: The decision removed, with the threads it moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
