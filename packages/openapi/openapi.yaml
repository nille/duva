        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createLabel
      summary: Create a label in a mailbox.
      description: >
        Creates a label of the mailbox's own, with a name no other label in it
        has, in any case. Then add it to threads by its ID. Only
        the mailbox's owner and the
        agents they give organize sponsor access or more can create its labels. The change is recorded in the
        mailbox's change feed, naming you.
      x-cli-command: labels create
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLabel"
      responses:
        "201":
          description: The label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/labels/{label}:
    patch:
      operationId: renameLabel
      summary: Rename one of a mailbox's own labels.
      description: >
        Gives the label a name no other label in the mailbox has, in any case.
        Its threads keep it. The built-in labels can't be renamed. Only
        the mailbox's owner and the
        agents they give organize sponsor access or more can rename its labels. The change
        is recorded in the mailbox's change feed, naming you.
      x-cli-command: labels rename
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Label"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLabel"
      responses:
        "200":
          description: The label, renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteLabel
      summary: Delete one of a mailbox's own labels.
      description: >
        Removes the label from each of its threads, each with a change in the
        mailbox's change feed, and then deletes it. The threads stay. Senders
        whose mail was filed under it go to the Inbox from then on. The
        built-in labels can't be deleted. If deleting stops partway, delete
        the label again to finish. Only the mailbox's owner and the
        agents they give organize sponsor access or more can delete its labels.
      x-cli-command: labels delete
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The label, as it was before it was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/labels/{label}/prompt:
    put:
      operationId: setLabelPrompt
      summary: Give a label a prompt, which hands each message that gets the label to the mailbox agent as a task.
      description: >
        Sets the label's prompt, or replaces it. From then on, whenever the
        label is added to a message, by hand, by an agent or by a sender's
        delivery, Duva gives its owner's mailbox agent a task: the prompt,
        with that message and its thread, once per message per label. The
        message stays where it goes. A thread given the label by hand or by
        an agent hands over its newest message. The agent works within the
        sponsor access the mailbox's owner gives it. The Feed, the Paper
        Trail and the mailbox's own labels can carry a prompt. Only the
        mailbox's owner can set its labels' prompts, and only once they have
        a mailbox agent. The change is recorded in the mailbox's
        change feed, naming you.
      x-cli-command: labels set-prompt
      parameters:
