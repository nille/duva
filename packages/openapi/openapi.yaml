      responses:
        "200":
          description: The changes after the position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads:
    get:
      operationId: listThreads
      summary: List the threads in a mailbox with a label, newest first.
      description: >
        Lists the threads a page at a time, newest first by their newest
