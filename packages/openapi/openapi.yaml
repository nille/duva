openapi: 3.1.0
info:
  title: Duva
  summary: A self-hosted mailbox platform on Amazon SES where humans and agents are both actors.
  description: >
    The only source of Duva's API contract. The TypeScript client and the CLI's
    API commands are generated from this document. Each operation's
    x-cli-command names the CLI command that calls it.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
security:
  - session: []
  - agentKey: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Show Duva's version and the deployment's region.
      description: Answers without sign-in, so any client can check that it reaches the deployment.
      x-cli-command: status
      security: []
      responses:
        "200":
          description: The deployment's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /whoami:
    get:
      operationId: whoami
      summary: Show the signed-in actor.
      x-cli-command: whoami
      responses:
        "200":
          description: The actor the call is attributed to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organization/changes:
    get:
      operationId: listOrganizationChanges
      summary: List the changes to the organization's setup after a position in its change feed.
      description: >
        Lists up to 100 changes, oldest first. To catch up, call again with
        the position the answer ends at until it lists no more. Only admins
        can read the organization's change feed.
      x-cli-command: organization changes
      parameters:
        - name: after
          in: query
          description: The position to list changes after. 0, the default, lists from the start.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The changes after the position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /agents:
    post:
      operationId: createAgent
      summary: Create an agent, with you as its sponsor, and show its key once.
      description: >
        Only humans can create agents. The answer is the only time Duva shows
        the agent's key: it keeps only a hash. Creating an agent is a change
        to the organization's setup, recorded in its change feed.
      x-cli-command: agents create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAgent"
      responses:
        "201":
          description: The agent and its key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listAgents
      summary: List the agents you sponsor.
      x-cli-command: agents list
      responses:
        "200":
          description: The agents the signed-in actor sponsors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /agents/{agent}/key:
    post:
      operationId: rotateAgentKey
      summary: Give an agent you sponsor a new key, show it once, and refuse the old one from now on.
      description: >
        Only the agent's sponsor can rotate its key. Rotating is a change to
        the organization's setup, recorded in its change feed.
      x-cli-command: agents rotate-key
      parameters:
        - name: agent
          in: path
          required: true
          description: The agent's ID.
          schema:
            type: string
      responses:
        "200":
          description: The agent and its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes:
    post:
      operationId: createMailbox
      summary: Create a personal mailbox for an agent, with an address on the organization's domain.
      description: >
        Only admins can create mailboxes. The address becomes the mailbox's
        default address, and mail to it is accepted from then on. Creating the
        mailbox and its address are changes to the organization's setup,
        recorded in its change feed.
      x-cli-command: mailboxes create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMailbox"
      responses:
        "201":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listMailboxes
      summary: List the mailboxes you can read, your own and those of the agents you sponsor.
      x-cli-command: mailboxes list
      responses:
        "200":
          description: The mailboxes the signed-in actor can read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mailboxes/{mailbox}/changes:
    get:
      operationId: listMailboxChanges
      summary: List the changes in a mailbox after a position in its change feed.
      description: >
        Lists up to 100 changes, oldest first, leaving out the arrivals of
        mail judged to be spam unless asked for them. To catch up, call again with
        the position the answer ends at until it lists no more. Only the
        mailbox's owner and, for an agent's mailbox, its sponsor can read it.
      x-cli-command: mailboxes changes
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: after
          in: query
          description: The position to list changes after. 0, the default, lists from the start.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: spam
          in: query
          description: Lists the arrivals of mail judged to be spam too.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The changes after the position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads:
    get:
      operationId: listThreads
      summary: List the threads in a mailbox with a label, newest first.
      description: Lists the 100 newest threads with the label.
      x-cli-command: threads list
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: label
          in: query
          description: The label the threads carry. inbox, the default, lists the Inbox.
          schema:
            type: string
            default: inbox
      responses:
        "200":
          description: The threads with the label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads/{thread}:
    get:
      operationId: getThread
      summary: Read a thread, with each of its messages, oldest first.
      x-cli-command: threads get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: thread
          in: path
          required: true
          description: The thread's ID.
          schema:
            type: string
      responses:
        "200":
          description: The thread and its messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/drafts:
    post:
      operationId: createDraft
      summary: Draft a reply to a message in a mailbox, or a new message.
      description: >
        A reply goes from the address the original was sent to, plus tag
        kept, to the original's Reply-To or, without one, its From, with the
        subject carrying a single "Re: " prefix. A new message goes from the
        mailbox's default address, and needs to and subject. Only the
        mailbox's owner can draft in it. Writing a draft is recorded in the
        mailbox's change feed.
      x-cli-command: drafts create
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDraft"
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listDrafts
      summary: List the drafts in a mailbox, newest first, with where each send stands.
      description: Only the mailbox's owner and, for an agent's mailbox, its sponsor can list them.
      x-cli-command: drafts list
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The mailbox's drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/drafts/{draft}:
    get:
      operationId: getDraft
      summary: Read a draft, with where its send stands.
      description: Only the mailbox's owner and, for an agent's mailbox, its sponsor can read it.
      x-cli-command: drafts get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: editDraft
      summary: Change a draft's recipients, subject or text.
      description: >
        Changing a draft that waits for approval withdraws the request, so an
        approver never approves text they didn't see. Ask to send it again
        once it is ready. Only the mailbox's owner can edit its drafts. The
        change, and any withdrawal, is recorded in the mailbox's change feed.
      x-cli-command: drafts edit
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftChanges"
      responses:
        "200":
          description: The changed draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/drafts/{draft}/send:
    post:
      operationId: sendDraft
      summary: Ask for a draft to be sent.
      description: >
        An agent's send from its own mailbox needs its sponsor's approval, so
        the draft waits for them. Its send shows where it stands. Only the
        mailbox's owner can ask, and a draft waits for one approval at a
        time. Asking is recorded in the mailbox's change feed.
      x-cli-command: drafts send
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
      responses:
        "202":
          description: The draft, waiting for approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /approvals:
    get:
      operationId: listApprovals
      summary: List the approvals waiting for you, newest first, each with its draft and the message it answers.
      description: An agent's sends from its own mailbox wait for its sponsor, so a sponsor sees those of every agent they sponsor.
      x-cli-command: approvals list
      responses:
        "200":
          description: The approvals waiting for the signed-in actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /approvals/{approval}/reject:
    post:
      operationId: rejectApproval
      summary: Reject a draft waiting for your approval, with a note the agent sees.
      description: >
        The draft goes back to the agent with the note, and the agent can
        revise it and ask again. Only the approver can decide an approval,
        never an agent, and only once: of two decisions at the same time, one
        is refused. The decision is recorded in the mailbox's change feed.
      x-cli-command: approvals reject
      parameters:
        - name: approval
          in: path
          required: true
          description: The approval's ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rejection"
      responses:
        "200":
          description: The approval, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    Mailbox:
      name: mailbox
      in: path
      required: true
      description: The mailbox's ID.
      schema:
        type: string
    Draft:
      name: draft
      in: path
      required: true
      description: The draft's ID.
      schema:
        type: string
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A human's Cognito access token, from signing in.
    agentKey:
      type: http
      scheme: bearer
      description: An agent's key, which starts with duva_agent_.
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The call has no valid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The signed-in actor may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Another call changed the same thing at the same time. Try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nothing has the ID the call names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: What went wrong.
    Actor:
      description: A human or an agent that acts on mail.
      oneOf:
        - $ref: "#/components/schemas/Human"
        - $ref: "#/components/schemas/Agent"
      discriminator:
        propertyName: kind
        mapping:
          human: "#/components/schemas/Human"
          agent: "#/components/schemas/Agent"
    Human:
      type: object
      additionalProperties: false
      required: [id, kind, email, admin]
      description: An actor that is a person.
      properties:
        id:
          type: string
          description: The actor's ID, which never changes.
        kind:
          type: string
          const: human
        email:
          type: string
          description: The address the human signs in with.
          examples: ["ada@example.com"]
        admin:
          type: boolean
          description: Whether the human may change the organization's setup.
    Agent:
      type: object
      additionalProperties: false
      required: [id, kind, name, sponsor, admin]
      description: An actor that is software, which calls Duva with its key.
      properties:
        id:
          type: string
          description: The actor's ID, which never changes.
        kind:
          type: string
          const: agent
        name:
          type: string
          description: The agent's name.
          examples: ["Hermes"]
        sponsor:
          type: string
          description: The ID of the human who answers for the agent.
        admin:
          type: boolean
          description: Whether the agent may change the organization's setup.
    NewAgent:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The agent's name.
          examples: ["Hermes"]
    AgentWithKey:
      type: object
      additionalProperties: false
      required: [agent, key]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        key:
          type: string
          description: The agent's key. Duva shows it only here, so keep it now. The agent sends it as a bearer token, or the CLI reads it from DUVA_AGENT_KEY.
          examples: ["duva_agent_3q2-7wF0nJvZb1yKcY9mXo8aT5rL4sUeHgQdPiWjNkM"]
    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    NewMailbox:
      type: object
      additionalProperties: false
      required: [owner, address]
      properties:
        owner:
          type: string
          description: The ID of the agent that owns the mailbox.
        address:
          type: string
          description: The mailbox's address, on the organization's domain, without a plus tag.
          examples: ["hermes@example.com"]
    Mailbox:
      type: object
      additionalProperties: false
      required: [id, kind, owner, defaultAddress]
      description: A store of received and sent mail, reached through its addresses.
      properties:
        id:
          type: string
          description: The mailbox's ID, which never changes.
        kind:
          type: string
          const: personal
          description: Personal mailboxes are owned by one actor.
        owner:
          type: string
          description: The ID of the actor that owns the mailbox.
        defaultAddress:
          type: string
          description: The address the mailbox sends new messages from.
          examples: ["hermes@example.com"]
    MailboxList:
      type: object
      additionalProperties: false
      required: [mailboxes]
      properties:
        mailboxes:
          type: array
          items:
            $ref: "#/components/schemas/Mailbox"
    MailboxChangePage:
      type: object
      additionalProperties: false
      required: [changes, position]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/MailboxChange"
        position:
          type: integer
          description: The position of the last change read, listed or left out, or the one asked for if there were none. Pass it as after to continue.
    MailboxChange:
      description: A change in a mailbox.
      oneOf:
        - $ref: "#/components/schemas/MessageReceived"
        - $ref: "#/components/schemas/DraftWritten"
        - $ref: "#/components/schemas/DraftChanged"
        - $ref: "#/components/schemas/ApprovalAsked"
        - $ref: "#/components/schemas/ApprovalWithdrawn"
        - $ref: "#/components/schemas/ApprovalDecided"
      discriminator:
        propertyName: type
        mapping:
          messageReceived: "#/components/schemas/MessageReceived"
          draftWritten: "#/components/schemas/DraftWritten"
          draftChanged: "#/components/schemas/DraftChanged"
          approvalAsked: "#/components/schemas/ApprovalAsked"
          approvalWithdrawn: "#/components/schemas/ApprovalWithdrawn"
          approvalDecided: "#/components/schemas/ApprovalDecided"
    MessageReceived:
      type: object
      additionalProperties: false
      required: [position, at, type, thread, message]
      description: Mail arrived. No actor made this change, so it names none.
      properties:
        position:
          type: integer
          description: The change's position in the mailbox's feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When the mail arrived.
        type:
          type: string
          const: messageReceived
        thread:
          type: string
          description: The ID of the thread the message is in.
        message:
          type: string
          description: The message's ID.
        spam:
          type: boolean
          const: true
          description: Present when the mail was judged to be spam, so its thread has the Spam label instead of Inbox.
    DraftWritten:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          properties:
            type:
              type: string
              const: draftWritten
            draft:
              type: string
              description: The draft's ID.
    DraftChanged:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft]
          properties:
            type:
              type: string
              const: draftChanged
            draft:
              type: string
              description: The draft's ID.
    ApprovalAsked:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval]
          properties:
            type:
              type: string
              const: approvalAsked
            draft:
              type: string
              description: The ID of the draft to send.
            approval:
              type: string
              description: The ID of the approval it waits for.
    ApprovalWithdrawn:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval]
          description: The draft changed while it waited, so the request was withdrawn.
          properties:
            type:
              type: string
              const: approvalWithdrawn
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The ID of the approval withdrawn.
    ApprovalDecided:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, draft, approval, decision]
          properties:
            type:
              type: string
              const: approvalDecided
            draft:
              type: string
              description: The draft's ID.
            approval:
              type: string
              description: The approval's ID.
            decision:
              type: string
              enum: [rejected]
            note:
              type: string
              description: The approver's note, with a rejection.
    NewDraft:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        answers:
          type: string
          description: The ID of the message the draft replies to. Without it, the draft is a new message.
        to:
          type: array
          items:
            type: string
          description: The recipients' addresses. A reply goes to the original's Reply-To or From unless you give them.
          examples: [["grace@example.org"]]
        subject:
          type: string
          maxLength: 998
          description: 'The subject. A reply''s is the original''s with "Re: " unless you give one.'
        text:
          type: string
          maxLength: 50000
          description: The plain-text body.
    DraftChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        to:
          type: array
          items:
            type: string
          description: The recipients' addresses, in place of the draft's.
        subject:
          type: string
          maxLength: 998
          description: The subject, in place of the draft's.
        text:
          type: string
          maxLength: 50000
          description: The plain-text body.
    Draft:
      type: object
      additionalProperties: false
      required: [id, from, to, subject, text, updatedAt]
      description: A message a mailbox's owner is writing.
      properties:
        id:
          type: string
          description: The draft's ID.
        answers:
          type: string
          description: The ID of the message the draft replies to, if it is a reply.
        thread:
          type: string
          description: The ID of the thread of the message it replies to, if it is a reply.
        from:
          type: string
          description: The address it goes from.
          examples: ["hermes+news@example.com"]
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        text:
          type: string
          description: The plain-text body.
        updatedAt:
          type: string
          format: date-time
          description: When the draft was written or last changed.
        send:
          $ref: "#/components/schemas/SendStatus"
    SendStatus:
      type: object
      additionalProperties: false
      required: [approval, state]
      description: Where the draft's latest request to send stands. A draft never asked to send has none.
      properties:
        approval:
          type: string
          description: The ID of the approval the request needs.
        state:
          type: string
          enum: [waiting, withdrawn, rejected]
          description: >
            waiting for approval; withdrawn because the draft changed while
            it waited; or rejected, with the approver's note.
        note:
          type: string
          description: The approver's note, if they rejected it.
    DraftList:
      type: object
      additionalProperties: false
      required: [drafts]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/Draft"
    Approval:
      type: object
      additionalProperties: false
      required: [id, state, mailbox, agent, approver, draft, askedAt]
      description: A request to send a draft, waiting for or decided by its approver.
      properties:
        id:
          type: string
          description: The approval's ID.
        state:
          type: string
          enum: [pending, withdrawn, rejected]
        mailbox:
          type: string
          description: The ID of the mailbox the draft is in.
        agent:
          type: string
          description: The ID of the agent that asked.
        approver:
          type: string
          description: The ID of the human who decides, the agent's sponsor.
        draft:
          $ref: "#/components/schemas/ApprovalDraft"
        original:
          $ref: "#/components/schemas/Message"
          description: The message the draft replies to, if it is a reply.
        askedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        note:
          type: string
          description: The approver's note, if they rejected it.
    ApprovalDraft:
      type: object
      additionalProperties: false
      required: [id, from, to, subject, text]
      description: The draft as it was when the agent asked, which is what the approver decides on.
      properties:
        id:
          type: string
          description: The draft's ID.
        answers:
          type: string
          description: The ID of the message the draft replies to, if it is a reply.
        thread:
          type: string
          description: The ID of that message's thread.
        from:
          type: string
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        text:
          type: string
    ApprovalList:
      type: object
      additionalProperties: false
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    Rejection:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the agent should change.
          examples: ["Say we can meet on Tuesday, not Monday."]
    ThreadList:
      type: object
      additionalProperties: false
      required: [threads]
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSummary"
    ThreadSummary:
      type: object
      additionalProperties: false
      required: [id, subject, from, labels, latestAt, messages]
      properties:
        id:
          type: string
          description: The thread's ID.
        subject:
          type: string
          description: The subject of the thread's first message.
        from:
          $ref: "#/components/schemas/EmailAddress"
        labels:
          type: array
          items:
            type: string
          description: The thread's labels.
          examples: [["inbox"]]
        latestAt:
          type: string
          format: date-time
          description: When the thread's newest message arrived.
        messages:
          type: integer
          description: How many messages the thread has.
    Thread:
      type: object
      additionalProperties: false
      required: [id, subject, labels, messages]
      properties:
        id:
          type: string
          description: The thread's ID.
        subject:
          type: string
          description: The subject of the thread's first message.
        labels:
          type: array
          items:
            type: string
          description: The thread's labels.
          examples: [["inbox"]]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Message:
      type: object
      additionalProperties: false
      required: [id, from, to, cc, recipient, subject, date, receivedAt, text, attachments]
      properties:
        id:
          type: string
          description: The message's ID in Duva.
        messageId:
          type: string
          description: The Message-ID header the sender gave it, if any.
          examples: ["<CAF1234@mail.example.org>"]
        from:
          $ref: "#/components/schemas/EmailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        recipient:
          type: string
          description: The mailbox's address the message was delivered to, with its plus tag.
          examples: ["hermes+news@example.com"]
        plusTag:
          type: string
          description: The plus tag of the address the message was delivered to, if it had one.
          examples: ["news"]
        subject:
          type: string
        date:
          type: string
          format: date-time
          description: When the sender says it was sent, or when it arrived if the sender doesn't say.
        receivedAt:
          type: string
          format: date-time
          description: When the message arrived.
        text:
          type: string
          description: The plain-text body. Mail with only HTML is turned into text.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    EmailAddress:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        name:
          type: string
          description: The display name, if the message gives one.
          examples: ["Grace Hopper"]
        address:
          type: string
          examples: ["grace@example.org"]
    Attachment:
      type: object
      additionalProperties: false
      required: [type, size]
      properties:
        name:
          type: string
          description: The attachment's file name, if the message gives one.
          examples: ["report.pdf"]
        type:
          type: string
          description: The attachment's media type.
          examples: ["application/pdf"]
        size:
          type: integer
          description: The attachment's size in bytes, decoded.
    ChangePage:
      type: object
      additionalProperties: false
      required: [changes, position]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationChange"
        position:
          type: integer
          description: The position of the last change listed, or the one asked for if none were. Pass it as after to continue.
    OrganizationChange:
      description: A change to the organization's setup.
      oneOf:
        - $ref: "#/components/schemas/OrganizationAdded"
        - $ref: "#/components/schemas/DomainAdded"
        - $ref: "#/components/schemas/ActorAdded"
        - $ref: "#/components/schemas/AgentKeyRotated"
        - $ref: "#/components/schemas/MailboxAdded"
        - $ref: "#/components/schemas/AddressAdded"
      discriminator:
        propertyName: type
        mapping:
          organizationAdded: "#/components/schemas/OrganizationAdded"
          domainAdded: "#/components/schemas/DomainAdded"
          actorAdded: "#/components/schemas/ActorAdded"
          agentKeyRotated: "#/components/schemas/AgentKeyRotated"
          mailboxAdded: "#/components/schemas/MailboxAdded"
          addressAdded: "#/components/schemas/AddressAdded"
    ChangeBase:
      type: object
      required: [position, at, actor]
      properties:
        position:
          type: integer
          description: The change's position in the feed, counting from 1.
        at:
          type: string
          format: date-time
          description: When the change was made.
        actor:
          type: string
          description: The ID of the actor who made the change.
    OrganizationAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              const: organizationAdded
    DomainAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, domain]
          properties:
            type:
              type: string
              const: domainAdded
            domain:
              type: string
              description: The domain, a standalone domain.
              examples: ["example.com"]
    ActorAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, added]
          properties:
            type:
              type: string
              const: actorAdded
            added:
              $ref: "#/components/schemas/Actor"
    AgentKeyRotated:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, agent]
          properties:
            type:
              type: string
              const: agentKeyRotated
            agent:
              type: string
              description: The ID of the agent whose key was rotated.
    MailboxAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, mailbox]
          properties:
            type:
              type: string
              const: mailboxAdded
            mailbox:
              $ref: "#/components/schemas/Mailbox"
    AddressAdded:
      allOf:
        - $ref: "#/components/schemas/ChangeBase"
        - type: object
          required: [type, address, mailbox]
          properties:
            type:
              type: string
              const: addressAdded
            address:
              type: string
              description: The address.
              examples: ["hermes@example.com"]
            mailbox:
              type: string
              description: The ID of the mailbox it delivers to.
    Status:
      type: object
      additionalProperties: false
      required: [version, region]
      properties:
        version:
          type: string
          description: The version of Duva the deployment runs.
          examples: ["0.1.0"]
        region:
          type: string
          description: The AWS region the deployment runs in.
          examples: ["eu-north-1"]
