  /mailboxes/{mailbox}/threads/remind:
    post:
      operationId: remindThreads
      summary: Set threads in a mailbox aside until a time, when they come back to the Inbox.
      description: >
        Remind me: each thread leaves the Inbox, if it is there, and waits
        in Remind me until the time, given as at or as a preset. Then it
        comes back to the top of the Inbox, unread, with a Back mark naming
        when it was set aside. New mail in the thread brings it back early.
        A thread already set aside gets the new time. A thread in Spam or
        Trash, or waiting in the Screener, can't be set aside. Each thread
        gets a change in the mailbox's change feed, naming you. Only the
        mailbox's owner and the agents they give organize sponsor access or
        more can set its threads aside.
      x-cli-command: threads remind
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadsReminder"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/threads/remind/cancel:
    post:
      operationId: cancelReminders
      summary: Cancel the reminders of threads in a mailbox, which puts them back in the Inbox.
      description: >
        Each thread set aside in Remind me goes back to the Inbox now, at
        its own place and without a Back mark. Threads not set aside are
        left as they are. Each thread whose reminder is cancelled gets a
        change in the mailbox's change feed, naming you. Only those who can
        set the mailbox's threads aside can cancel their reminders.
      x-cli-command: threads cancel-reminder
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadIds"
      responses:
