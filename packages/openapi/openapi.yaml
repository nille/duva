          $ref: "#/components/responses/NotFound"
  /domains:
    post:
      operationId: addDomain
      summary: Add a domain to the organization, standalone or an alias of one of its standalone domains.
      description: >
        Duva creates the domain's SES identity, with DKIM and its MAIL FROM
        domain, mail.<domain>, and answers with the DNS records to add at the
        domain's DNS provider. Duva doesn't change anyone's DNS. SES verifies
        the domain once its records are live, and the domain shows each
        record's status and SES's verification as they come. A standalone
        domain's addresses are its own. An alias domain mirrors every address
        of the standalone domain given as aliasOf, those added later too: mail
        to name@alias reaches the mailbox of name@standalone, and replies to it
        go out from name@alias. Only admins can add domains, and a domain the
        organization has, or one with an SES identity Duva didn't create, is
        refused. Adding a domain is a change to the organization's setup,
        recorded in its change feed under you.
      x-cli-command: domains add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDomain"
      responses:
        "201":
          description: The domain, with the DNS records it needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listDomains
      summary: List the organization's domains, each with its DNS records and SES's verification.
      description: >
        Each record's status is looked up when you ask: missing until DNS
        answers with its value, found once it does, and verified once SES has
        verified what the record is for, unless DNS answers with another
        value. Only admins can list the organization's domains.
      x-cli-command: domains list
      responses:
        "200":
          description: The organization's domains, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /domains/{domain}:
    get:
      operationId: getDomain
      summary: Show one of the organization's domains, with its DNS records and SES's verification.
