          schema:
            type: string
      responses:
        "200":
          description: A page of the threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/search:
    get:
      operationId: searchMailbox
      summary: Search a mailbox's threads by words, meaning and filters.
      description: >
        Finds the threads whose messages have every word in q, or mean what
        its words say, best first. Each comes with the message that matched
        best and a snippet of its text where the words stand. A "quoted
        phrase" or subject: matches by its words alone, and every filter
        holds. Subjects, senders and recipients by name and address, message
        text and attachment names are searched, Sent included. A word also
        finds its other forms in English and Swedish, as invoice finds
        invoices and faktura finds fakturan. Threads in Spam and Trash, and those waiting in the
        Screener, are left out unless q has label:spam or label:trash. New
        mail is found within a minute, and label and read changes count at
        once. Only those who can read the mailbox can search it. To read the
        next page, call again with the answer's next as after.
      x-cli-command: search
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: q
          in: query
          required: true
          description: >
            What to search for: words, "quoted phrases", and the filters
            from: and to: (part of a name or address), subject: (a word or
            quoted phrase in the subject), label: (a label's name, quoted if
            it has spaces), has:attachment, is:unread, after: (received on or
            after the day) and before: (received before the day), with days as
            YYYY-MM-DD in UTC. Every phrase and filter must hold.
          schema:
            type: string
            examples: ['invoice from:ada after:2026-09-01 "hosting plan"']
        - name: sort
          in: query
          description: Best first, or newest first. Without words or phrases, both are newest first.
          schema:
            type: string
            enum: [relevance, newest]
            default: relevance
        - name: limit
          in: query
          description: How many threads a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the threads found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/labels:
    get:
      operationId: listLabels
      summary: List a mailbox's labels, with how many unread threads each has.
      description: >
        Lists the built-in labels inbox, feed, paperTrail, spam and trash first, then the
        mailbox's own labels by name. Only those who can read the mailbox can
        list its labels.
      x-cli-command: labels list
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelList"
