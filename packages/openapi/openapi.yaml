      description: >
        Lists archived threads too, a page at a time, newest first by their
        newest message. To read the next page, call again with the answer's
        next as after, until an answer has no next.
      x-cli-command: threads all-mail
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: limit
          in: query
