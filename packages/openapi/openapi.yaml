        "200":
          description: The agent the human approved, and its key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "202":
          description: The request still waits for a human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /access-requests/{code}:
    get:
      operationId: getAccessRequest
      summary: Read an agent's access request by the code it shows, to approve or decline it.
      description: >
        Only humans read access requests. It lists each of your mailboxes,
        with whether the agent asked for it. A human who gives 10 codes in
        10 minutes that no request waits with gets 429 until the 10 minutes
        are over, so codes can't be guessed.
      x-cli-command: access-requests show
      parameters:
        - $ref: "#/components/parameters/AccessCode"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /access-requests/{code}/approve:
    post:
      operationId: approveAccessRequest
      summary: Approve an agent's access request, which makes you its sponsor and gives it the access you choose.
      description: >
        Only humans approve. Give only what you change from what the agent
        asked: its name, its sponsor access, the mailboxes of yours it covers,
        and the approval and disclosure-line switches for its sends as you,
        both on unless you switch them off. Approving creates the agent, with
        you as its sponsor, recorded in the organization's change feed, and
        its settings, recorded in your mailboxes' change feeds. The agent
        then collects its key once. A request is approved or declined once,
        within 10 minutes.
      x-cli-command: access-requests approve
      parameters:
        - $ref: "#/components/parameters/AccessCode"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessApproval"
      responses:
        "201":
          description: The agent, created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /access-requests/{code}/decline:
    post:
      operationId: declineAccessRequest
      summary: Decline an agent's access request, so it gets no key.
      description: Only humans decline. A request is approved or declined once, within 10 minutes.
