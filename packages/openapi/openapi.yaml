            application/json:
              schema:
                $ref: "#/components/schemas/Screener"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/screener/let-in:
    post:
      operationId: letInSender
      summary: Let a sender into a mailbox, moving their waiting threads to the Inbox.
      description: >
        Give an address, or a domain to let in everyone there. A domain covers
        exactly that domain, not its subdomains, and can't be a public mail
        provider's, like gmail.com. An address's decision beats its domain's.
        Their later mail skips the Screener, even while it is off. Letting in
        a sender the mailbox blocked replaces the block and moves their
        threads still in Trash to the Inbox. The decision and each thread it
        moves are recorded in the mailbox's change feed under you. Only the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access can
        decide.
      x-cli-command: screener let-in
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderToScreen"
      responses:
        "200":
          description: The decision, with the threads it moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/screener/block:
    post:
      operationId: blockSender
      summary: Block a sender in a mailbox, moving their waiting threads to Trash.
      description: >
        Give an address, or a domain to block everyone there. A domain covers
        exactly that domain, not its subdomains, and can't be a public mail
        provider's, like gmail.com. An address's decision beats its domain's.
        Their later mail that starts a thread goes straight to Trash, even
        while the Screener is off. Trash is erased after the organization's
        retention period, counted from when a thread got it. Blocking a
        sender the mailbox let in replaces that. Blocking also
        unsubscribes the mailbox from the sender's mail by one-click (RFC
        8058), when their newest mail that SES didn't judge to be spam offers
        it and a DKIM signature that passed covers its unsubscribe headers.
        For a domain, that is the newest mail from an address there that the
        mailbox hasn't let in. Duva never unsubscribes by mailto or by a link
        in the body. The decision, each thread it moves and the unsubscribe's
        outcome are recorded in the mailbox's change feed under you. Only the
        mailbox's owner, for an agent's mailbox its sponsor, and for a human's
        mailbox the agents they give full sponsor access can decide.
      x-cli-command: screener block
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderToScreen"
      responses:
        "200":
          description: The decision, with the threads it moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
