                $ref: "#/components/schemas/Screener"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: switchScreener
      summary: Switch a mailbox's Screener on or off.
      description: >
        Turning it off moves every waiting thread to the Inbox. Turning it on
        lets in every address mail in the mailbox is from, except mail in
        Spam, so no sender the mailbox already has waits. A human's mailbox
        starts with it on, an agent's with it off. Switching is recorded in
        the mailbox's change feed under you. Only the mailbox's owner, and
        an agent's sponsor for its agent's mailbox, can switch it.
      x-cli-command: screener switch
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
