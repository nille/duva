      summary: Remove a domain with its addresses, and its alias domains if it is a standalone domain.
      description: >
        Run it first with dryRun to see the domains it removes, the addresses
        that stop receiving mail and the mailboxes left without an address.
        Removing a standalone domain removes its addresses, deleting the
        groups among them, and its alias domains with the addresses they
        mirror, since an alias domain mirrors nothing without it. The
        addresses that stop working leave every group they are members of. Removing an alias domain removes only what it
        mirrors. SES refuses mail to those addresses at once, and the domains'
        SES identities are deleted. The mail the mailboxes have stays. A
        mailbox left with no address keeps its mail, but receives and sends no
        new mail until it is given one. The domain sign-in codes come from
        can't be removed, so choose another one first. Only admins can remove
        domains. Each removal, and each address removed, is a change to the
        organization's setup, recorded in its change feed under you.
      x-cli-command: domains remove
      parameters:
        - $ref: "#/components/parameters/Domain"
      requestBody:
