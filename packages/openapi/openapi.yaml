        mailbox's owner, for an agent's mailbox its sponsor, and for a human's
        mailbox the agents they give sponsor access can read it.
      x-cli-command: mailboxes changes
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: after
