                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/drafts/{draft}/send:
    post:
      operationId: sendDraft
      summary: Ask for a draft to be sent.
      description: >
        A human's send from their own mailbox needs no approval, so Duva sends
        it at once, with no disclosure, also when their agent wrote the draft.
        An agent's send waits for its sponsor's approval unless the sponsor
        switched that off. With send sponsor access, an agent sends as its
        sponsor from the sponsor's mailbox: from the draft's address, under
        the sponsor's name. Every message an agent sends carries the
        Duva-Agent header, and a visible line unless its sponsor switched that
        off. Its send shows where it stands. Bcc recipients get the message,
        but no header names them. Only the mailbox's owner, and an agent with
        send sponsor access to it, can ask. The draft needs a recipient in To,
        and a draft waits for one approval at a time. It goes only from an
        address the mailbox still has, so a draft from an address since
        removed fails. A draft from a group goes out from the group's
        address, as any send does, and only while the mailbox's owner is
        still a local member: otherwise asking gets 403, and a send asked
        before fails. Each other local member's mailbox then gets a copy, in
        the thread of the message it answers, marked with who sent it as the
        group. External members get none. A send that needs no
        approval withdraws the request the draft waits for, if it waits. Asking is recorded in the
        mailbox's change feed. An agent's approved send over its send limits
        waits, as waitingForLimit, and goes out by itself, oldest first, as
        the limits allow, or when its sponsor sends it now. Humans have no
        send limits.
      x-cli-command: drafts send
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
      responses:
        "202":
          description: The draft, waiting for approval, or for a human's send, approved and about to be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/drafts/{draft}/send-now:
    post:
      operationId: sendDraftNow
      summary: Send a draft waiting for an agent's send limits now, past the limits.
      description: >
        Only the agent's sponsor can, for one draft at a time, and the
        agent's limits stay as they are. The send still counts toward them.
        A paused agent's send is held until it is unpaused. Sending now is
        recorded in the mailbox's change feed under you, and the draft's send
        shows sending, then sent or failed. A draft that isn't
        waitingForLimit is 409.
      x-cli-command: drafts send-now
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Draft"
      responses:
        "202":
          description: The draft, approved and about to be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
