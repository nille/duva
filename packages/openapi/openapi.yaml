        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listDrafts
      summary: List the drafts in a mailbox, newest first, with where each send stands.
      description: Only those who can read the mailbox can list them.
      x-cli-command: drafts list
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The mailbox's drafts.
          content:
            application/json:
              schema:
