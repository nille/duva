openapi: 3.1.0
info:
  title: Duva
  summary: A self-hosted mailbox platform on Amazon SES where humans and agents are both actors.
  description: >
    The only source of Duva's API contract. The TypeScript client and the CLI's
    API commands are generated from this document. Each operation's
    x-cli-command names the CLI command that calls it.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
security:
  - session: []
  - agentKey: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Show Duva's version and the deployment's region.
      description: Answers without sign-in, so any client can check that it reaches the deployment.
      x-cli-command: status
      security: []
      responses:
        "200":
          description: The deployment's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /whoami:
    get:
      operationId: whoami
      summary: Show the signed-in actor.
      x-cli-command: whoami
      responses:
        "200":
          description: The actor the call is attributed to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organization/changes:
    get:
      operationId: listOrganizationChanges
      summary: List the changes to the organization's setup after a position in its change feed.
      description: >
        Lists up to 100 changes, oldest first. To catch up, call again with
        the position the answer ends at until it lists no more. Only admins
        can read the organization's change feed.
      x-cli-command: organization changes
      parameters:
        - name: after
          in: query
          description: The position to list changes after. 0, the default, lists from the start.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The changes after the position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/settings:
    get:
      operationId: getOrganizationSettings
      summary: Read the organization's settings.
      description: Every actor can read them. Only admins change them.
      x-cli-command: organization settings
      responses:
        "200":
          description: The organization's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: changeOrganizationSettings
      summary: Change the organization's settings.
      description: >
        Give only the settings to change. A setting applies from when it
        changes, so turning on erasureErasesApprovals leaves the approval
        records of threads erased before then. Only admins can change the
        settings. Each change is recorded in the organization's change feed
        under you.
      x-cli-command: organization change-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsChanges"
      responses:
        "200":
          description: The organization's settings, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /preferences:
    get:
      operationId: getPreferences
      summary: Read your own preferences, such as how the web app shows times, dates and mail.
      description: Only humans have preferences, and each reads only their own.
      x-cli-command: preferences get
      responses:
        "200":
          description: Your preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: changePreferences
      summary: Change your own preferences.
      description: >
        Give only the preferences to change. They follow you to every browser
        you sign in from. Only humans have preferences, and each changes only
        their own. The CLI prints timestamps as ISO 8601 whatever they are.
      x-cli-command: preferences change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesChanges"
      responses:
        "200":
          description: Your preferences, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /humans:
    post:
      operationId: addHuman
      summary: Add a human to the organization by their email address, so they can sign in.
      description: >
        Only admins can add humans. The human signs in with a code emailed to
        the address, and has no mailbox until an admin creates one for them.
        Adding a human is a change to the organization's setup, recorded in
        its change feed.
      x-cli-command: humans add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewHuman"
      responses:
        "201":
          description: The human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Human"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listHumans
      summary: List the organization's humans.
      description: Only admins can list the organization's humans.
      x-cli-command: humans list
      responses:
        "200":
          description: The organization's humans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /humans/{human}:
    patch:
      operationId: changeHuman
      summary: Make a human an admin, or take it away.
      description: >
        Only admins can change who is an admin, and only humans can be
        admins. The organization always keeps one, so taking it from the last
        admin is refused. The change is recorded in the organization's change
        feed under you.
      x-cli-command: humans change
      parameters:
        - $ref: "#/components/parameters/Human"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanChanges"
      responses:
        "200":
          description: The human, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Human"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /humans/{human}/remove:
    post:
      operationId: removeHuman
      summary: Remove a human, handing over or deleting each of their mailboxes, and remove the agents they sponsor.
      description: >
        Only admins can remove humans. Run it first with dryRun to see the
        human's mailboxes, their agents and the agents' mailboxes. Then say
        what happens to each of the human's mailboxes: handOver gives it to
        the human handTo, as another personal mailbox of theirs with its
        addresses and mail, and delete erases it. The agents are removed, so
        their keys stop working, and their mailboxes are erased. Erasing a
        mailbox erases its mail everywhere Duva keeps it, as emptying Trash
        does, and its approval records only if the organization's settings
        say so. Its addresses are freed at once. The human's Cognito user is
        deleted and their sessions stop working. The organization always keeps
        one admin, so the last admin can't be removed. Each change is recorded
        in the organization's change feed under you, and older entries keep
        naming the human and their agents by ID.
      x-cli-command: humans remove
      parameters:
        - $ref: "#/components/parameters/Human"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanRemovalChoices"
      responses:
        "200":
          description: What the removal takes, removed unless it was a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanRemoval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents:
    post:
      operationId: createAgent
      summary: Create an agent, with you as its sponsor, and show its key once.
      description: >
        Only humans can create agents. The answer is the only time Duva shows
        the agent's key: it keeps only a hash. Creating an agent is a change
        to the organization's setup, recorded in its change feed.
      x-cli-command: agents create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAgent"
      responses:
        "201":
          description: The agent and its key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listAgents
      summary: List the agents you sponsor.
      x-cli-command: agents list
      responses:
        "200":
          description: The agents the signed-in actor sponsors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /agents/{agent}:
    delete:
      operationId: removeAgent
      summary: Remove an agent, which stops its key working and erases its mailboxes.
      description: >
        Only the agent's sponsor and admins can remove it. Its sends waiting
        for approval are withdrawn. Its mailboxes are erased everywhere Duva
        keeps their mail, as emptying Trash does, and their approval records
        only if the organization's settings say so. Their addresses are freed
        at once. The removal is recorded in the organization's change feed
        under you.
      x-cli-command: agents remove
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent, removed, and the mailboxes erased with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRemoval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agent}/key:
    post:
      operationId: rotateAgentKey
      summary: Give an agent you sponsor a new key, show it once, and refuse the old one from now on.
      description: >
        Only the agent's sponsor can rotate its key. Rotating is a change to
        the organization's setup, recorded in its change feed.
      x-cli-command: agents rotate-key
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent and its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents/{agent}/settings:
    get:
      operationId: getAgentSettings
      summary: Read an agent's settings, its sponsor access and its approval and disclosure-line switches.
      description: >
        Only the agent's sponsor and the agent itself can read them. An agent
        starts with no sponsor access and every switch on.
      x-cli-command: agents settings
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeAgentSettings
      summary: Change an agent's sponsor access or its approval and disclosure-line switches.
      description: >
        Give only the settings to change. A change works at once. Only the
        agent's sponsor can change them, so not even an admin can. Each change is
        recorded under you, with the old and new values, in your personal
        mailbox's change feed, or if you have none, in the agent's. If
        neither of you has a mailbox, the change is refused. Read lets the
        agent read your mailbox. Full also lets it organize it, move threads
        to Trash and back, draft there, and send as you. Lowering access from
        full, or removing it, withdraws the agent's sends waiting for your
        approval in your mailbox, recorded in its change feed under you, and
        fails those approved but not yet gone out. Its drafts and sent
        messages stay.
      x-cli-command: agents change-settings
      parameters:
        - $ref: "#/components/parameters/Agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSettingsChanges"
      responses:
        "200":
          description: The agent's settings, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /addresses:
    post:
      operationId: addAddress
      summary: Give a mailbox another address on one of the organization's domains.
      description: >
        Mail to the address, and to its plus-tagged addresses, reaches the
        mailbox from then on. A mailbox that had no address takes it as its
        default address. Only admins can add addresses, and an address in use
        is refused. Adding an address is a change to the organization's
        setup, recorded in its change feed under you.
      x-cli-command: addresses add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAddress"
      responses:
        "201":
          description: The address, with the mailbox it delivers to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listAddresses
      summary: List the organization's addresses, each with the mailbox it delivers to.
      description: Only admins can list the organization's addresses.
      x-cli-command: addresses list
      responses:
        "200":
          description: The organization's addresses, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /addresses/{address}:
    delete:
      operationId: removeAddress
      summary: Remove an address, so that its mail is refused from now on.
      description: >
        SES refuses mail to the address, and its plus-tagged addresses, at
        once, and the address can be given to any mailbox at once. The mail
        its mailbox already has stays there. If it was the mailbox's default
        address, the mailbox's earliest other address becomes its default.
        A mailbox left with no address keeps its mail, but receives and sends
        no new mail until it is given one. Only admins can remove addresses.
        Removing an address, and any change of default address it makes, are
        changes to the organization's setup, recorded in its change feed
        under you.
      x-cli-command: addresses remove
      parameters:
        - name: address
          in: path
          required: true
          description: The address, without a plus tag. Case doesn't matter.
          schema:
            type: string
      responses:
        "200":
          description: The address removed, with the mailbox it delivered to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes:
    post:
      operationId: createMailbox
      summary: Create a personal mailbox for a human or an agent, with an address on one of the organization's domains.
      description: >
        Only admins can create mailboxes. The address becomes the mailbox's
        default address, and mail to it is accepted from then on. An admin
        can't read a personal mailbox they don't own, even one they created,
        unless they sponsor the agent that owns it. Creating the
        mailbox and its address are changes to the organization's setup,
        recorded in its change feed.
      x-cli-command: mailboxes create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMailbox"
      responses:
        "201":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listMailboxes
      summary: List the mailboxes you can read, your own and those of the agents you sponsor.
      description: >
        An agent your sponsor gives read or full sponsor access also finds
        your sponsor's personal mailbox here, listed with that access.
      x-cli-command: mailboxes list
      responses:
        "200":
          description: The mailboxes the signed-in actor can read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mailboxes/{mailbox}:
    get:
      operationId: getMailbox
      summary: Read a mailbox you can read, with how many threads in its Inbox are unread.
      description: >
        Only the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give sponsor access can read it.
      x-cli-command: mailboxes get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The mailbox, with its unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxWithCounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeMailbox
      summary: Choose a mailbox's default address among its addresses.
      description: >
        New mail goes from the default address. Replies still go from the
        address the original was sent to. Only admins can choose it, and the
        choice is a change to the organization's setup, recorded in its
        change feed under you.
      x-cli-command: mailboxes change
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxChanges"
      responses:
        "200":
          description: The mailbox, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/changes:
    get:
      operationId: listMailboxChanges
      summary: List the changes in a mailbox after a position in its change feed.
      description: >
        Lists up to 100 changes, oldest first, leaving out the arrivals of
        mail judged to be spam unless asked for them. To catch up, call again with
        the position the answer ends at until it lists no more. Only the
        mailbox's owner, for an agent's mailbox its sponsor, and for a human's
        mailbox the agents they give sponsor access can read it.
      x-cli-command: mailboxes changes
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: after
          in: query
          description: The position to list changes after. 0, the default, lists from the start.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: spam
          in: query
          description: Lists the arrivals of mail judged to be spam too.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The changes after the position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads:
    get:
      operationId: listThreads
      summary: List the threads in a mailbox with a label, newest first.
      description: >
        Lists the threads a page at a time, newest first by their newest
        message. To read the next page, call again with the answer's next as
        after, until an answer has no next.
      x-cli-command: threads list
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: label
          in: query
          description: The label the threads carry. inbox, the default, lists the Inbox.
          schema:
            type: string
            default: inbox
        - name: limit
          in: query
          description: How many threads a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the threads with the label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/sent:
    get:
      operationId: listSentThreads
      summary: List the threads a mailbox has sent mail in, newest first.
      description: >
        Lists every thread with a message sent from the mailbox, except those
        in Spam and Trash, a page at a time, newest first by its newest message. To read the next page, call again with the answer's next as
        after, until an answer has no next.
      x-cli-command: threads sent
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: limit
          in: query
          description: How many threads a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the threads the mailbox has sent in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads/read:
    post:
      operationId: markThreadsRead
      summary: Mark threads in a mailbox read.
      description: >
        Marks each thread read. Read state belongs to the mailbox, so it is
        the same for each actor who reads it. Each thread
        that was unread gets a change in the mailbox's change feed, naming
        you. Only the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access
        can mark its threads.
      x-cli-command: threads mark-read
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadIds"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads/unread:
    post:
      operationId: markThreadsUnread
      summary: Mark threads in a mailbox unread.
      description: >
        Marks each thread unread, so it stands out until it is read again.
        Each thread that was read gets a change in the mailbox's change feed,
        naming you. Only the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access
        can mark its threads.
      x-cli-command: threads mark-unread
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadIds"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads/labels:
    post:
      operationId: labelThreads
      summary: Add labels to threads in a mailbox, and remove them.
      description: >
        Adds and removes the labels on each thread. Archiving removes inbox,
        and adding inbox moves a thread back to the Inbox, out of Spam,
        Trash and the Screener. Adding spam or trash takes a thread out of the Inbox. Removing
        spam (not spam) or trash (restore) puts it back in the Inbox, unless
        it still has the other, waits in the Screener, or inbox is removed too. Each thread whose labels change gets a change
        in the mailbox's change feed, naming you. Only the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access
        can label its threads.
      x-cli-command: threads label
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadLabels"
      responses:
        "200":
          description: The threads, as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/threads/{thread}:
    get:
      operationId: getThread
      summary: Read a thread, with each of its messages, oldest first.
