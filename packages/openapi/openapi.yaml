      operationId: labelThreads
      summary: Add labels to threads in a mailbox, and remove them.
      description: >
        Adds and removes the labels on each thread. Archiving removes inbox,
        and adding inbox moves a thread back to the Inbox, out of Spam,
        Trash and the Screener. Adding spam or trash takes a thread out of the Inbox. Removing
        spam (not spam) or trash (restore) puts it back in the Inbox, unless
        it still has the other, waits in the Screener, or inbox is removed too. Each thread whose labels change gets a change
        in the mailbox's change feed, naming you. Only the mailbox's owner and the
        agents they give organize sponsor access or more
        can label its threads.
      x-cli-command: threads label
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
