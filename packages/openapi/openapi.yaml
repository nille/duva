            application/json:
              schema:
                $ref: "#/components/schemas/LabelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createLabel
      summary: Create a label in a mailbox.
      description: >
        Creates a label of the mailbox's own, with a name no other label in it
        has, in any case. Then add it to threads by its ID. Only
        the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access can create its labels. The change is recorded in the
        mailbox's change feed, naming you.
      x-cli-command: labels create
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
