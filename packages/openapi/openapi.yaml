            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /groups/{group}:
    get:
      operationId: getGroup
      summary: Read a group, with its members.
      description: Only admins can read the organization's groups.
      x-cli-command: groups get
      parameters:
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeGroup
      summary: Change a group's members, who may send to it, or where external members' replies go.
      description: >
        Give only what to change. Members you give replace the group's
        members. A change works for mail that arrives from then on. Only
        admins can change groups, and each change is recorded in the
        organization's change feed under you.
      x-cli-command: groups change
      parameters:
        - $ref: "#/components/parameters/Group"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupChanges"
      responses:
        "200":
          description: The group, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGroup
      summary: Delete a group, so that mail to its address is refused from now on.
      description: >
        SES refuses mail to the group's address at once, and the address can
        be given to a mailbox or another group at once. The copies its members
        got stay theirs. Only admins can delete groups. Deleting one is a
        change to the organization's setup, recorded in its change feed under
        you.
      x-cli-command: groups delete
      parameters:
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: The group deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /domains:
    post:
      operationId: addDomain
      summary: Add a domain to the organization, standalone or an alias of one of its standalone domains.
      description: >
        Duva creates the domain's SES identity, with DKIM and its MAIL FROM
        domain, mail.<domain>, and answers with the DNS records to add at the
        domain's DNS provider. Duva doesn't change anyone's DNS. SES verifies
        the domain once its records are live, and the domain shows each
        record's status and SES's verification as they come. A standalone
        domain's addresses are its own. An alias domain mirrors every address
        of the standalone domain given as aliasOf, those added later too: mail
        to name@alias reaches the mailbox of name@standalone, and replies to it
        go out from name@alias. Only admins can add domains, and a domain the
        organization has, or one with an SES identity Duva didn't create, is
        refused. Adding a domain is a change to the organization's setup,
        recorded in its change feed under you.
      x-cli-command: domains add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDomain"
      responses:
        "201":
          description: The domain, with the DNS records it needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listDomains
      summary: List the organization's domains, each with its DNS records and SES's verification.
      description: >
        Each record's status is looked up when you ask: missing until DNS
        answers with its value, found once it does, and verified once SES has
        verified what the record is for, unless DNS answers with another
        value. Only admins can list the organization's domains.
      x-cli-command: domains list
      responses:
        "200":
          description: The organization's domains, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /domains/{domain}:
    get:
      operationId: getDomain
      summary: Show one of the organization's domains, with its DNS records and SES's verification.
      description: >
        Each record's status is looked up when you ask, so call it again to
        see SES verify the domain once its records are live. Only admins can
        read the organization's domains.
      x-cli-command: domains get
      parameters:
        - $ref: "#/components/parameters/Domain"
      responses:
        "200":
          description: The domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeDomain
      summary: Send sign-in codes from one of the organization's domains.
      description: >
        Sign-in codes come from no-reply@<domain>. The domain must be one SES
        has verified. Choosing it changes Cognito's sender at once, and duva
        deploy keeps it. The domain sign-in codes come from can't be removed,
        so choose another one before removing it. Only admins can choose, and
        the choice is a change to the organization's setup, recorded in its
        change feed under you.
      x-cli-command: domains change
      parameters:
        - $ref: "#/components/parameters/Domain"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainChanges"
      responses:
        "200":
          description: The domain, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /domains/{domain}/remove:
    post:
      operationId: removeDomain
      summary: Remove a domain with its addresses, and its alias domains if it is a standalone domain.
      description: >
        Run it first with dryRun to see the domains it removes, the addresses
        that stop receiving mail and the mailboxes left without an address.
        Removing a standalone domain removes its addresses, deleting the
        groups among them, and its alias domains with the addresses they
        mirror, since an alias domain mirrors nothing without it. The
        addresses that stop working leave every group they are members of. Removing an alias domain removes only what it
        mirrors. SES refuses mail to those addresses at once, and the domains'
        SES identities are deleted. The mail the mailboxes have stays. A
        mailbox left with no address keeps its mail, but receives and sends no
        new mail until it is given one. The domain sign-in codes come from
        can't be removed, so choose another one first. Only admins can remove
        domains. Each removal, and each address removed, is a change to the
        organization's setup, recorded in its change feed under you.
      x-cli-command: domains remove
      parameters:
        - $ref: "#/components/parameters/Domain"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainRemovalChoices"
      responses:
        "200":
          description: What the removal takes, removed unless it was a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainRemoval"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /domains/{domain}/catch-all:
    put:
      operationId: setCatchAll
      summary: Set a standalone domain's catch-all, a mailbox or a group, for mail to addresses the organization doesn't have.
      description: >
        Give the mailbox's ID or the group's address. Mail to an address on
        the domain, or on its alias domains, that isn't one of the
        organization's, removed ones included, goes to the catch-all instead
        of being refused. A mailbox's Screener applies to it, and a group
        delivers it to its members, skipping their Screeners, as group mail
        does. Deleting the mailbox or the group clears the catch-all. Only
        admins can set it, and each change is a change to the organization's
        setup, recorded in its change feed under you.
      x-cli-command: domains set-catch-all
      parameters:
        - $ref: "#/components/parameters/Domain"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatchAll"
      responses:
        "200":
          description: The domain, with its catch-all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: clearCatchAll
      summary: Clear a domain's catch-all, so that mail to addresses the organization doesn't have is refused again.
      description: >
        SES refuses such mail on the domain and its alias domains at once.
        Mail the catch-all already got stays. Only admins can clear it, and
