          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/search:
    get:
      operationId: searchMailbox
      summary: Search a mailbox's threads by words, meaning and filters.
      description: >
        Finds the threads whose messages have every word in q, or mean what
        its words say, best first. Each comes with the message that matched
        best and a snippet of its text where the words stand. A "quoted
        phrase" or subject: matches by its words alone, and every filter
        holds. Subjects, senders and recipients by name and address, message
        text and attachment names are searched, Sent included. A word also
        finds its other forms in English and Swedish, as invoice finds
        invoices and faktura finds fakturan. Threads in Spam and Trash, and those waiting in the
        Screener, are left out unless q has label:spam or label:trash. New
        mail is found within a minute, and label and read changes count at
        once. Only those who can read the mailbox can search it. To read the
        next page, call again with the answer's next as after.
      x-cli-command: search
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - name: q
          in: query
          required: true
          description: >
            What to search for: words, "quoted phrases", and the filters
            from: and to: (part of a name or address), subject: (a word or
            quoted phrase in the subject), label: (a label's name, quoted if
            it has spaces), has:attachment, is:unread, after: (received on or
            after the day) and before: (received before the day), with days as
            YYYY-MM-DD in UTC. Every phrase and filter must hold.
          schema:
            type: string
            examples: ['invoice from:ada after:2026-09-01 "hosting plan"']
        - name: sort
          in: query
          description: Best first, or newest first. Without words or phrases, both are newest first.
          schema:
            type: string
            enum: [relevance, newest]
            default: relevance
        - name: limit
          in: query
          description: How many threads a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the threads found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/labels:
    get:
      operationId: listLabels
      summary: List a mailbox's labels, with how many unread threads each has.
      description: >
        Lists the built-in labels inbox, spam and trash first, then the
        mailbox's own labels by name. Only those who can read the mailbox can
        list its labels.
      x-cli-command: labels list
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createLabel
      summary: Create a label in a mailbox.
      description: >
        Creates a label of the mailbox's own, with a name no other label in it
        has, in any case. Then add it to threads by its ID. Only
        the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access can create its labels. The change is recorded in the
        mailbox's change feed, naming you.
      x-cli-command: labels create
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLabel"
      responses:
        "201":
          description: The label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /mailboxes/{mailbox}/labels/{label}:
    patch:
      operationId: renameLabel
      summary: Rename one of a mailbox's own labels.
      description: >
        Gives the label a name no other label in the mailbox has, in any case.
        Its threads keep it. The built-in labels can't be renamed. Only
        the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access can rename its labels. The change
        is recorded in the mailbox's change feed, naming you.
      x-cli-command: labels rename
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Label"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLabel"
      responses:
        "200":
          description: The label, renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteLabel
      summary: Delete one of a mailbox's own labels.
      description: >
        Removes the label from each of its threads, each with a change in the
        mailbox's change feed, and then deletes it. The threads stay. The
        built-in labels can't be deleted. If deleting stops partway, delete
        the label again to finish. Only the mailbox's owner, for an agent's mailbox its sponsor, and
        for a human's mailbox the agents they give full sponsor access can delete its labels.
      x-cli-command: labels delete
      parameters:
        - $ref: "#/components/parameters/Mailbox"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The label, as it was before it was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/trash/empty:
    post:
      operationId: emptyTrash
      summary: Empty a mailbox's Trash, erasing every thread in it for good.
      description: >
        Erases each thread that is in Trash when you call, with its messages
        and their raw copies, every stored version included. Erasing can't be
        undone. Each erased thread gets a threadErased change in the mailbox's
        change feed, naming you, with none of its content. Duva erases the
        threads right after answering, and finishes on its next daily run if
        that fails. Only the mailbox's owner can empty its Trash, and an agent's
        sponsor its agent's. An agent never empties its sponsor's Trash, whatever
        its sponsor access. Without emptying, Trash and Spam are erased 30
        days after a thread got the label.
      x-cli-command: threads empty-trash
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "202":
          description: Duva is erasing the threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashEmptying"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/screener:
    get:
      operationId: getScreener
      summary: Read a mailbox's Screener, with the first-time senders whose mail waits there.
      description: >
        Lists each sender whose mail waits, newest first, with their waiting
        threads, newest first. Mail waiting in the Screener is in no other
        listing and no unread count. Says whether the Screener is on, and how
        many senders the mailbox has let in and blocked. Only those who can
        read the mailbox can read its Screener.
      x-cli-command: screener get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
