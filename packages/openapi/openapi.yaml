openapi: 3.1.0
info:
  title: Duva
  summary: A self-hosted mailbox platform on Amazon SES where humans and agents are both actors.
  description: >
    The only source of Duva's API contract. The TypeScript client and the CLI's
    API commands are generated from this document. Each operation's
    x-cli-command names the CLI command that calls it.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
security:
  - session: []
  - agentKey: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Show Duva's version and the deployment's region.
      description: Answers without sign-in, so any client can check that it reaches the deployment.
      x-cli-command: status
      security: []
      responses:
        "200":
          description: The deployment's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /whoami:
    get:
      operationId: whoami
      summary: Show the signed-in actor.
      x-cli-command: whoami
      responses:
        "200":
          description: The actor the call is attributed to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organization/changes:
    get:
      operationId: listOrganizationChanges
      summary: List the changes to the organization's setup after a position in its change feed.
      description: >
        Lists up to 100 changes, oldest first. To catch up, call again with
        the position the answer ends at until it lists no more. Only admins
        can read the organization's change feed.
      x-cli-command: organization changes
      parameters:
        - name: after
          in: query
          description: The position to list changes after. 0, the default, lists from the start.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The changes after the position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/mailboxes:
    get:
      operationId: listOrganizationMailboxes
      summary: List every mailbox in the organization, with its addresses and the actor that owns it.
      description: >
        For giving mailboxes addresses and choosing their default address. It
        lists what reaches each mailbox and who owns it, and reads none of
        their mail, which admins can't read. Only admins can list the
        organization's mailboxes.
      x-cli-command: organization mailboxes
      responses:
        "200":
          description: The organization's mailboxes, and the actors that own them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMailboxList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/agents:
    get:
      operationId: listOrganizationAgents
      summary: List every agent in the organization, with its sponsor.
      description: >
        For seeing who sponsors which agent, and removing agents. Only admins
        can list the organization's agents. A human lists the agents they
        sponsor with agents list.
      x-cli-command: organization agents
      responses:
        "200":
          description: The organization's agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/settings:
    get:
      operationId: getOrganizationSettings
      summary: Read the organization's settings.
      description: Every actor can read them. Only admins change them.
      x-cli-command: organization settings
      responses:
        "200":
          description: The organization's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: changeOrganizationSettings
      summary: Change the organization's settings.
      description: >
        Give only the settings to change. A setting applies from when it
        changes, so turning on erasureErasesApprovals leaves the approval
        records of threads erased before then. A shorter retentionDays
        reaches back: the eraser's next daily run erases every thread that
        has had Trash or Spam longer than it. Preview the period first to see
        how many. Lowering an agent cap lowers each agent above it, each
        recorded as a change to its settings under you. Only admins can
        change the settings. Each change is recorded in the organization's
        change feed under you.
      x-cli-command: organization change-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsChanges"
      responses:
        "200":
          description: The organization's settings, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/settings/retention-preview:
    get:
      operationId: previewRetention
      summary: Count the threads the eraser's next run would erase under a retention period.
      description: >
        Counts the threads in every mailbox's Trash and Spam that are older
        than retentionDays now, counted from when each got the label. With
        that retention period, the eraser's next daily run erases them, and
        any that pass it before the run. It counts threads, and reads none of
        them. Only admins can preview the retention period.
      x-cli-command: organization preview-retention
      parameters:
        - name: retentionDays
          in: query
          required: true
          description: The retention period to preview, in days, a whole number from 7 to 365.
          schema:
            type: integer
            minimum: 7
            maximum: 365
      responses:
        "200":
          description: How many threads the period would erase now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /preferences:
    get:
      operationId: getPreferences
      summary: Read your own preferences, such as how the web app shows times, dates and mail.
      description: Only humans have preferences, and each reads only their own.
      x-cli-command: preferences get
      responses:
        "200":
          description: Your preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: changePreferences
      summary: Change your own preferences.
      description: >
        Give only the preferences to change. They follow you to every browser
        you sign in from. Only humans have preferences, and each changes only
        their own. The CLI prints timestamps as ISO 8601 whatever they are.
      x-cli-command: preferences change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesChanges"
      responses:
        "200":
          description: Your preferences, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /humans:
    post:
      operationId: addHuman
      summary: Add a human to the organization by their email address, so they can sign in.
      description: >
        Only admins can add humans. The human signs in with a code emailed to
        the address, and has no mailbox until an admin creates one for them.
        Adding a human is a change to the organization's setup, recorded in
        its change feed.
      x-cli-command: humans add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewHuman"
      responses:
        "201":
          description: The human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Human"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listHumans
      summary: List the organization's humans.
      description: Only admins can list the organization's humans.
      x-cli-command: humans list
      responses:
        "200":
          description: The organization's humans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /humans/{human}:
    patch:
      operationId: changeHuman
      summary: Make a human an admin, or take it away.
      description: >
        Only admins can change who is an admin, and only humans can be
        admins. The organization always keeps one, so taking it from the last
        admin is refused. The change is recorded in the organization's change
        feed under you.
      x-cli-command: humans change
      parameters:
        - $ref: "#/components/parameters/Human"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanChanges"
      responses:
        "200":
          description: The human, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Human"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /humans/{human}/remove:
    post:
      operationId: removeHuman
      summary: Remove a human, handing over or deleting each of their mailboxes, and remove the agents they sponsor.
      description: >
        Only admins can remove humans. Run it first with dryRun to see the
        human's mailboxes, their agents and the agents' mailboxes. Then say
        what happens to each of the human's mailboxes: handOver gives it to
        the human handTo, as another personal mailbox of theirs with its
        addresses and mail, and delete erases it. The agents are removed, so
        their keys stop working, and their mailboxes are erased. Erasing a
        mailbox erases its mail everywhere Duva keeps it, as emptying Trash
        does, and its approval records only if the organization's settings
        say so. Its addresses are freed at once. The human's Cognito user is
        deleted and their sessions stop working. The organization always keeps
        one admin, so the last admin can't be removed. Each change is recorded
        in the organization's change feed under you, and older entries keep
        naming the human and their agents by ID.
      x-cli-command: humans remove
      parameters:
        - $ref: "#/components/parameters/Human"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanRemovalChoices"
      responses:
        "200":
          description: What the removal takes, removed unless it was a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanRemoval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents:
    post:
      operationId: createAgent
      summary: Create an agent, with you as its sponsor, and show its key once.
      description: >
        Only humans can create agents. The answer is the only time Duva shows
        the agent's key: it keeps only a hash. Creating an agent is a change
        to the organization's setup, recorded in its change feed.
      x-cli-command: agents create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAgent"
      responses:
        "201":
          description: The agent and its key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listAgents
      summary: List the agents you sponsor, each with how many sends it has left this hour.
      x-cli-command: agents list
      responses:
        "200":
          description: The agents the signed-in actor sponsors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /agents/{agent}:
    patch:
      operationId: changeAgent
      summary: Make an agent you sponsor an admin, or take it away.
      description: >
        Only the agent's sponsor can, and only while they are an admin
        themselves to make it one. No agent can change who is an admin. An
        agent admin's changes to the setup wait for your approval unless you
        switch approvalForSetup off in its settings, and it never removes
        humans or agents, or changes who is an admin. It stops being an admin when you
        do, and its setup changes still waiting are withdrawn. The change is
        recorded in the organization's change feed under you.
      x-cli-command: agents change
      parameters:
        - $ref: "#/components/parameters/Agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChanges"
      responses:
        "200":
          description: The agent, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeAgent
      summary: Remove an agent, which stops its key working and erases its mailboxes.
      description: >
        Only the agent's sponsor and human admins can remove it, never an
        agent, not even an agent admin. Its sends and setup changes waiting
        for approval are withdrawn. Its mailboxes are erased everywhere Duva
        keeps their mail, as emptying Trash does, and their approval records
        only if the organization's settings say so. Their addresses are freed
        at once. The removal is recorded in the organization's change feed
        under you.
      x-cli-command: agents remove
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent, removed, and the mailboxes erased with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRemoval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agent}/key:
    post:
      operationId: rotateAgentKey
      summary: Give an agent you sponsor a new key, show it once, and refuse the old one from now on.
      description: >
        Only the agent's sponsor can rotate its key. Rotating is a change to
        the organization's setup, recorded in its change feed.
      x-cli-command: agents rotate-key
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent and its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWithKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents/{agent}/pause:
    post:
      operationId: pauseAgent
      summary: Pause an agent, which refuses its key and holds its approved sends until it is unpaused.
      description: >
        Only the agent's sponsor and admins can pause it. While it is paused,
        every call with its key is refused with 403, its approvals wait but
        can't be sent, and its sends already approved are held. Mail to its
        mailboxes keeps arriving. Pausing is recorded under you in the change
        feed of each of the agent's mailboxes and in the organization's.
        Pausing a paused agent changes nothing.
      x-cli-command: agents pause
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent, paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agent}/unpause:
    post:
      operationId: unpauseAgent
      summary: Unpause an agent, which lets its key work again and sends what it held.
      description: >
        Only the agent's sponsor and human admins can unpause it, never an
        agent. Its sends held while it was paused go out, those from each
        mailbox oldest first, so look at them first.
        Unpausing is recorded under you in the change feed of each of the
        agent's mailboxes and in the organization's. Unpausing an agent that
        isn't paused changes nothing.
      x-cli-command: agents unpause
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent, unpaused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agent}/settings:
    get:
      operationId: getAgentSettings
      summary: Read an agent's settings, its sponsor access, its approval and disclosure-line switches and its send limits.
      description: >
        Only the agent's sponsor and the agent itself can read them. An agent
        starts with no sponsor access, every switch on, and send limits of
        100 an hour and 50 new recipients a day.
      x-cli-command: agents settings
      parameters:
        - $ref: "#/components/parameters/Agent"
      responses:
        "200":
          description: The agent's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: changeAgentSettings
      summary: Change an agent's sponsor access, its approval and disclosure-line switches, or its send limits.
      description: >
        Give only the settings to change. A change works at once. Only the
        agent's sponsor can change them, so not even an admin can. Each change is
        recorded under you, with the old and new values, in your personal
        mailbox's change feed, or if you have none, in the agent's. If
        neither of you has a mailbox, the change is refused. Read lets the
        agent read your mailbox. Full also lets it organize it, move threads
        to Trash and back, draft there, and send as you. Lowering access from
        full, or removing it, withdraws the agent's sends waiting for your
        approval in your mailbox, recorded in its change feed under you, and
        fails those approved but not yet gone out. Its drafts and sent
        messages stay. Send limits go up to the organization's caps, and
        raising one lets its sends that wait go out as far as the new limit
        allows.
      x-cli-command: agents change-settings
      parameters:
        - $ref: "#/components/parameters/Agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSettingsChanges"
      responses:
        "200":
          description: The agent's settings, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents/{agent}/activity:
    get:
      operationId: getAgentActivity
      summary: Read an agent's daily summaries, how much it sent, had approved or rejected, received, organized and screened each day.
      description: >
        Gives every day from from to to, newest first, each day in your time
        zone, days without activity included. Leave both out for the last 30
        days. Activity reaches back to the agent's start: what happened in its
        mailboxes, what it did in its sponsor's mailbox, and the organization's
        changes to it. Only the agent's sponsor and admins can read it.
      x-cli-command: agents activity
      parameters:
        - $ref: "#/components/parameters/Agent"
        - name: from
          in: query
          description: The first day, as YYYY-MM-DD. Defaults to 29 days before to.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last day, as YYYY-MM-DD, at most 366 days after from. Defaults to today in your time zone.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: The agent's daily summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agent}/activity/{day}:
    get:
      operationId: getAgentActivityDay
      summary: Read an agent's timeline for one day, everything it did and what happened in its mailboxes, newest first.
      description: >
        Lists the day's entries a page at a time, newest first. Each is a
        change as the change feed recorded it, with the mailbox it was in and
        its thread, where it has them. To read the next page, call again with
        the answer's next as after, until an answer has no next. Only the
        agent's sponsor and admins can read it. An admin who isn't the
        sponsor reads no part of what the mail says, so the changes leave out
        approvers' edits and notes, label names, and senders' and recipients'
        addresses.
      x-cli-command: agents timeline
      parameters:
        - $ref: "#/components/parameters/Agent"
        - name: day
          in: path
          required: true
          description: The day, as YYYY-MM-DD, in your time zone.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/TimeZone"
        - name: limit
          in: query
          description: How many entries a page lists at most.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Where the page starts, the next of the page before it. Leave it out for the first page.
          schema:
            type: string
      responses:
        "200":
          description: A page of the day's timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityTimeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /addresses:
    post:
      operationId: addAddress
      summary: Give a mailbox another address on one of the organization's standalone domains.
      description: >
        Mail to the address, and to its plus-tagged addresses, reaches the
        mailbox from then on, as does mail to the same address on each of the
        domain's alias domains. A mailbox that had no address takes it as its
        default address. Only admins can add addresses, and an address in use
        is refused. Adding an address is a change to the organization's
        setup, recorded in its change feed under you.
      x-cli-command: addresses add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAddress"
      responses:
        "201":
          description: The address, with the mailbox it delivers to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listAddresses
      summary: List the organization's addresses, each with the mailbox it delivers to.
      description: Only admins can list the organization's addresses.
      x-cli-command: addresses list
      responses:
        "200":
          description: The organization's addresses, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /addresses/{address}:
    delete:
      operationId: removeAddress
      summary: Remove an address, so that its mail is refused from now on.
      description: >
        SES refuses mail to the address, and its plus-tagged addresses, at
        once, and the address can be given to any mailbox at once. The mail
        its mailbox already has stays there. If it was the mailbox's default
        address, the mailbox's earliest other address becomes its default.
        A mailbox left with no address keeps its mail, but receives and sends
        no new mail until it is given one. Only admins can remove addresses.
        Removing an address, and any change of default address it makes, are
        changes to the organization's setup, recorded in its change feed
        under you.
      x-cli-command: addresses remove
      parameters:
        - name: address
          in: path
          required: true
          description: The address, without a plus tag. Case doesn't matter.
          schema:
            type: string
      responses:
        "200":
          description: The address removed, with the mailbox it delivered to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups:
    post:
      operationId: createGroup
      summary: Create a group, an address that delivers a copy of each message to every member.
      description: >
        Members are addresses: the organization's own, of mailboxes or other
        groups, and external addresses. Each local member's mailbox gets its
        own copy, marked with the group, which skips its Screener. A member
        that is a group gives its members a copy too, and each mailbox gets
        one copy however many ways it is a member. External members get the
        copy re-sent from the group's address, as "Alice via team", with
        Reply-To as the group's replyTo says. Mail from a sender the group's
        sendPolicy doesn't allow is bounced. Only admins can create groups.
        Creating one is a change to the organization's setup, recorded in its
        change feed under you.
      x-cli-command: groups create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGroup"
      responses:
        "201":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "202":
          $ref: "#/components/responses/SetupAsked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listGroups
      summary: List the organization's groups, with their members.
