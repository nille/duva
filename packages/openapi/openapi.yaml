        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/trash/empty:
    post:
      operationId: emptyTrash
      summary: Empty a mailbox's Trash, erasing every thread in it for good.
      description: >
        Erases each thread that is in Trash when you call, with its messages
        and their raw copies, every stored version included. Erasing can't be
        undone. Each erased thread gets a threadErased change in the mailbox's
        change feed, naming you, with none of its content. Duva erases the
        threads right after answering, and finishes on its next daily run if
        that fails. Only the mailbox's owner can empty its Trash, and an agent's
        sponsor its agent's. An agent never empties its sponsor's Trash, whatever
        its sponsor access. Without emptying, Trash and Spam are erased after
        the organization's retention period, counted from when a thread got
        the label.
      x-cli-command: threads empty-trash
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "202":
          description: Duva is erasing the threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashEmptying"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /mailboxes/{mailbox}/screener:
    get:
      operationId: getScreener
      summary: Read a mailbox's Screener, with the first-time senders whose mail waits there.
      description: >
        Lists each sender whose mail waits, newest first, with their waiting
        threads, newest first. Mail waiting in the Screener is in no other
        listing and no unread count. Says whether the Screener is on, and how
        many senders the mailbox has let in and blocked. Only those who can
        read the mailbox can read its Screener.
      x-cli-command: screener get
      parameters:
        - $ref: "#/components/parameters/Mailbox"
      responses:
        "200":
          description: The Screener.
