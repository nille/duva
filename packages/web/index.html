    <!--
      Direction contract, seed 6c0f3a48 (#105).
      THESIS: Duva's mail on one plane, like a precise instrument. The list and the letter lie side by side, with no boxes. It refuses the boxed, card-panel mail client.
      OWN-WORLD: aluminium greys in three tones: the side column #e6e6e2, the list #efefec and the reader #f8f8f6, with ink #161616. Color is a function code, never decoration: orange #ff5a1f needs you, blue #2e62ff marks an agent, green #12a150 is sent or healthy, red #e5243b is an alert. JetBrains Mono, with ligatures, sets all text; Familjen Grotesk sets the headings. Shortcuts show as printed key caps. Actors are marked by shape: a human a filled dot, an agent a blue diamond, Duva a ring.
      STORY: a human reads and answers mail without leaving the list. They see at once what waits for them and what an agent did, and approve in the same place.
      FIRST VIEWPORT: across the full width, the side column (Duva, Write, the Approvals count in orange, Alerts, views, labels and agents), the Inbox list, about 31rem, the open thread filling the rest, and a thin status strip along the foot. Reply, the primary action, sits under the newest message. On phones: one top row, one column, and the bottom tab bar.
      FORM: North Window Desk, re-rolled to Field Desk on Nicklas's steer. Seed 6c0f3a48.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
